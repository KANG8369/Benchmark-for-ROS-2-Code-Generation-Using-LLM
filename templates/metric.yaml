# Copy this file to benchmarks/<package_name>/metric.yaml.
#
# A metric represents one package capability.
# Each pass criterion describes exactly one independently verifiable behavior.
# Split behaviors into separate criteria when one can pass while another fails.
# Multiple files that demonstrate the same behavior may remain as evidence for
# one criterion, and one evidence excerpt may support more than one criterion.
# Reference evidence identifies where the criterion was derived from in the
# reference package. The snippet must be an exact, contiguous excerpt, but it
# is provenance for the criterion and must not be used to require code identity.
# Include only the minimum code needed for the criterion; there is no fixed
# line-count limit. If proof is non-contiguous, use multiple short evidence
# items instead of expanding one snippet across unrelated code.

schema_version: "2.0"

package_name: example_package

reference:
  root: reference/

evaluation_policy:
  equivalence: semantic
  exact_constants_only_when_specified: true

metrics:
  - id: M-1
    name: Example Capability
    description: >-
      Describe the package capability evaluated by this metric.
    requirement_ids:
      - FR-1

    pass_criteria:
      - id: M-1-PC-1
        text: >-
          Describe one independently verifiable package behavior.
        evaluation: static
        reference_evidence:
          - kind: source_code
            path: src/example_node.cpp
            locator: ExampleNode::callback
            snippet: |-
              void ExampleNode::callback()
              {
                publisher_->publish(message_);
              }
            explanation: >-
              Explain how this reference code demonstrates the criterion.

      - id: M-1-PC-2
        text: >-
          Describe another independently verifiable package behavior.
        evaluation: static
        reference_evidence:
          - kind: launch
            path: launch/example.launch.py
            locator: generate_launch_description
            snippet: |-
              def generate_launch_description():
                  return LaunchDescription([example_node])
            explanation: >-
              Explain how the launch configuration supports this behavior.

  - id: M-2
    name: Another Capability
    description: >-
      Describe another major capability of the package.
    requirement_ids:
      - FR-2

    pass_criteria:
      - id: M-2-PC-1
        text: >-
          Describe one behavior required to satisfy this capability.
        evaluation: static
        reference_evidence:
          - kind: config
            path: config/example.yaml
            locator: example_node.ros__parameters
            snippet: |-
              example_node:
                ros__parameters:
                  enabled: true
            explanation: >-
              Explain how this configuration contributes to the behavior.
