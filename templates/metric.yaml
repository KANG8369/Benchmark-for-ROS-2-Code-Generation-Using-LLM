# Copy this file to benchmarks/<package_name>/metric.yaml.
#
# metrics repeats the public Description FRs exactly and adds hidden pass
# criteria for the Evaluator. Every FR must have one or more PCs.
#
# PC entries contain only id and text. Do not add evaluation, reference,
# reference_evidence, requirement_ids, paths, anchors, snippets, explanations,
# or implementation-specific function/class/file requirements.

package_name: example_package

metrics:
  - id: FR-1
    text: >-
      Describe one public observable package behavior.
    pass_criteria:
      - id: FR-1-PC-1
        text: >-
          Describe one independently verifiable behavior required by FR-1.

      - id: FR-1-PC-2
        text: >-
          Describe another independently verifiable behavior required by
          FR-1.

  - id: FR-2
    text: >-
      Describe a second distinct public behavior without prescribing
      incidental implementation details.
    pass_criteria:
      - id: FR-2-PC-1
        text: >-
          Describe one independently verifiable behavior required by FR-2.
