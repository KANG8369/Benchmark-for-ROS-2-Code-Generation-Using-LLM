status: user_approved_for_measured_conditions_only
clock: monotonic_wall_time_not_simulation_time
conservative_delegated_choices: conservative_limits.yaml
scope_rules:
- Values apply only to the conditions listed below, not every metric in a case.
- >-
  Startup is process invocation to the specified observable output or service with valid
  prerequisites available.
- Response is stimulus publication or service request to the corresponding observed output
  or reply.
- Shutdown is an operator SIGINT to process exit; it is not physical robot stopping time.
- >-
  Except where shutdown is itself a stated requirement, the shutdown limit is a harness
  cleanup budget, not an additional FR.
- The 30-second observation window is separate from these waiting limits.
- These records do not deploy or modify the runner and do not prove all FRs or runtime behaviors.
- Earlier calibration reports retain their original proposal-only status as historical evidence.
- >-
  Additional paths use the separately adopted engineering rules in evaluation_protocol.yaml;
  this file still distinguishes measured conditions from extrapolation.
cases:
  wall_follower_ros2:
    startup_seconds: 8
    response_seconds: 1
    shutdown_seconds: 2
    metric_ids:
    - DYN-01
    - DYN-03
    measured_condition: Standalone controller; clear, front-blocked and all-blocked scans
      at 10 Hz; SIGINT.
    response_events:
    - scan_pattern_to_expected_Twist
    - SIGINT_to_zero_Twist
    startup_observation: first_expected_Twist
    excluded:
    - Gazebo_launch_startup
    - physical_motion_completion
    - other_obstacle_patterns
  turtlebot3_aruco_tracker:
