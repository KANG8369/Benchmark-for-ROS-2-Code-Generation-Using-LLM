  question: 다섯 방향 구간의 경계와 obstacle pattern별 전진/좌회전/후진회전 대응표를 어떻게 정할까요? 거리 판정 경계 및 속도 비교 오차도 필요합니다.
  proposed_basis: Description에는 정확한 경계·대응표가 없어 별도 합의가 필요합니다. 고정 벽 간격이나 무충돌 목표를 새로 추가하지 않습니다.
