review_rules:
- Q-*는 협의 항목의 식별자이며 임계값 변수나 Test Generator가 채워도 되는 기본값이 아님
- 미합의 임계값이나 판정 정의를 모델 또는 실행기가 임의로 결정하지 않음
- 기본 관측은 30초이며 명시적으로 위임 채택한 자동주차 DYN-04만 60초로 연장함; 다른 시간 부족을 성공으로 처리하지 않음
- 시뮬레이션에서는 simulation time, 비시뮬레이션에서는 단조 증가 실행시간을 사용할지 실행 전 명시함
- 관측 시작을 첫 성공 출력까지 늦춰 무출력 또는 지연을 숨기지 않음
- 유효한 자극이 도달했는데 필수 출력이 전혀 없는 경우 성공으로 처리하지 않음
- 외부 의존성 미준비와 생성 패키지 자체의 실행 실패를 구분함
- 외부 시스템의 주행, 감지 모델 정확도, 시각화 구현을 대상 패키지의 책임으로 추가하지 않음
- Description의 정수 개수, 이름, 순서, configured 값은 그대로 사용하고 새로운 Hz, FPS, 성공률, 충돌률을 추가하지 않음
- 순수 복사, 명시된 zero, 동일 header 등 정확한 계약은 그대로 비교하며 모든 항목에 임의의 오차를 붙이지 않음
- 수치 오차가 필요한 연산은 아래 협의 후 확정하고 정답 소스의 구현 방식 자체를 강제하지 않음
- conservative_limits.yaml의 수치는 명시적 사용자 위임에 따른 공학적 여유이며 통계적으로 검증된 경계가 아님
- source_fr_mapping은 사람이 출처를 검토하기 위한 연결이며 정적 FR-PC와 동적 판정의 자동 대응 규칙이 아님
- 이 문서는 절차상 실행을 보류한다는 뜻이며 기존 실행기의 강제 차단 기능을 구현한 것은 아님
questions:
- id: Q-TIME-01
  kind: threshold_and_clock
  applies_to: all_cases
  question: 정상 기준 실행으로 측정한 뒤 합의하기로 했습니다. 30초 관측과 별개로 시작, 메시지 처리, 복구, endpoint 발견, 종료의 시간 및 timestamp 지연을
    측정하고 제안값과 원시 측정치를 분리해 검토합니다.
  proposed_basis: 정상 외부 환경의 지연을 먼저 측정하고 목적별 값을 합의합니다. configured timeout/duration은 그대로 사용하되 스케줄링 오차는 별도
    합의합니다. 수치가 정해지기 전 처리 지연이나 timeout을 임의의 성능 실패로 판정하지 않습니다.
  values:
    status: approved_for_measured_conditions_only
    record: approved_timing.yaml
    startup_seconds:
    - 7
    - 8
    measured_response_seconds:
    - 1
    - 2
    cleanup_seconds: 2
  approved_conditions_clock: monotonic_wall_time
  clock_choice_pending_for_unmeasured_conditions: true
- id: Q-IMAGE-01
  kind: numerical_oracle_and_coverage
  applies_to:
  - image_tools
  - image_proc
  - turtlebot3_yolo_object_detection
  - nav2_waypoint_follower
  question: 지원 encoding별 입력 집합과 영상 비교 방법을 어떻게 정할까요? 복사/flip은 픽셀 대응, 색 변환/보간/JPEG은 내용 또는 픽셀 오차로 구분해야 합니다.
  proposed_basis: lossless 변환은 정의된 기하·채널 대응을 확인하고, 손실 압축과 보간은 합의한 입력 기반 oracle 및 오차를 사용합니다. 임의 PSNR, IoU,
    MAE 값은 넣지 않습니다.
  values: null
- id: Q-IMAGE-02
  kind: observability
  applies_to:
  - image_proc
  question: 구독자가 없을 때 실제 처리하지 않는다는 조건을 어떤 비침습 관측으로 확인할까요? 출력이 없다는 사실만으로 내부 처리가 없었다고 판정하지 않겠습니다.
  proposed_basis: 대상의 기능을 대체하지 않는 tracing 등 관측 가능성을 먼저 검토
  values: null
- id: Q-PARK-01
  kind: numerical_tolerance
  applies_to:
  - turtlebot3_automatic_parking
  question: 반사 구간의 시작/중앙/끝 검출은 scan bin 기준으로 비교할까요, 실제 위치 오차로 비교할까요?
  proposed_basis: lidar 각도 분해능과 반사 표적의 알려진 기하에 근거해 허용 bin 수 또는 거리 오차를 합의
  values: null
- id: Q-PARK-02
  kind: stationary_observation_and_deadline
  applies_to:
  - turtlebot3_automatic_parking
  question: 기록된 이상적 2D fixture의 주차 완료 한도는 위임에 따라 120초로 채택했습니다. 전체 footprint 포함·정지·정상 종료는 유지하며 실기기 정지 오차·지속시간과
    다른 환경의 한도는 미정입니다.
  proposed_basis: 사용자 합의에 따라 주차 영역과 robot footprint를 사용합니다. 중심점만 영역에 들어간 것을 성공으로 세지 않으며 별도의 목표 heading은
    강제하지 않습니다.
  values:
    status: delegated_fixture_only
    record: conservative_limits.yaml
    ideal_fixture_completion_seconds: 120
- id: Q-PARK-03
  kind: description_clarification
  applies_to:
  - turtlebot3_automatic_parking
  question: FR-4의 reset points가 어떤 관측 가능한 maneuver 사건인지 확정해 주세요.
  proposed_basis: Description에는 reset 사건 목록이 없습니다. 후보 코드가 선택한 사건을 정답으로 삼거나 특정 과거 구현의 단계 개수를 임의로 강제하지 않습니다.
  values: null
- id: Q-PARK-04
  kind: reporting_coverage
  applies_to:
  - turtlebot3_automatic_parking
  question: 측정된 no-spot 조건은 첫 실패 보고 45초와 관측 60초로 채택했습니다. 다른 조건의 보고 빈도는 정하지 않았습니다.
  proposed_basis: 첫 보고 후에도 탐색을 계속하는지 확인하되 특정 로그 문구나 후속 보고 횟수·주기는 강제하지 않음
  values:
    status: delegated_fixture_only
    record: conservative_limits.yaml
    first_report_seconds: 45
    observation_seconds: 60
- id: Q-WALL-01
  kind: description_clarification_and_tolerance
  applies_to:
