  proposed_basis: header/발행 기록으로 구분하고 단순 수신 성공만으로 retention을 통과시키지 않음
  values: null
- id: Q-IPROC-01
  kind: numerical_oracle
  applies_to:
  - image_proc
  question: 공식 Jazzy 5.0.13의 무왜곡/알려진 왜곡 조건에서 측정했습니다. 위임에 따라 기록된 왜곡 보정 fixture만 최대 밝기값 차이 16과 MAE 0.01을
