  proposed_basis: 알려진 marker geometry와 calibration으로 기준 pose를 만들고, 유클리드 위치 오차와 회전 차이를 분리해 교정 후 합의합니다.
    camera-to-marker 좌표계와 marker 크기는 입력 명세를 따릅니다.
  values: null
