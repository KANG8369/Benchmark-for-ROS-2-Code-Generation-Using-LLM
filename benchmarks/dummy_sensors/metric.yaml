schema_version: "2.1"
package_name: dummy_sensors
reference:
  root: reference/
metrics:
- id: M-1
  name: Dummy laser scan publisher
  description: The package implements the timestamped sinusoidally varying uniform laser scan required
    by FR-1.
  requirement_ids:
  - FR-1
  pass_criteria:
  - id: M-1-PC-1
    text: The dummy_laser executable publishes sensor_msgs/msg/LaserScan on scan.
    evaluation: static
    reference_evidence:
    - path: src/dummy_laser.cpp
      anchor: create_publisher<sensor_msgs::msg::LaserScan>
      snippet: |2-
          auto laser_pub = node->create_publisher<sensor_msgs::msg::LaserScan>("scan", 10);
      explanation: Creates a LaserScan publisher on the scan topic.
  - id: M-1-PC-2
    text: Each scan uses frame_id single_rrbot_hokuyo_link.
    evaluation: static
    reference_evidence:
    - path: src/dummy_laser.cpp
      anchor: msg.header.frame_id
      snippet: |2-
          msg.header.frame_id = "single_rrbot_hokuyo_link";
      explanation: Sets the scan frame to single_rrbot_hokuyo_link.
  - id: M-1-PC-3
    text: Each scan receives a current timestamp.
    evaluation: static
    reference_evidence:
    - path: src/dummy_laser.cpp
      anchor: msg.header.stamp
      snippet: |2-
            msg.header.stamp = clock->now();
      explanation: Stamps each outgoing scan from the ROS clock.
  - id: M-1-PC-4
    text: Every range in one scan is assigned the same value.
    evaluation: static
    reference_evidence:
    - path: src/dummy_laser.cpp
      anchor: msg.ranges[i]
      snippet: |2-
            for (size_t i = 0; i < msg.ranges.size(); ++i) {
              msg.ranges[i] = distance;
            }
      explanation: Assigns the same computed distance to every range element.
  - id: M-1-PC-5
    text: The range value varies sinusoidally over time.
    evaluation: static
    reference_evidence:
    - path: src/dummy_laser.cpp
      anchor: std::sin(counter)
      snippet: |2-
            counter += 0.1;
            distance = static_cast<float>(std::abs(amplitude * std::sin(counter)));
      explanation: Computes the distance from the absolute value of a sinusoid.
  - id: M-1-PC-6
    text: Scan messages are published repeatedly.
    evaluation: static
    reference_evidence:
    - path: src/dummy_laser.cpp
      anchor: while (rclcpp::ok())
      snippet: |2-
          while (rclcpp::ok()) {
      explanation: Runs scan generation continuously while ROS is active.
    - path: src/dummy_laser.cpp
      anchor: laser_pub->publish
      snippet: |2-
            laser_pub->publish(msg);
            executor.spin_some();
            loop_rate.sleep();
      explanation: Publishes a scan and waits for the next loop iteration.
- id: M-2
  name: Dummy joint-state publisher
  description: The package implements the two-joint sinusoidal joint-state stream required by FR-2.
  requirement_ids:
  - FR-2
  pass_criteria:
  - id: M-2-PC-1
    text: The dummy_joint_states executable publishes sensor_msgs/msg/JointState
      on joint_states.
    evaluation: static
    reference_evidence:
    - path: src/dummy_joint_states.cpp
      anchor: create_publisher<sensor_msgs::msg::JointState>
      snippet: |2-
          auto joint_state_pub = node->create_publisher<sensor_msgs::msg::JointState>("joint_states", 10);
      explanation: Creates a JointState publisher on joint_states.
  - id: M-2-PC-2
    text: Each message names single_rrbot_joint1 and single_rrbot_joint2.
    evaluation: static
    reference_evidence:
    - path: src/dummy_joint_states.cpp
      anchor: msg.name.push_back
      snippet: |2-
          msg.name.push_back("single_rrbot_joint1");
          msg.name.push_back("single_rrbot_joint2");
      explanation: Adds the two required single_rrbot joint names.
  - id: M-2-PC-3
    text: Both joints receive matching sinusoidal positions.
    evaluation: static
    reference_evidence:
    - path: src/dummy_joint_states.cpp
      anchor: joint_value = std::sin
      snippet: |2-
            counter += 0.1;
            joint_value = std::sin(counter);

            for (size_t i = 0; i < msg.name.size(); ++i) {
              msg.position[i] = joint_value;
            }
      explanation: Computes one sinusoidal value and assigns it to every named joint.
  - id: M-2-PC-4
    text: Each joint-state message receives a current timestamp.
    evaluation: static
    reference_evidence:
    - path: src/dummy_joint_states.cpp
      anchor: msg.header.stamp
      snippet: |2-
            msg.header.stamp = clock->now();
      explanation: Stamps each outgoing joint-state message from the ROS clock.
  - id: M-2-PC-5
    text: Joint-state messages are published repeatedly.
    evaluation: static
    reference_evidence:
    - path: src/dummy_joint_states.cpp
      anchor: while (rclcpp::ok())
      snippet: |2-
          while (rclcpp::ok()) {
      explanation: Runs joint-state generation continuously while ROS is active.
    - path: src/dummy_joint_states.cpp
      anchor: joint_state_pub->publish
      snippet: |2-
            joint_state_pub->publish(msg);
            executor.spin_some();
            loop_rate.sleep();
      explanation: Publishes joint state and waits for the next loop iteration.
