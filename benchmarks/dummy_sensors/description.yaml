intent:
  package_name: dummy_sensors
  summary: Provides standalone dummy sensor executables that continuously publish
    simulated laser-scan and joint-state data for a simple robot.
  scope: Generates synthetic sensor messages only; robot description, TF publication,
    visualization, and consumer behavior are external responsibilities.

functional_requirements:
  - id: FR-1
    text: >-
      The dummy_laser executable continuously publishes timestamped
      LaserScan messages with sinusoidally varying uniform range values in
      the single_rrbot_hokuyo_link frame.

  - id: FR-2
    text: >-
      The dummy_joint_states executable continuously publishes timestamped
      JointState messages for single_rrbot_joint1 and single_rrbot_joint2
      with matching sinusoidally varying positions.
