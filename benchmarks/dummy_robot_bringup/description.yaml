intent:
  package_name: dummy_robot_bringup
  summary: Provides installed launch descriptions and assets for a dummy robot demonstration
    with map, sensor, robot-state, and RViz2 visualization components.
  scope: This package orchestrates external executables and supplies the RRBot description
    and RViz configuration; dependency packages implement map serving, sensor data
    production, robot-state publication, and visualization.

functional_requirements:
  - id: FR-1
    text: >-
      The package provides at least one installed bringup launch description,
      and every provided bringup launch starts the dummy map server, robot
      state publisher, dummy joint-state publisher, and dummy laser publisher.

  - id: FR-2
    text: >-
      Every provided bringup launch passes a packaged single-RRBot URDF as the
      robot description parameter for the robot state publisher.

  - id: FR-3
    text: >-
      The Python bringup launch additionally starts RViz2 with the packaged
      RViz configuration.

target_environment: >-
  A ROS 2 demonstration environment using the single-RRBot model.
