schema_version: "1.0"
package_name: dummy_robot_bringup
reference:
  root: reference/
evaluation_policy:
  equivalence: semantic
  exact_constants_only_when_specified: true
metrics:
  - id: M-1
    name: Complete dummy robot bringup
    description: Every installed bringup variant starts the four components required by FR-1.
    requirement_ids:
      - FR-1
    pass_criteria:
      - id: M-1-PC-1
        text: Static inspection shows that the installed Python, XML, and YAML bringup launch files each start the dummy map server, robot_state_publisher, dummy joint-state publisher, and dummy laser publisher.
        evaluation: static
        reference_evidence:
          - path: launch/dummy_robot_bringup_launch.py
            symbol: generate_launch_description
            explanation: Python launch description creates all four nodes.
          - path: launch/dummy_robot_bringup_launch.xml
            symbol: launch
            explanation: XML launch description declares all four nodes.
          - path: launch/dummy_robot_bringup_launch.yaml
            symbol: launch
            explanation: YAML launch description declares all four nodes.
          - path: CMakeLists.txt
            symbol: install
            explanation: Installs the launch directory into the package share directory.
  - id: M-2
    name: Packaged robot description
    description: Bringup supplies the packaged single_rrbot model to robot_state_publisher as required by FR-2.
    requirement_ids:
      - FR-2
    pass_criteria:
      - id: M-2-PC-1
        text: Static inspection shows each launch variant loads the installed single_rrbot.urdf and supplies its contents as robot_description to robot_state_publisher.
        evaluation: static
        reference_evidence:
          - path: launch/dummy_robot_bringup_launch.py
            symbol: generate_launch_description
            explanation: Resolves the packaged URDF and passes it as robot_description.
          - path: launch/dummy_robot_bringup_launch.xml
            symbol: robot_state_publisher
            explanation: Loads single_rrbot.urdf into robot_description.
          - path: launch/dummy_robot_bringup_launch.yaml
            symbol: robot_state_publisher
            explanation: Loads single_rrbot.urdf into robot_description.
          - path: launch/single_rrbot.urdf
            symbol: single_rrbot
            explanation: Provides the robot model consumed by the launch files.
          - path: CMakeLists.txt
            symbol: install
            explanation: Installs the launch directory containing the URDF into the package share directory.
  - id: M-3
    name: RViz startup in Python bringup
    description: The Python bringup starts RViz with the packaged configuration as required by FR-3.
    requirement_ids:
      - FR-3
    pass_criteria:
      - id: M-3-PC-1
        text: Static inspection shows the Python launch starts rviz2 and passes the path of the package-provided RViz configuration.
        evaluation: static
        reference_evidence:
          - path: launch/dummy_robot_bringup_launch.py
            symbol: generate_launch_description
            explanation: Creates the RViz2 node and supplies the packaged configuration path.
          - path: rviz/dummy_robot.rviz
            symbol: Visualization Manager
            explanation: Provides the RViz configuration used by the Python launch.
          - path: CMakeLists.txt
            symbol: install
            explanation: Installs the RViz configuration directory into the package share directory.
