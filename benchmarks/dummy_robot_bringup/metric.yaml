    - kind: resource
      path: rviz/dummy_robot.rviz
      locator: Visualization Manager
      snippet: |2-
            Splitter Ratio: 0.5886790156364441
          - Class: rviz_common/Views
            Expanded:
              - /Current View1
            Name: Views
            Splitter Ratio: 0.5
        Visualization Manager:
          Class: ""
          Displays:
            - Alpha: 0.5
              Cell Size: 1
              Class: rviz_default_plugins/Grid
              Color: 160; 160; 164
              Enabled: true
              Line Style:
                Line Width: 0.029999999329447746
                Value: Lines
              Name: Grid
      explanation: Provides the RViz configuration used by the Python launch.
    - kind: build
      path: CMakeLists.txt
      locator: install
      snippet: |-
