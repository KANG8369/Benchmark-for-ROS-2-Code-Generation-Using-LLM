package_name: dummy_robot_bringup
reference:
  root: reference/
metrics:
- id: M-1
  name: Complete dummy robot bringup
  description: Every installed bringup variant starts the four components required by FR-1.
  requirement_ids:
  - FR-1
  pass_criteria:
  - id: M-1-PC-1
    text: The Python bringup launch starts the map server, robot_state_publisher,
      joint-state publisher, and laser publisher.
    evaluation: static
    reference_evidence:
    - path: launch/dummy_robot_bringup_launch.py
      anchor: LaunchDescription
      snippet: |2-
            return LaunchDescription([
                Node(package='dummy_map_server', executable='dummy_map_server', output='screen'),
                Node(package='robot_state_publisher', executable='robot_state_publisher',
                     output='screen', parameters=[rsp_params]),
                Node(package='dummy_sensors', executable='dummy_joint_states', output='screen'),
                Node(package='dummy_sensors', executable='dummy_laser', output='screen'),
      explanation: The Python launch description lists the four required non-RViz nodes.
  - id: M-1-PC-2
    text: The XML bringup launch starts the same four required nodes.
    evaluation: static
    reference_evidence:
    - path: launch/dummy_robot_bringup_launch.xml
      anchor: launch
      snippet: |2-
          <node pkg="dummy_map_server" exec="dummy_map_server" output="screen" />
          <node pkg="robot_state_publisher" exec="robot_state_publisher" output="screen" >
            <param name="robot_description" value="$(file-content '$(find-pkg-share dummy_robot_bringup)/launch/single_rrbot.urdf')"/>
          </node>
          <node pkg="dummy_sensors" exec="dummy_joint_states" output="screen"/>
          <node pkg="dummy_sensors" exec="dummy_laser" output="screen"/>
      explanation: The XML launch description declares the four required nodes.
  - id: M-1-PC-3
    text: The YAML bringup launch starts the same four required nodes.
    evaluation: static
    reference_evidence:
    - path: launch/dummy_robot_bringup_launch.yaml
      anchor: launch
      snippet: |-
        - node:
            pkg: dummy_map_server
            exec: dummy_map_server
            output: screen
        - node:
            pkg: robot_state_publisher
            exec: robot_state_publisher
            output: screen
            param:
              - name: robot_description
                value: $(file-content '$(find-pkg-share dummy_robot_bringup)/launch/single_rrbot.urdf')
        - node:
            pkg: dummy_sensors
            exec: dummy_joint_states
            output: screen
        - node:
            pkg: dummy_sensors
            exec: dummy_laser
            output: screen
      explanation: The YAML launch description declares the four required nodes.
  - id: M-1-PC-4
    text: The launch directory is installed into the package share directory.
    evaluation: static
    reference_evidence:
    - path: CMakeLists.txt
      anchor: install
      snippet: |-
        install(DIRECTORY launch rviz
          DESTINATION share/${PROJECT_NAME})
      explanation: Installs the launch directory into the package share directory.
- id: M-2
  name: Packaged robot description
  description: Bringup supplies the packaged single_rrbot model to robot_state_publisher as required by
    FR-2.
  requirement_ids:
  - FR-2
  pass_criteria:
  - id: M-2-PC-1
    text: The Python launch loads single_rrbot.urdf and passes it as robot_description.
    evaluation: static
    reference_evidence:
    - path: launch/dummy_robot_bringup_launch.py
      anchor: robot_description
      snippet: |2-
            urdf_file = os.path.join(pkg_share, 'launch', 'single_rrbot.urdf')
            robot_desc = FileContent(urdf_file)
            rsp_params = {'robot_description': robot_desc}

            return LaunchDescription([
                Node(package='dummy_map_server', executable='dummy_map_server', output='screen'),
                Node(package='robot_state_publisher', executable='robot_state_publisher',
                     output='screen', parameters=[rsp_params]),
      explanation: Loads single_rrbot.urdf and passes its contents to robot_state_publisher.
  - id: M-2-PC-2
    text: The XML launch loads single_rrbot.urdf and passes it as robot_description.
    evaluation: static
    reference_evidence:
    - path: launch/dummy_robot_bringup_launch.xml
      anchor: robot_description
      snippet: |2-
          <node pkg="robot_state_publisher" exec="robot_state_publisher" output="screen" >
            <param name="robot_description" value="$(file-content '$(find-pkg-share dummy_robot_bringup)/launch/single_rrbot.urdf')"/>
          </node>
      explanation: Loads the packaged URDF into robot_description for the XML launch.
  - id: M-2-PC-3
    text: The YAML launch loads single_rrbot.urdf and passes it as robot_description.
    evaluation: static
    reference_evidence:
    - path: launch/dummy_robot_bringup_launch.yaml
      anchor: robot_description
      snippet: |-
        - node:
            pkg: robot_state_publisher
            exec: robot_state_publisher
            output: screen
            param:
              - name: robot_description
                value: $(file-content '$(find-pkg-share dummy_robot_bringup)/launch/single_rrbot.urdf')
      explanation: Loads the packaged URDF into robot_description for the YAML launch.
  - id: M-2-PC-4
    text: The package provides a single_rrbot robot model.
    evaluation: static
    reference_evidence:
    - path: launch/single_rrbot.urdf
      anchor: single_rrbot
      snippet: |-
        <robot name="single_rrbot" xmlns:xacro="http://www.ros.org/wiki/xacro">
      explanation: Declares the packaged robot model with name single_rrbot.
  - id: M-2-PC-5
    text: The directory containing the URDF is installed into the package share
      directory.
    evaluation: static
    reference_evidence:
    - path: CMakeLists.txt
      anchor: install
      snippet: |-
        install(DIRECTORY launch rviz
          DESTINATION share/${PROJECT_NAME})
      explanation: Installs the launch directory that contains single_rrbot.urdf.
- id: M-3
  name: RViz startup in Python bringup
  description: The Python bringup starts RViz with the packaged configuration as required by FR-3.
  requirement_ids:
  - FR-3
  pass_criteria:
  - id: M-3-PC-1
    text: The Python bringup launch starts an rviz2 node.
    evaluation: static
    reference_evidence:
    - path: launch/dummy_robot_bringup_launch.py
      anchor: rviz2
      snippet: |2-
                Node(package='rviz2', executable='rviz2', name='rviz2', output='screen',
                     arguments=['-d', default_rviz_config_path])
      explanation: Starts the rviz2 executable from the Python launch.
  - id: M-3-PC-2
    text: Rviz2 receives the path to the package-provided RViz configuration.
    evaluation: static
    reference_evidence:
    - path: launch/dummy_robot_bringup_launch.py
      anchor: default_rviz_config_path
      snippet: |2-
            default_rviz_config_path = os.path.join(pkg_share, 'rviz/dummy_robot.rviz')
      explanation: Resolves the RViz configuration from the package share directory.
    - path: launch/dummy_robot_bringup_launch.py
      anchor: arguments=['-d'
      snippet: |2-
                Node(package='rviz2', executable='rviz2', name='rviz2', output='screen',
                     arguments=['-d', default_rviz_config_path])
      explanation: Passes the resolved configuration path to rviz2 with -d.
  - id: M-3-PC-3
    text: The RViz configuration directory is installed into the package share
      directory.
    evaluation: static
    reference_evidence:
    - path: CMakeLists.txt
      anchor: install
      snippet: |-
        install(DIRECTORY launch rviz
          DESTINATION share/${PROJECT_NAME})
      explanation: Installs the RViz directory into the package share directory.
