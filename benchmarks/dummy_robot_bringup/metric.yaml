package_name: dummy_robot_bringup

metrics:
- id: FR-1
  text: The package provides at least one installed bringup launch description, and
    every provided bringup launch starts the dummy map server, robot state publisher,
    dummy joint-state publisher, and dummy laser publisher.
  pass_criteria:
    - id: FR-1-PC-1
      text: >-
        At least one bringup launch description is installed into the package
        share directory.
    - id: FR-1-PC-2
      text: >-
        Every provided bringup launch starts the map server,
        robot_state_publisher, joint-state publisher, and laser publisher.

- id: FR-2
  text: Every provided bringup launch passes a packaged single-RRBot URDF as the robot
    description parameter for the robot state publisher.
  pass_criteria:
    - id: FR-2-PC-1
      text: >-
        The package provides a valid single-RRBot URDF.
    - id: FR-2-PC-2
      text: >-
        Every provided bringup launch passes the packaged single-RRBot URDF
        to robot_state_publisher as robot_description.
    - id: FR-2-PC-3
      text: >-
        The packaged single-RRBot URDF is installed into the package share
        directory and is available to the launch descriptions.

- id: FR-3
  text: The Python bringup launch additionally starts RViz2 with the packaged RViz
    configuration.
  pass_criteria:
    - id: FR-3-PC-1
      text: >-
        The Python bringup launch starts an rviz2 node.
    - id: FR-3-PC-2
      text: >-
        Rviz2 receives the path to the package-provided RViz configuration.
    - id: FR-3-PC-3
      text: >-
        The RViz configuration directory is installed into the package share
        directory.
