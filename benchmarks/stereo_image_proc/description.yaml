intent:
  package_name: stereo_image_proc
  summary: Provides composable and standalone stereo-processing nodes that compute
    calibrated disparity images and colored or XYZ point clouds from synchronized
    rectified stereo-camera streams.
  scope: This package performs stereo matching and disparity-to-3D projection, exports
    a reusable stereo-processing library, and provides launch orchestration; camera
    drivers, calibration producers, input-image production, output consumers, and
    image_proc implementation are external responsibilities.
functional_requirements:
- id: FR-1
  text: The disparity processor publishes a calibrated floating-point disparity image
    when synchronized left and right rectified monochrome images and camera information
    are available and an output subscriber is connected.
- id: FR-2
  text: The point-cloud processor publishes a dense PointCloud2 projection of synchronized
    disparity, camera calibration, and left rectified color data when an output subscriber
    is connected.
- id: FR-3
  text: Both processing nodes support exact synchronization or configurable approximate
    synchronization with an optional timestamp tolerance for their required input
    streams.
- id: FR-4
  text: Both processing nodes subscribe to their source streams only while their respective
    output has subscribers and stop subscribing when the output has no subscribers.
- id: FR-5
  text: The disparity node supports block matching and semi-global block matching
    with runtime-adjustable matching, filtering, search-range, and smoothness settings,
    and rejects an unsupported stereo algorithm selection.
- id: FR-6
  text: The point-cloud node can include RGB data or XYZ-only data and can select
    compact field packing to reduce point-cloud bandwidth.
- id: FR-7
  text: The exported StereoProcessor utility produces selected rectified images, disparity
    data, legacy PointCloud data, and PointCloud2 data from calibrated stereo images,
    and reports failure when required monocular processing fails.
- id: FR-8
  text: The supplied launch description loads the disparity and point-cloud components
    into either a new or caller-supplied component container and can additionally
    invoke left and right image_proc launch pipelines under configurable namespaces.
interfaces:
  nodes:
  - name: <effective_stereo_namespace>/disparity_node
    responsibility: Synchronizes rectified monochrome stereo inputs, computes disparity
      using calibrated camera information, and publishes disparity output on demand.
    topics:
    - name: <effective_stereo_namespace>/<left_namespace>/image_rect
      type: sensor_msgs/msg/Image
      direction: subscribe
      purpose: Left rectified monochrome image used for stereo matching.
    - name: <effective_stereo_namespace>/<left_namespace>/camera_info
      type: sensor_msgs/msg/CameraInfo
      direction: subscribe
      purpose: Left camera calibration associated with the rectified image.
    - name: <effective_stereo_namespace>/<right_namespace>/image_rect
      type: sensor_msgs/msg/Image
      direction: subscribe
      purpose: Right rectified monochrome image used for stereo matching.
    - name: <effective_stereo_namespace>/<right_namespace>/camera_info
      type: sensor_msgs/msg/CameraInfo
      direction: subscribe
      purpose: Right camera calibration associated with the rectified image.
    - name: <effective_stereo_namespace>/disparity
      type: stereo_msgs/msg/DisparityImage
      direction: publish
      purpose: Calibrated floating-point disparity image and stereo metadata.
    parameters:
    - name: image_transport
      type: string
      purpose: Selects the image transport used for rectified image subscriptions.
    - name: queue_size
      type: integer
      purpose: Sets the synchronization queue depth.
    - name: approximate_sync
      type: bool
      purpose: Selects approximate rather than exact timestamp synchronization.
    - name: approximate_sync_tolerance_seconds
      type: double
      purpose: Sets the allowed timestamp tolerance for epsilon-based approximate
        synchronization.
    - name: use_system_default_qos
      type: bool
      purpose: Declares a compatibility configuration setting for system-default QoS
        behavior.
    - name: use_image_transport_camera_info
      type: bool
      purpose: Selects whether camera-info subscription names are derived from image-transport
        image names or obtained from direct camera-info remappings.
    - name: stereo_algorithm
      type: integer
      purpose: Selects block matching or semi-global block matching.
    - name: prefilter_size
      type: integer
      purpose: Sets the block-matching normalization window size.
    - name: prefilter_cap
      type: integer
      purpose: Sets the bound on normalized pixel values.
    - name: correlation_window_size
      type: integer
      purpose: Sets the stereo correspondence window size.
    - name: min_disparity
      type: integer
      purpose: Sets the start of the disparity search range.
    - name: disparity_range
      type: integer
      purpose: Sets the number of disparities searched.
    - name: texture_threshold
      type: integer
      purpose: Sets the minimum texture response accepted by block matching.
    - name: speckle_size
      type: integer
      purpose: Sets the minimum connected disparity-region size retained.
    - name: speckle_range
      type: integer
      purpose: Sets the maximum disparity variation within a speckle region.
    - name: disp12_max_diff
      type: integer
      purpose: Sets the semi-global matcher left-right disparity-check threshold.
    - name: uniqueness_ratio
      type: double
      purpose: Sets the match-uniqueness filter threshold.
    - name: P1
      type: double
      purpose: Sets the first semi-global matching smoothness penalty.
    - name: P2
      type: double
      purpose: Sets the second semi-global matching smoothness penalty.
    - name: sgbm_mode
      type: integer
      purpose: Selects the semi-global block-matching mode.
  - name: <effective_stereo_namespace>/point_cloud_node
    responsibility: Synchronizes disparity, stereo calibration, and left rectified
      color data to project disparity pixels into a PointCloud2 output on demand.
    topics:
    - name: <effective_stereo_namespace>/<left_namespace>/image_rect_color
      type: sensor_msgs/msg/Image
      direction: subscribe
      purpose: Left rectified image used to supply point-cloud color data.
    - name: <effective_stereo_namespace>/<left_namespace>/camera_info
      type: sensor_msgs/msg/CameraInfo
      direction: subscribe
      purpose: Left camera calibration used for 3D projection.
    - name: <effective_stereo_namespace>/<right_namespace>/camera_info
      type: sensor_msgs/msg/CameraInfo
      direction: subscribe
      purpose: Right camera calibration used for 3D projection.
    - name: <effective_stereo_namespace>/disparity
      type: stereo_msgs/msg/DisparityImage
      direction: subscribe
      purpose: Disparity image projected into three-dimensional points.
    - name: <effective_stereo_namespace>/points2
      type: sensor_msgs/msg/PointCloud2
      direction: publish
      purpose: Dense projected stereo point cloud with optional RGB fields.
    parameters:
    - name: image_transport
      type: string
      purpose: Selects the image transport used for the left rectified image subscription.
    - name: queue_size
      type: integer
      purpose: Sets the synchronization queue depth.
    - name: approximate_sync
      type: bool
      purpose: Selects approximate rather than exact timestamp synchronization.
    - name: approximate_sync_tolerance_seconds
      type: double
      purpose: Sets the allowed timestamp tolerance for epsilon-based approximate
        synchronization.
    - name: avoid_point_cloud_padding
      type: bool
      purpose: Selects compact PointCloud2 field layout without alignment padding.
    - name: use_color
      type: bool
      purpose: Selects whether generated points include RGB data.
  launch_arguments:
  - name: approximate_sync
    purpose: Selects approximate synchronization for both stereo processors.
  - name: avoid_point_cloud_padding
    purpose: Selects compact PointCloud2 field packing.
  - name: use_color
    purpose: Selects RGB inclusion in the generated point cloud.
  - name: launch_image_proc
    purpose: Controls whether left and right image_proc launch pipelines are included.
  - name: namespace
    purpose: Sets the package-local namespace combined with an inherited ROS namespace
      to form <effective_stereo_namespace> for loaded components and included image
      pipelines.
  - name: left_namespace
    purpose: Sets the left-camera namespace used by component remappings and the left
      image_proc pipeline.
  - name: right_namespace
    purpose: Sets the right-camera namespace used by component remappings and the
      right image_proc pipeline.
  - name: container
    purpose: Names an existing component container to receive the components, or selects
      creation of the package container when empty.
  - name: stereo_algorithm
    purpose: Selects block matching or semi-global block matching for disparity generation.
  - name: prefilter_size
    purpose: Sets the disparity prefilter normalization window size.
  - name: prefilter_cap
    purpose: Sets the disparity prefilter pixel-value bound.
  - name: correlation_window_size
    purpose: Sets the disparity correlation window width.
  - name: min_disparity
    purpose: Sets the beginning of the disparity search range.
  - name: disparity_range
    purpose: Sets the number of disparities searched.
  - name: texture_threshold
    purpose: Sets the block-matching texture rejection threshold.
  - name: speckle_size
    purpose: Sets the minimum disparity speckle-region size retained.
  - name: speckle_range
    purpose: Sets the allowed disparity difference within a speckle region.
  - name: disp12_max_diff
    purpose: Sets the semi-global matching left-right disparity-check threshold.
  - name: uniqueness_ratio
    purpose: Sets the disparity match-uniqueness filter threshold.
  - name: P1
    purpose: Sets the first semi-global matching smoothness penalty.
  - name: P2
    purpose: Sets the second semi-global matching smoothness penalty.
  - name: sgbm_mode
    purpose: Selects the semi-global block-matching mode.
  - name: ros_namespace
    purpose: Supplies the inherited ROS namespace combined with namespace for component
      names and used when deriving the automatically created container target name.
  external_nodes:
  - name: <inherited_ros_namespace>/stereo_image_proc_container
    package: rclcpp_components
    executable: component_container
    purpose: Hosts the disparity and point-cloud components when no existing container
      is supplied, under the inherited ROS namespace when one is active.
