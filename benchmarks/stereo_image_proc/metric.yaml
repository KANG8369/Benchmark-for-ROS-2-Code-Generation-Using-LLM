- id: M-6
  name: Point-cloud color and packing choices
  description: PointCloud2 output can include RGB or XYZ only and can use padded or compact field layout as required by FR-6.
  requirement_ids:
  - FR-6
  pass_criteria:
  - id: M-6-PC-1
    text: use_color selects XYZRGB fields or XYZ-only fields.
    evaluation: static
    reference_evidence:
    - path: src/stereo_image_proc/point_cloud_node.cpp
      anchor: use_color
      snippet: |2-
          if (!this->get_parameter("avoid_point_cloud_padding").as_bool()) {
            if (this->get_parameter("use_color").as_bool()) {
              // Data will be packed as (DC=don't care, each item is a float):
              //   x, y, z, DC, rgb, DC, DC, DC
              // Resulting step size: 32 bytes
              pcd_modifier.setPointCloud2FieldsByString(2, "xyz", "rgb");
            } else {
              // Data will be packed as:
              //   x, y, z, DC
              // Resulting step size: 16 bytes
              pcd_modifier.setPointCloud2FieldsByString(1, "xyz");
            }
      explanation: Chooses colored or geometry-only point fields under normal padded layout.
  - id: M-6-PC-2
    text: avoid_point_cloud_padding selects explicit compact XYZRGB or XYZ field layouts without alignment padding.
    evaluation: static
    reference_evidence:
    - path: src/stereo_image_proc/point_cloud_node.cpp
      anchor: setPointCloud2Fields
      snippet: |2-
          } else {
            if (this->get_parameter("use_color").as_bool()) {
              // Data will be packed as:
              //   x, y, z, rgb
              // Resulting step size: 16 bytes
              pcd_modifier.setPointCloud2Fields(
                4,
                "x", 1, sensor_msgs::msg::PointField::FLOAT32,
                "y", 1, sensor_msgs::msg::PointField::FLOAT32,
                "z", 1, sensor_msgs::msg::PointField::FLOAT32,
                "rgb", 1, sensor_msgs::msg::PointField::FLOAT32);
            } else {
              // Data will be packed as:
              //   x, y, z
              // Resulting step size: 12 bytes
              pcd_modifier.setPointCloud2Fields(
                3,
                "x", 1, sensor_msgs::msg::PointField::FLOAT32,
                "y", 1, sensor_msgs::msg::PointField::FLOAT32,
                "z", 1, sensor_msgs::msg::PointField::FLOAT32);
            }
          }
      explanation: Defines compact field sets for both colored and XYZ-only output when padding avoidance is enabled.
- id: M-7
  name: Reusable StereoProcessor outputs
  description: StereoProcessor derives requested rectified, disparity, PointCloud, and PointCloud2 products and reports monocular failure as required by FR-7.
  requirement_ids:
  - FR-7
  pass_criteria:
  - id: M-7-PC-1
    text: Stereo output requests automatically request the rectified mono inputs and point-cloud requests also request disparity and left rectified color.
    evaluation: static
    reference_evidence:
    - path: src/stereo_image_proc/stereo_processor.cpp
      anchor: STEREO_ALL
      snippet: |2-
          if (flags & STEREO_ALL) {
            // Need the rectified images for stereo processing
            left_flags |= LEFT_RECT;
            right_flags |= RIGHT_RECT;
          }
          if (flags & (POINT_CLOUD | POINT_CLOUD2)) {
            flags |= DISPARITY;
            // Need the color channels for the point cloud
            left_flags |= LEFT_RECT_COLOR;
          }
      explanation: Expands selected outputs into all prerequisite monocular and stereo products.
  - id: M-7-PC-2
    text: Failure of required left or right monocular processing causes StereoProcessor to report false.
    evaluation: static
    reference_evidence:
    - path: src/stereo_image_proc/stereo_processor.cpp
      anchor: mono_processor_.process
      snippet: |2-
          if (!mono_processor_.process(left_raw, model.left(), output.left, left_flags)) {
            return false;
          }
          if (!mono_processor_.process(right_raw, model.right(), output.right, right_flags >> 4)) {
            return false;
          }
      explanation: Propagates either required monocular-processing failure to the caller.
  - id: M-7-PC-3
    text: Selected flags independently produce disparity, legacy PointCloud, and PointCloud2 outputs after monocular processing succeeds.
    evaluation: static
    reference_evidence:
    - path: src/stereo_image_proc/stereo_processor.cpp
      anchor: flags & DISPARITY
      snippet: |2-
          if (flags & DISPARITY) {
            processDisparity(output.left.rect, output.right.rect, model, output.disparity);
          }
        
          // Project disparity image to 3d point cloud
          if (flags & POINT_CLOUD) {
            processPoints(
              output.disparity, output.left.rect_color, output.left.color_encoding, model, output.points);
          }
        
          // Project disparity image to 3d point cloud
          if (flags & POINT_CLOUD2) {
            processPoints2(
              output.disparity, output.left.rect_color, output.left.color_encoding, model, output.points2);
          }
        
          return true;
      explanation: Dispatches every selected stereo product and reports successful processing.
