package_name: stereo_image_proc
reference:
  root: reference/
metrics:
- id: M-1
  name: Calibrated disparity publication
  description: Synchronized rectified monochrome stereo images and calibration produce a floating-point DisparityImage only when demanded, satisfying FR-1.
  requirement_ids:
  - FR-1
  pass_criteria:
  - id: M-1-PC-1
    text: The disparity callback returns without processing when the disparity publisher has no subscribers.
    evaluation: static
    reference_evidence:
    - path: src/stereo_image_proc/disparity_node.cpp
      anchor: pub_disparity_->get_subscription_count
      snippet: |2-
          // If there are no subscriptions for the disparity image, do nothing
          if (pub_disparity_->get_subscription_count() == 0u) {
            return;
          }
        
          // Update the camera model
          model_.fromCameraInfo(l_info_msg, r_info_msg);
      explanation: Gates disparity computation on output demand before using synchronized inputs.
  - id: M-1-PC-2
    text: Left and right calibration plus rectified MONO8 images are passed to the stereo matcher to fill a DisparityImage.
    evaluation: static
    reference_evidence:
    - path: src/stereo_image_proc/disparity_node.cpp
      anchor: model_.fromCameraInfo
      snippet: |2-
          // Update the camera model
          model_.fromCameraInfo(l_info_msg, r_info_msg);
        
          // Allocate new disparity image message
          auto disp_msg = std::make_unique<stereo_msgs::msg::DisparityImage>();
          disp_msg->header = l_info_msg->header;
          disp_msg->image.header = l_info_msg->header;
      explanation: Initializes calibrated output metadata from the synchronized camera information.
    - path: src/stereo_image_proc/disparity_node.cpp
      anchor: block_matcher_.processDisparity
      snippet: |2-
          const cv::Mat_<uint8_t> l_image =
            cv_bridge::toCvShare(l_image_msg, sensor_msgs::image_encodings::MONO8)->image;
          const cv::Mat_<uint8_t> r_image =
            cv_bridge::toCvShare(r_image_msg, sensor_msgs::image_encodings::MONO8)->image;
        
          // Perform block matching to find the disparities
          block_matcher_.processDisparity(l_image, r_image, model_, *disp_msg);
      explanation: Converts both rectified streams to monochrome matrices and computes calibrated disparity data.
  - id: M-1-PC-3
    text: The completed stereo_msgs/msg/DisparityImage is published on disparity.
    evaluation: static
    reference_evidence:
    - path: src/stereo_image_proc/disparity_node.cpp
      anchor: create_publisher
      snippet: |2-
          pub_disparity_ = create_publisher<stereo_msgs::msg::DisparityImage>("disparity", 1, pub_opts);
      explanation: Creates the required disparity publisher.
    - path: src/stereo_image_proc/disparity_node.cpp
      anchor: pub_disparity_->publish
      snippet: |2-
          pub_disparity_->publish(std::move(disp_msg));
      explanation: Publishes the matcher-populated disparity message.
- id: M-2
  name: Dense stereo PointCloud2 projection
  description: Synchronized disparity, calibration, and left rectified color are projected into a dense PointCloud2 on demand as required by FR-2.
  requirement_ids:
  - FR-2
  pass_criteria:
  - id: M-2-PC-1
    text: The point-cloud callback returns without projection when points2 has no subscribers.
    evaluation: static
    reference_evidence:
    - path: src/stereo_image_proc/point_cloud_node.cpp
      anchor: pub_points2_->get_subscription_count
      snippet: |2-
          // If there are no subscriptions for the point cloud, do nothing
          if (pub_points2_->get_subscription_count() == 0u) {
            return;
          }
        
          // Update the camera model
          model_.fromCameraInfo(l_info_msg, r_info_msg);
      explanation: Gates projection on output demand and then updates calibration from synchronized camera information.
  - id: M-2-PC-2
    text: The floating-point disparity image is projected through the stereo camera model into dense XYZ data.
    evaluation: static
    reference_evidence:
    - path: src/stereo_image_proc/point_cloud_node.cpp
      anchor: projectDisparityImageTo3d
      snippet: |2-
          const cv::Mat_<float> dmat(dimage.height, dimage.width, data, dimage.step);
          model_.projectDisparityImageTo3d(dmat, points_mat_, true);
          cv::Mat_<cv::Vec3f> mat = points_mat_;
      explanation: Reinterprets calibrated disparity as float data and projects every pixel into 3D.
  - id: M-2-PC-3
    text: Projected XYZ values and optional left-image color are written into and published as sensor_msgs/msg/PointCloud2.
    evaluation: static
    reference_evidence:
    - path: src/stereo_image_proc/point_cloud_node.cpp
      anchor: PointCloud2Iterator<float>
      snippet: |2-
          sensor_msgs::PointCloud2Iterator<float> iter_x(*points_msg, "x");
          sensor_msgs::PointCloud2Iterator<float> iter_y(*points_msg, "y");
          sensor_msgs::PointCloud2Iterator<float> iter_z(*points_msg, "z");
        
          float bad_point = std::numeric_limits<float>::quiet_NaN();
          for (int v = 0; v < mat.rows; ++v) {
            for (int u = 0; u < mat.cols; ++u, ++iter_x, ++iter_y, ++iter_z) {
              if (isValidPoint(mat(v, u))) {
                // x,y,z
                *iter_x = mat(v, u)[0];
                *iter_y = mat(v, u)[1];
                *iter_z = mat(v, u)[2];
              } else {
                *iter_x = *iter_y = *iter_z = bad_point;
              }
            }
          }
      explanation: Preserves dense image layout while filling valid XYZ samples and NaNs for invalid samples.
    - path: src/stereo_image_proc/point_cloud_node.cpp
      anchor: pub_points2_->publish
      snippet: |2-
          pub_points2_->publish(std::move(points_msg));
      explanation: Publishes the completed dense PointCloud2.
