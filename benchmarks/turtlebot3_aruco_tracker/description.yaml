intent:
  package_name: turtlebot3_aruco_tracker
  summary: Detects ArUco markers in a calibrated compressed camera stream and broadcasts
    a pose transform for each detected marker.
  scope: The package performs marker detection and pose-to-TF conversion; external
    camera drivers provide the camera calibration and compressed image stream.
functional_requirements:
- id: FR-1
  text: The tracker accepts the first camera calibration message, derives camera intrinsic
    and distortion data from it, and then stops subscribing to calibration updates.
- id: FR-2
  text: The tracker ignores compressed images and reports missing calibration until
    it has received camera information.
- id: FR-3
  text: For every detected DICT_5X5_250 ArUco marker in a calibrated image, the tracker
    estimates its pose using the configured marker size and broadcasts a timestamped
    transform from the camera frame to that marker's dynamic frame.
interfaces:
  nodes:
  - name: turtlebot3_aruco_tracker
    responsibility: Subscribes to camera calibration and compressed images, detects
      ArUco markers, and broadcasts their estimated poses; direct execution without
      the launch name override uses the node name aruco_tracker.
    topics:
    - name: /camera/camera_info
      type: sensor_msgs/msg/CameraInfo
      direction: subscribe
      purpose: Supplies the camera intrinsic matrix and distortion coefficients used
        for pose estimation.
    - name: /camera/image_raw/compressed
      type: sensor_msgs/msg/CompressedImage
      direction: subscribe
      purpose: Supplies compressed camera images in which ArUco markers are detected.
    - name: /tf
      type: tf2_msgs/msg/TFMessage
      direction: publish
      purpose: Publishes dynamic transforms for detected ArUco marker frames through
        the TransformBroadcaster.
    tf:
    - source_frame: camera_rgb_frame
      target_frame: ar_marker_<marker_id>
      purpose: Broadcasts the corrected estimated pose of each detected marker using
        the source image timestamp.
    parameters:
    - name: marker_size
      type: double
      purpose: Sets the physical ArUco marker side length in meters for pose estimation.
  launch_arguments:
  - name: marker_size
    purpose: Sets the marker_size parameter for the launched tracker node, defaulting
      to 0.04 meters.
