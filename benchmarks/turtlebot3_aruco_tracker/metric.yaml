package_name: turtlebot3_aruco_tracker
reference:
  root: reference/
metrics:
- id: M-1
  name: One-shot camera calibration
  description: The first camera calibration is converted into pose-estimation matrices and later calibration updates are stopped as required by FR-1.
  requirement_ids:
  - FR-1
  pass_criteria:
  - id: M-1-PC-1
    text: A CameraInfo callback stores the message and derives intrinsic and distortion arrays from it.
    evaluation: static
    reference_evidence:
    - path: turtlebot3_aruco_tracker/turtlebot3_aruco_tracker.py
      anchor: camera_info_callback
      snippet: |2-
            def camera_info_callback(self, camera_info_msg):
                self.camera_info_msg = camera_info_msg
                self.intrinsic_mat = np.reshape(np.array(self.camera_info_msg.k), (3, 3))
                self.distortion = np.array(self.camera_info_msg.d)
      explanation: Stores the calibration and converts its K and D fields into pose-estimation inputs.
  - id: M-1-PC-2
    text: The camera-information subscription is destroyed after the first calibration is accepted.
    evaluation: static
    reference_evidence:
    - path: turtlebot3_aruco_tracker/turtlebot3_aruco_tracker.py
      anchor: destroy_subscription
      snippet: |2-
            def camera_info_callback(self, camera_info_msg):
                self.camera_info_msg = camera_info_msg
                self.intrinsic_mat = np.reshape(np.array(self.camera_info_msg.k), (3, 3))
                self.distortion = np.array(self.camera_info_msg.d)
                self.destroy_subscription(self.sub_camera_info)
      explanation: Unsubscribes only after persisting all calibration values from the received message.
- id: M-2
  name: Calibration gate for image processing
  description: Compressed images are rejected with a diagnostic until camera calibration exists, satisfying FR-2.
  requirement_ids:
  - FR-2
  pass_criteria:
  - id: M-2-PC-1
    text: The compressed-image callback logs missing camera information and returns before decoding or detection.
    evaluation: static
    reference_evidence:
    - path: turtlebot3_aruco_tracker/turtlebot3_aruco_tracker.py
      anchor: No camera info
      snippet: |2-
            def image_callback(self, img_msg: CompressedImage):
                if self.camera_info_msg is None:
                    self.get_logger().warn('No camera info')
                    return
        
                np_arr = np.frombuffer(img_msg.data, dtype=np.uint8)
      explanation: The controlling condition prevents image decoding and marker tracking until calibration is present.
- id: M-3
  name: Calibrated ArUco marker transforms
  description: DICT_5X5_250 detections are pose-estimated with marker_size and broadcast as timestamped marker transforms as required by FR-3.
  requirement_ids:
  - FR-3
  pass_criteria:
  - id: M-3-PC-1
    text: Detection uses the predefined DICT_5X5_250 ArUco dictionary.
    evaluation: static
    reference_evidence:
    - path: turtlebot3_aruco_tracker/turtlebot3_aruco_tracker.py
      anchor: DICT_5X5_250
      snippet: |2-
                marker_dict_id = 'DICT_5X5_250'
                dict_id = getattr(cv2.aruco, marker_dict_id)
                self.marker_dict = cv2.aruco.getPredefinedDictionary(dict_id)
      explanation: Selects and constructs the required predefined marker dictionary.
  - id: M-3-PC-2
    text: Detected marker corners are pose-estimated with the configured marker size and stored camera calibration.
    evaluation: static
    reference_evidence:
    - path: turtlebot3_aruco_tracker/turtlebot3_aruco_tracker.py
      anchor: estimatePoseSingleMarkers
      snippet: |2-
                corners, marker_ids, _ = cv2.aruco.detectMarkers(
                    cv_gray, self.marker_dict, parameters=self.ar_param
                )
                if marker_ids is None:
                    return
        
                rvecs, tvecs, _ = cv2.aruco.estimatePoseSingleMarkers(
                    corners, self.marker_size, self.intrinsic_mat, self.distortion
                )
      explanation: Performs detection and uses marker size plus intrinsic and distortion data for pose estimation.
  - id: M-3-PC-3
    text: Each detected marker produces a transform stamped with the source image time from camera_rgb_frame to ar_marker_<id>.
    evaluation: static
    reference_evidence:
    - path: turtlebot3_aruco_tracker/turtlebot3_aruco_tracker.py
      anchor: t_msg.header.stamp
      snippet: |2-
                    t_msg = TransformStamped()
                    t_msg.header.stamp = stamp
                    t_msg.header.frame_id = 'camera_rgb_frame'
                    t_msg.child_frame_id = f'ar_marker_{marker_id}'
                    t_msg.transform.translation.x = float(t_corrected[0])
                    t_msg.transform.translation.y = float(t_corrected[1])
                    t_msg.transform.translation.z = float(t_corrected[2])
                    t_msg.transform.rotation.x = float(quat[0])
                    t_msg.transform.rotation.y = float(quat[1])
                    t_msg.transform.rotation.z = float(quat[2])
                    t_msg.transform.rotation.w = float(quat[3])
        
                    self.br.sendTransform(t_msg)
      explanation: Fills the required timestamp, frame identities, corrected pose, and broadcasts the transform.
  - id: M-3-PC-4
    text: The installed launch exposes marker_size and passes it to the tracker node.
    evaluation: static
    reference_evidence:
    - path: launch/turtlebot3_aruco_tracker.launch.py
      anchor: marker_size_arg
      snippet: |2-
            marker_size_arg = DeclareLaunchArgument(
                'marker_size',
                default_value='0.04',
                description='ArUco marker size in meters'
            )
            marker_size = LaunchConfiguration('marker_size')
      explanation: Declares the marker-size launch setting.
    - path: launch/turtlebot3_aruco_tracker.launch.py
      anchor: parameters
      snippet: |2-
            aruco_tracker_node = Node(
                package='turtlebot3_aruco_tracker',
                executable='turtlebot3_aruco_tracker',
                name='turtlebot3_aruco_tracker',
                output='screen',
                parameters=[{'marker_size': marker_size}]
            )
      explanation: Supplies the selected physical marker size to the launched tracker.
