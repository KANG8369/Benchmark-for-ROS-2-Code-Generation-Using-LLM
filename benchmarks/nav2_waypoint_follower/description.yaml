intent:
  package_name: nav2_waypoint_follower
  summary: Provides a lifecycle-managed waypoint-following action server that navigates
    through Cartesian or GPS waypoint sequences and optionally performs a configurable
    task after each reached waypoint.
  scope: Orchestrates waypoint sequencing, waypoint-result reporting, GPS coordinate
    conversion requests, and package-provided waypoint task-executor plugins; navigation
    execution, GPS conversion provision, and action clients are external responsibilities.

functional_requirements:
  - id: FR-1
    text: >-
      The lifecycle waypoint follower accepts Cartesian waypoint goals,
      sends each waypoint in order to navigation, reports the active
      waypoint index, and returns missed waypoint details when processing
      completes.

  - id: FR-2
    text: >-
      The follower supports repeated waypoint-sequence loops, goal
      cancellation, and goal preemption while processing a
      waypoint-following request.

  - id: FR-3
    text: >-
      The follower can either stop immediately or continue to later
      waypoints after navigation, waypoint-task, or GPS-conversion failures
      according to its failure policy.

  - id: FR-4
    text: >-
      The follower accepts GPS waypoint goals, converts each geographic pose
      through the configured geographic conversion service into the
      configured global frame, and navigates the successfully converted
      poses.

  - id: FR-5
    text: >-
      When activated, the follower makes its Cartesian and GPS waypoint
      actions available and establishes its lifecycle-manager bond;
      deactivation makes both actions unavailable and destroys the bond.

  - id: FR-6
    text: >-
      The exported wait-at-waypoint task executor pauses at each reached
      waypoint for a configured duration when enabled.

  - id: FR-7
    text: >-
      The exported photo-at-waypoint task executor subscribes to a
      configured image stream and saves the latest image at each reached
      waypoint when enabled and able to create its output directory.

  - id: FR-8
    text: >-
      The exported input-at-waypoint task executor waits for an empty input
      message at each reached waypoint until its configured timeout and
      reports failure when no input arrives.

target_environment: >-
  A Nav2-enabled mobile robot.
