intent:
  package_name: nav2_waypoint_follower
  summary: Provides a lifecycle-managed waypoint-following action server that navigates
    through Cartesian or GPS waypoint sequences and optionally performs a configurable
    task after each reached waypoint.
  scope: Orchestrates waypoint sequencing, waypoint-result reporting, GPS coordinate
    conversion requests, and package-provided waypoint task-executor plugins; navigation
    execution, GPS conversion provision, and action clients are external responsibilities.
functional_requirements:
- id: FR-1
  text: The lifecycle waypoint follower accepts Cartesian waypoint goals, sends each
    waypoint in order to navigation, reports the active waypoint index, and returns
    missed waypoint details when processing completes.
- id: FR-2
  text: The follower supports repeated waypoint-sequence loops, goal cancellation,
    and goal preemption while processing a waypoint-following request.
- id: FR-3
  text: The follower can either stop immediately or continue to later waypoints after
    navigation, waypoint-task, or GPS-conversion failures according to its failure
    policy.
- id: FR-4
  text: The follower accepts GPS waypoint goals, converts each geographic pose through
    the configured geographic conversion service into the configured global frame,
    and navigates the successfully converted poses.
- id: FR-5
  text: When activated, the follower makes its Cartesian and GPS waypoint actions
    available and establishes its lifecycle-manager bond; deactivation makes both
    actions unavailable and destroys the bond.
- id: FR-6
  text: The exported wait-at-waypoint task executor pauses at each reached waypoint
    for a configured duration when enabled.
- id: FR-7
  text: The exported photo-at-waypoint task executor subscribes to a configured image
    stream and saves the latest image at each reached waypoint when enabled and able
    to create its output directory.
- id: FR-8
  text: The exported input-at-waypoint task executor waits for an empty input message
    at each reached waypoint until its configured timeout and reports failure when
    no input arrives.
interfaces:
  nodes:
  - name: waypoint_follower
    responsibility: Lifecycle-managed server that sequences Cartesian or GPS waypoints
      through navigation and invokes a selected waypoint task executor after successful
      arrivals.
    topics:
    - name: <configured_image_topic>
      type: sensor_msgs/msg/Image
      direction: subscribe
      purpose: Receives the latest camera image for the selected photo-at-waypoint
        task executor.
    - name: <configured_input_topic>
      type: std_msgs/msg/Empty
      direction: subscribe
      purpose: Receives confirmation input for the selected input-at-waypoint task
        executor.
    - name: bond
      type: bond/msg/Status
      direction: publish
      purpose: Publishes lifecycle heartbeat and bond status while the follower is
        active.
    - name: bond
      type: bond/msg/Status
      direction: subscribe
      purpose: Receives lifecycle-manager bond status while the follower is active.
    services:
    - name: ~/change_state
      type: lifecycle_msgs/srv/ChangeState
      role: server
      purpose: Accepts lifecycle transition requests for the waypoint follower.
    - name: ~/get_state
      type: lifecycle_msgs/srv/GetState
      role: server
      purpose: Reports the current lifecycle state of the waypoint follower.
    - name: ~/get_available_states
      type: lifecycle_msgs/srv/GetAvailableStates
      role: server
      purpose: Reports the lifecycle states supported by the waypoint follower.
    - name: ~/get_available_transitions
      type: lifecycle_msgs/srv/GetAvailableTransitions
      role: server
      purpose: Reports transitions currently available from the follower's lifecycle
        state.
    - name: ~/get_transition_graph
      type: lifecycle_msgs/srv/GetAvailableTransitions
      role: server
      purpose: Reports the complete lifecycle transition graph.
    - name: /fromLL
      type: robot_localization/srv/FromLL
      role: client
      purpose: Converts GPS longitude, latitude, and altitude coordinates to map-frame
        Cartesian positions.
    actions:
    - name: follow_waypoints
      type: nav2_msgs/action/FollowWaypoints
      role: server
      purpose: Accepts Cartesian waypoint sequences and reports waypoint-following
        progress and missed waypoints.
    - name: follow_gps_waypoints
      type: nav2_msgs/action/FollowGPSWaypoints
      role: server
      purpose: Accepts geographic waypoint sequences for conversion and navigation.
    - name: navigate_to_pose
      type: nav2_msgs/action/NavigateToPose
      role: client
      purpose: Sends each waypoint pose to the navigation system.
    parameters:
    - name: stop_on_failure
      type: bool
      purpose: Selects whether waypoint processing terminates when navigation, conversion,
        or task execution fails.
    - name: loop_rate
      type: integer
      purpose: Sets the processing rate for waypoint action execution.
    - name: waypoint_task_executor_plugin
      type: string
      purpose: Selects the identifier of the waypoint task executor loaded by the
        follower.
    - name: global_frame_id
      type: string
      purpose: Sets the frame identifier assigned to Cartesian poses converted from
        GPS waypoints.
    - name: bond_heartbeat_period
      type: double
      purpose: Sets the lifecycle bond heartbeat period in seconds, with a nonpositive
        value disabling bond creation.
    - name: autostart_node
      type: bool
      purpose: Selects whether the Nav2 lifecycle base automatically configures and
        activates the waypoint follower after startup.
    - name: wait_at_waypoint.plugin
      type: string
      purpose: Selects the default wait-at-waypoint task executor implementation.
    - name: <waypoint_task_executor_id>.plugin
      type: string
      purpose: Selects the implementation class for the runtime-selected waypoint
        task executor identifier.
    - name: <waypoint_task_executor_id>.waypoint_pause_duration
      type: integer
      purpose: Sets the pause duration in milliseconds for a selected wait-at-waypoint
        task executor.
    - name: <waypoint_task_executor_id>.enabled
      type: bool
      purpose: Enables or disables a selected wait, photo, or input waypoint task
        executor.
    - name: <waypoint_task_executor_id>.save_dir
      type: string
      purpose: Sets the output directory used by a selected photo-at-waypoint task
        executor.
    - name: <waypoint_task_executor_id>.image_topic
      type: string
      purpose: Selects the image topic subscribed to by a selected photo-at-waypoint
        task executor.
    - name: <waypoint_task_executor_id>.image_format
      type: string
      purpose: Sets the image file format written by a selected photo-at-waypoint
        task executor.
    - name: <waypoint_task_executor_id>.input_topic
      type: string
      purpose: Selects the empty-message input topic subscribed to by a selected input-at-waypoint
        task executor.
    - name: <waypoint_task_executor_id>.timeout
      type: double
      purpose: Sets how long a selected input-at-waypoint task executor waits for
        confirmation input.
