package_name: nav2_waypoint_follower
metrics:
- id: DYN-01
  requirement: >-
    Accept Cartesian waypoint sequences, dispatch waypoints in order, report the active
    index and return missed-waypoint details consistent with navigation/task results. Use
    deterministic external servers with 0.2-second replies; external robot navigation performance
    is outside this package's responsibility.
  evaluation_period: >-
    Allow 5 wall-time seconds for candidate progression after each external response. The
    frozen goal bound is 10+N*(5+0.2+Dmax) seconds, where N is the total requested visits
    and Dmax the largest configured task wait/timeout. Freeze N and Dmax before the test.
    If an external server misses its scheduled reply, the test is invalid.
- id: DYN-02
  requirement: >-
    Repeat the requested sequence loops and handle cancellation/preemption. Stop dispatching
    old-sequence goals within 5 seconds; late results from an already dispatched goal must
    not advance a canceled or superseded request. Begin processing a replacement request
    within 5 seconds with promptly responding external test servers.
  evaluation_period: >-
    Use 10+N*(5+0.2+Dmax) wall-time seconds, where N is the requested waypoint visits and
    Dmax the greatest configured task wait/timeout; add 5 seconds per injected transition.
    Exercise three waypoints in two loops. An already dispatched navigation goal may finish,
    but its late result must not advance the canceled request or affect the replacement
    request.
- id: DYN-03
  requirement: >-
    After navigation, task or GPS-conversion failure, stop or proceed according to the configured
    failure policy and report the failures accurately. Exercise each failure class with
    both policy settings using controlled external replies, not failing external infrastructure.
  evaluation_period: >-
    Allow 5 wall-time seconds after an on-time failure response for the required stop/result
    or next-waypoint progression. Bound the complete request by 10+N*(5+0.2+Dmax)+G*(5+0.2)
    wall-time seconds, where N is the scheduled waypoint visits, G the GPS conversions and
    Dmax the greatest configured task wait/timeout. Fix these before execution.
- id: DYN-04
  requirement: >-
    Convert GPS waypoints through the configured external service and dispatch successfully
    converted poses in the configured global frame. Compare position with absolute 1e-6
    m plus relative 1e-6, orientation with 1e-6 rad geodesic tolerance and frame identifiers
    exactly. Equivalent quaternion signs are accepted; GPS accuracy is not evaluated.
  evaluation_period: >-
    Use 0.2-second conversion/navigation test-server replies and a 5-second candidate progression
    allowance. Use the bound 10+N*(5+0.2+Dmax)+G*(5+0.2) seconds, where G is the scheduled
    number of GPS-conversion requests. Fix N, G and Dmax before execution.
- id: DYN-05
  requirement: >-
    Activation shall make Cartesian/GPS waypoint actions usable and establish the lifecycle-manager
    bond. Deactivation shall make the actions unavailable and destroy the bond. Verify service
    results, action behavior and bond events rather than graph presence alone.
  evaluation_period: >-
    Keep 7 wall-time seconds to measured lifecycle-service availability, 1 second per configure/activate/deactivate
    reply and 2 seconds for cleanup. Allow 5 seconds for resulting action/bond transitions.
- id: DYN-06
  requirement: >-
    Exercise the candidate's wait, photo and input task executors. Wait for configured durations;
    save the latest available identified image when possible; wait for Empty input up to
    the configured timeout and report failure if none arrives. Test both timely input and
    timeout.
  evaluation_period: >-
    A configured duration may finish at most 0.1 seconds early and max(1 second, 5 percent
    of duration) late. Supply identifiable images at 2 Hz, stop the stream after a known
    final image, wait at least 1 second and then trigger the photo task. Compare lossless
    saved content exactly, or decoded JPEG with MAE <=5 and 99th-percentile absolute error
    <=20 on a 0-255 scale. Allow 5 seconds for file output.
