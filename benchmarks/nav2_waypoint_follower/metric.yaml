package_name: nav2_waypoint_follower
reference:
  root: reference/
metrics:
- id: M-1
  name: Cartesian waypoint sequencing
  description: Cartesian goals are sent to navigation in indexed order with active-index feedback and missed-waypoint results as required by FR-1.
  requirement_ids:
  - FR-1
  pass_criteria:
  - id: M-1-PC-1
    text: The lifecycle node exposes a follow_waypoints action server and a navigate_to_pose action client.
    evaluation: static
    reference_evidence:
    - path: src/waypoint_follower.cpp
      anchor: follow_waypoints
      snippet: |2-
          nav_to_pose_client_ = create_action_client<ClientT>(
            "navigate_to_pose", callback_group_);
        
          xyz_action_server_ = create_action_server<ActionT>(
            "follow_waypoints", std::bind(
              &WaypointFollower::followWaypointsCallback,
              this), nullptr, std::chrono::milliseconds(
              500), false);
      explanation: Creates the public Cartesian action server and downstream navigation client used by the sequence.
  - id: M-1-PC-2
    text: The current indexed Cartesian pose is sent as a NavigateToPose goal before the index advances.
    evaluation: static
    reference_evidence:
    - path: src/waypoint_follower.cpp
      anchor: client_goal.pose
      snippet: |2-
            if (new_goal) {
              new_goal = false;
              ClientT::Goal client_goal;
              client_goal.pose = poses[goal_index];
              client_goal.pose.header.stamp = this->now();
        
              auto send_goal_options = nav2::ActionClient<ClientT>::SendGoalOptions();
              send_goal_options.result_callback = std::bind(
                &WaypointFollower::resultCallback, this,
                std::placeholders::_1);
              send_goal_options.goal_response_callback = std::bind(
                &WaypointFollower::goalResponseCallback,
                this, std::placeholders::_1);
        
              future_goal_handle_ =
                nav_to_pose_client_->async_send_goal(client_goal, send_goal_options);
              current_goal_status_.status = ActionStatus::PROCESSING;
            }
      explanation: Uses goal_index to select and asynchronously send the current pose to navigation.
  - id: M-1-PC-3
    text: The action publishes current_waypoint feedback using the active sequence index.
    evaluation: static
    reference_evidence:
    - path: src/waypoint_follower.cpp
      anchor: feedback->current_waypoint
      snippet: |2-
            feedback->current_waypoint = goal_index;
            action_server->publish_feedback(feedback);
      explanation: Reports the currently active waypoint index to the action client.
  - id: M-1-PC-4
    text: Failed waypoints are appended with index, pose, and error details, and successful exhaustion completes the action with that result.
    evaluation: static
    reference_evidence:
    - path: src/waypoint_follower.cpp
      anchor: result->missed_waypoints.push_back
      snippet: |2-
              nav2_msgs::msg::WaypointStatus missedWaypoint;
              missedWaypoint.waypoint_status = nav2_msgs::msg::WaypointStatus::FAILED;
              missedWaypoint.waypoint_index = goal_index;
              missedWaypoint.waypoint_pose = poses[goal_index];
              missedWaypoint.error_code = current_goal_status_.error_code;
              missedWaypoint.error_msg = current_goal_status_.error_msg;
              result->missed_waypoints.push_back(missedWaypoint);
      explanation: Records complete missed-waypoint information in the final action result object.
    - path: src/waypoint_follower.cpp
      anchor: Completed all
      snippet: |2-
                if (current_loop_no == no_of_loops) {
                  RCLCPP_INFO(
                    get_logger(), "Completed all %zu waypoints requested.",
                    poses.size());
                  action_server->succeeded_current(result);
                  current_goal_status_.error_code = 0;
                  current_goal_status_.error_msg = "";
                  return;
                }
      explanation: Completes the action with the accumulated result after the requested sequence and loops finish.
- id: M-2
  name: Loop, cancellation, and preemption control
  description: Active waypoint execution supports repeated loops, cancellation, and replacement by a pending goal as required by FR-2.
  requirement_ids:
  - FR-2
  pass_criteria:
  - id: M-2-PC-1
    text: After the final waypoint, the sequence restarts at index zero until number_of_loops is exhausted.
    evaluation: static
    reference_evidence:
    - path: src/waypoint_follower.cpp
      anchor: Starting a new loop
      snippet: |2-
              if (goal_index >= poses.size()) {
                if (current_loop_no == no_of_loops) {
                  RCLCPP_INFO(
                    get_logger(), "Completed all %zu waypoints requested.",
                    poses.size());
                  action_server->succeeded_current(result);
                  current_goal_status_.error_code = 0;
                  current_goal_status_.error_msg = "";
                  return;
                }
                RCLCPP_INFO(
                  get_logger(), "Starting a new loop, current loop count is %i",
                  current_loop_no);
                goal_index = 0;
                current_loop_no++;
              }
      explanation: Restarts the indexed sequence until the requested loop count reaches its completion condition.
  - id: M-2-PC-2
    text: A cancellation request cancels navigation goals, terminates the waypoint action, and returns.
    evaluation: static
    reference_evidence:
    - path: src/waypoint_follower.cpp
      anchor: is_cancel_requested
      snippet: |2-
            if (action_server->is_cancel_requested()) {
              auto cancel_future = nav_to_pose_client_->async_cancel_all_goals();
              callback_group_executor_.spin_until_future_complete(cancel_future);
              // for result callback processing
              callback_group_executor_.spin_some();
              action_server->terminate_all();
              return;
            }
      explanation: Propagates cancellation to navigation and terminates active waypoint execution.
  - id: M-2-PC-3
    text: A preemption request accepts the pending goal, replaces the pose sequence, and restarts at waypoint zero.
    evaluation: static
    reference_evidence:
    - path: src/waypoint_follower.cpp
      anchor: is_preempt_requested
      snippet: |2-
            if (action_server->is_preempt_requested()) {
              RCLCPP_INFO(get_logger(), "Preempting the goal pose.");
              goal = action_server->accept_pending_goal();
              poses = getLatestGoalPoses<T>(action_server);
              if (poses.empty()) {
                result->error_code =
                  nav2_msgs::action::FollowWaypoints::Result::NO_VALID_WAYPOINTS;
                result->error_msg =
                  "Empty vector of Waypoints passed to waypoint following logic. "
                  "Nothing to execute, returning with failure!";
                RCLCPP_ERROR(get_logger(), "%s", result->error_msg.c_str());
                action_server->terminate_current(result);
                return;
              }
              goal_index = 0;
              new_goal = true;
            }
      explanation: Replaces the active goal data and resets indexed execution for a valid pending goal.
- id: M-3
  name: Configurable failure continuation
  description: Navigation, waypoint-task, and GPS-conversion failures obey stop_on_failure by either terminating or continuing as required by FR-3.
  requirement_ids:
  - FR-3
  pass_criteria:
  - id: M-3-PC-1
    text: Navigation failure is recorded and either terminates immediately or allows the loop to advance according to stop_on_failure.
    evaluation: static
    reference_evidence:
    - path: src/waypoint_follower.cpp
      anchor: STOP_ON_MISSED_WAYPOINT
      snippet: |2-
              if (params_->stop_on_failure) {
                result->error_code =
                  nav2_msgs::action::FollowWaypoints::Result::STOP_ON_MISSED_WAYPOINT;
                result->error_msg =
                  "Failed to process waypoint " + std::to_string(goal_index) +
                  " in waypoint list and stop on failure is enabled."
                  " Terminating action.";
                RCLCPP_WARN(get_logger(), "%s", result->error_msg.c_str());
                action_server->terminate_current(result);
                current_goal_status_.error_code = 0;
                current_goal_status_.error_msg = "";
                return;
              } else {
                RCLCPP_INFO(
                  get_logger(), "Failed to process waypoint %i,"
                  " moving to next.", goal_index);
              }
      explanation: Contains both stop and continue branches for a failed navigation result.
  - id: M-3-PC-2
    text: Waypoint-task failure is recorded and terminates only when stop_on_failure is enabled.
    evaluation: static
    reference_evidence:
    - path: src/waypoint_follower.cpp
      anchor: TASK_EXECUTOR_FAILED
      snippet: |2-
              if (!is_task_executed) {
                nav2_msgs::msg::WaypointStatus missedWaypoint;
                missedWaypoint.waypoint_status = nav2_msgs::msg::WaypointStatus::FAILED;
                missedWaypoint.waypoint_index = goal_index;
                missedWaypoint.waypoint_pose = poses[goal_index];
                missedWaypoint.error_code =
                  nav2_msgs::action::FollowWaypoints::Result::TASK_EXECUTOR_FAILED;
                missedWaypoint.error_msg = "Task execution failed";
                result->missed_waypoints.push_back(missedWaypoint);
              }
              // if task execution was failed and stop_on_failure_ is on , terminate action
              if (!is_task_executed && params_->stop_on_failure) {
                result->error_code =
                  nav2_msgs::action::FollowWaypoints::Result::TASK_EXECUTOR_FAILED;
                result->error_msg =
                  "Failed to execute task at waypoint " + std::to_string(goal_index) +
                  " stop on failure is enabled. Terminating action.";
                RCLCPP_WARN(get_logger(), "%s", result->error_msg.c_str());
                action_server->terminate_current(result);
                current_goal_status_.error_code = 0;
                current_goal_status_.error_msg = "";
                return;
      explanation: Records task failure and gates immediate termination on the configured policy.
  - id: M-3-PC-3
    text: Failed GPS conversion returns an empty sequence when stop_on_failure is enabled and otherwise skips only the failed waypoint.
    evaluation: static
    reference_evidence:
    - path: src/waypoint_follower.cpp
      anchor: fromLL service
      snippet: |2-
            if (!from_ll_to_map_client_->invoke(request, response)) {
              RCLCPP_ERROR(
                this->get_logger(),
                "fromLL service of robot_localization could not convert %i th GPS waypoint to"
                "%s frame, going to skip this point!"
                "Make sure you have run navsat_transform_node of robot_localization",
                waypoint_index, params_->global_frame_id.c_str());
              if (params_->stop_on_failure) {
                RCLCPP_ERROR(
                  this->get_logger(),
                  "Conversion of %i th GPS waypoint to"
                  "%s frame failed and stop_on_failure is set to true"
                  "Not going to execute any of waypoints, exiting with failure!",
                  waypoint_index, params_->global_frame_id.c_str());
                return std::vector<geometry_msgs::msg::PoseStamped>();
              }
              continue;
      explanation: Implements package-wide abort or per-waypoint skip behavior for conversion failure.
