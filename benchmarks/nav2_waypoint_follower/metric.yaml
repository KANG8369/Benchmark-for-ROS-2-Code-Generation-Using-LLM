- id: M-5
  name: Lifecycle action and bond availability
  description: Lifecycle activation and deactivation jointly control both action servers and the lifecycle-manager bond as required by FR-5.
  requirement_ids:
  - FR-5
  pass_criteria:
  - id: M-5-PC-1
    text: Activation makes both waypoint action servers available and creates the lifecycle bond.
    evaluation: static
    reference_evidence:
    - path: src/waypoint_follower.cpp
      anchor: on_activate
      snippet: |2-
        WaypointFollower::on_activate(const rclcpp_lifecycle::State & /*state*/)
        {
          RCLCPP_INFO(get_logger(), "Activating");
        
          xyz_action_server_->activate();
          gps_action_server_->activate();
        
          // create bond connection
          createBond();
        
          return nav2::CallbackReturn::SUCCESS;
        }
      explanation: Activates both public actions before establishing the lifecycle-manager bond.
  - id: M-5-PC-2
    text: Deactivation makes both waypoint action servers unavailable and destroys the lifecycle bond.
    evaluation: static
    reference_evidence:
    - path: src/waypoint_follower.cpp
      anchor: on_deactivate
      snippet: |2-
        WaypointFollower::on_deactivate(const rclcpp_lifecycle::State & /*state*/)
        {
          RCLCPP_INFO(get_logger(), "Deactivating");
        
          xyz_action_server_->deactivate();
          gps_action_server_->deactivate();
          // destroy bond connection
          destroyBond();
        
          return nav2::CallbackReturn::SUCCESS;
        }
      explanation: Deactivates both actions and tears down the lifecycle bond in the same transition.
