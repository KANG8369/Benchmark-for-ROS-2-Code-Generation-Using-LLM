- id: M-8
  name: Input-at-waypoint task executor
  description: The exported input task waits for an Empty confirmation until its configured timeout and fails on timeout as required by FR-8.
  requirement_ids:
  - FR-8
  pass_criteria:
  - id: M-8-PC-1
    text: The input plugin reads enabled, input_topic, and timeout settings and subscribes to Empty messages on the selected topic.
    evaluation: static
    reference_evidence:
    - path: plugins/input_at_waypoint.cpp
      anchor: input_topic
      snippet: |2-
          is_enabled_ = node->declare_or_get_parameter(
            plugin_name + ".enabled", true);
          input_topic = node->declare_or_get_parameter(
            plugin_name + ".input_topic", std::string("input_at_waypoint/input"));
          timeout = node->declare_or_get_parameter(
            plugin_name + ".timeout", 10.0);
          timeout_ = rclcpp::Duration(timeout, 0.0);
        
          RCLCPP_INFO(
            logger_, "InputAtWaypoint: Subscribing to input topic %s.", input_topic.c_str());
          subscription_ = node->create_subscription<std_msgs::msg::Empty>(
            input_topic, std::bind(&InputAtWaypoint::Cb, this, _1));
      explanation: Configures and creates the required Empty-message confirmation subscription.
  - id: M-8-PC-2
    text: Receipt of an Empty message marks confirmation, and processAtWaypoint returns success when it observes that mark before timeout.
    evaluation: static
    reference_evidence:
    - path: plugins/input_at_waypoint.cpp
      anchor: InputAtWaypoint::Cb
      snippet: |2-
        void InputAtWaypoint::Cb(const std_msgs::msg::Empty::ConstSharedPtr & /*msg*/)
        {
          std::lock_guard<std::mutex> lock(mutex_);
          input_received_ = true;
        }
      explanation: Atomically records arrival of the configured confirmation message.
    - path: plugins/input_at_waypoint.cpp
      anchor: if (input_received)
      snippet: |2-
          while (clock_->now() - start < timeout_) {
            {
              std::lock_guard<std::mutex> lock(mutex_);
              input_received = input_received_;
            }
        
            if (input_received) {
              return true;
            }
        
            r.sleep();
          }
      explanation: Polls the protected confirmation state and succeeds only when input arrives within the timeout window.
  - id: M-8-PC-3
    text: An enabled task that receives no confirmation before timeout logs a warning and reports failure.
    evaluation: static
    reference_evidence:
    - path: plugins/input_at_waypoint.cpp
