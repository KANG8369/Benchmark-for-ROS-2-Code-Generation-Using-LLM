  requirement_ids:
  - FR-4
  pass_criteria:
  - id: M-4-PC-1
    text: A zero output-subscription count causes an immediate return before scan conversion and publication.
    evaluation: static
    reference_evidence:
    - path: src/laser_scan_merger.cpp
      anchor: get_subscription_count
      snippet: |2-
          if (merged_pub_->get_subscription_count() == 0) {
            RCLCPP_WARN_STREAM_ONCE(get_logger(),
                                    " (" << __func__
                                         << "): merged scan will only be published "
                                            "when there is at least one subscriber.");
            return;
          }
        
          sensor_msgs::msg::PointCloud2::SharedPtr cloud_sources[9];
      explanation: The controlling condition exits before allocating and processing merged data.
- id: M-5
  name: Supported input-count validation
  description: Synchronizer initialization is refused outside the supported two-through-nine topic range as required by FR-5.
  requirement_ids:
  - FR-5
  pass_criteria:
  - id: M-5-PC-1
    text: More than nine configured scan topics produce an error and return before index and subscriber setup.
    evaluation: static
    reference_evidence:
    - path: src/laser_scan_merger.cpp
      anchor: scan_topics_.size() > 9
      snippet: |2-
          if (scan_topics_.size() > 9) {
            RCLCPP_ERROR_STREAM(
                get_logger(),
                " (" << __func__
                     << ") currently only support merging up to 9 laser scans.");
            return;
      explanation: Rejects input counts above the highest supported synchronizer arity.
  - id: M-5-PC-2
    text: Fewer than two configured scan topics produce an error and return before index and subscriber setup.
    evaluation: static
    reference_evidence:
    - path: src/laser_scan_merger.cpp
      anchor: scan_topics_.size() < 2
      snippet: |2-
          } else if (scan_topics_.size() < 2) {
            RCLCPP_ERROR_STREAM(
                get_logger(), " (" << __func__ << ") input scan topic is less than 2.");
            return;
          }
      explanation: Rejects input counts below the minimum meaningful merge size.
- id: M-6
  name: Per-input QoS policy normalization
  description: Missing QoS policies are filled with reliable delivery and excess policies are ignored, satisfying FR-6.
  requirement_ids:
  - FR-6
  pass_criteria:
  - id: M-6-PC-1
    text: A shorter scan_policies list is resized to the scan topic count with reliable policy value zero.
    evaluation: static
    reference_evidence:
    - path: src/laser_scan_merger.cpp
      anchor: scan_policies_.resize
      snippet: |2-
          if (scan_policies_.size() < scan_topics_.size()) {
            // Auto fill if not filled
            RCLCPP_WARN_STREAM(
                get_logger(),
                " (" << __func__
                     << ") policies and topics size mismatch or not found... "
                        "auto filling QoS reliable...");
            scan_policies_.resize(scan_topics_.size(), 0);
      explanation: Pads every missing per-topic policy with the value used for reliable QoS.
  - id: M-6-PC-2
    text: Excess policies do not create extra subscribers, while each in-range policy selects reliable or best-effort delivery for its scan topic.
    evaluation: static
    reference_evidence:
    - path: src/laser_scan_merger.cpp
      anchor: policies > topics size
      snippet: |2-
          } else if (scan_policies_.size() > scan_topics_.size()) {
            RCLCPP_WARN_STREAM(
                get_logger(),
                " (" << __func__
                     << ") policies > topics size, ignoring additional policies.");
          }
      explanation: Explicitly treats policies beyond the topic count as ignored.
    - path: src/laser_scan_merger.cpp
      anchor: scan_policies_[index]
      snippet: |2-
          std::for_each(indexes_.begin(), indexes_.end(), [this](auto& index) {
            if (scan_policies_[index] == 0) {
              // reliable
              qos_prof_.reliable();
            } else {
              // best effort
              qos_prof_.best_effort();
            }
        
            // Create subscriber for each given scan topic
            scan_subs_.emplace_back(
                std::make_shared<message_filters::Subscriber<laserScanMsgT>>(
                    this, scan_topics_[index], qos_prof_.get_rmw_qos_profile()));
          });
      explanation: Iterates only topic-derived indexes and applies each corresponding policy to that topic's subscriber.
- id: M-7
  name: Component and demo launch orchestration
  description: The package launch hosts the merger with robot-selected configuration, while the demo also starts RViz and looping bag playback as required by FR-7.
  requirement_ids:
  - FR-7
  pass_criteria:
  - id: M-7-PC-1
    text: The standard launch creates an rclcpp component container and loads LaserScanMerger with config/<robotname>/param.yaml.
    evaluation: static
    reference_evidence:
    - path: launch/start.launch.py
      anchor: ComposableNodeContainer
      snippet: |2-
            container = ComposableNodeContainer(
                package="rclcpp_components",
                executable="component_container",
                name="component_manager_node",
                namespace="",
                composable_node_descriptions=[
                    ComposableNode(
                        package="laser_scan_merger",
                        plugin="util::LaserScanMerger",
                        name="laser_scan_merger_node",
                        parameters=[PathJoinSubstitution([
                            get_package_share_directory('laser_scan_merger'),
                            'config',
                            LaunchConfiguration('robotname'),
                            'param.yaml'
                        ])]
                    )
                ],
                output="screen"
            )
      explanation: Hosts the merger component and derives its parameter file from the robotname launch argument.
  - id: M-7-PC-2
    text: The demo launch adds RViz with the packaged configuration and attempts looping playback of the packaged demo bag.
    evaluation: static
    reference_evidence:
    - path: launch/start_demo.launch.py
      anchor: start_rviz2
      snippet: |2-
            start_rviz2 = Node(
                package="rviz2",
                executable="rviz2",
                output="screen",
                arguments=[
                    "-d", path.join(get_package_share_directory("laser_scan_merger"),
                    "rviz", "demo.rviz")
                ],
            )
      explanation: Starts RViz with the package's demo display configuration.
    - path: launch/start_demo.launch.py
      anchor: play_rosbag
      snippet: |2-
            play_rosbag = ExecuteProcess(
                cmd=[
                    "ros2", "bag", "play", "-l",
                    path.join(get_package_share_directory("laser_scan_merger"),
                    "test", "demo_scan_rosbag", "demo_scan"
                )],
                shell=True,
                output="screen"
            )
      explanation: Attempts to run looping ros2 bag playback for the packaged demo recording.
