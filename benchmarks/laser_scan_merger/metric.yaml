package_name: laser_scan_merger
reference:
  root: reference/
metrics:
- id: M-1
  name: Multi-scan synchronized merge
  description: Two through nine scan streams are approximately synchronized, projected, transformed, consolidated, and published in the merged frame as required by FR-1.
  requirement_ids:
  - FR-1
  pass_criteria:
  - id: M-1-PC-1
    text: The configured subscriber count selects an approximate-time synchronizer implementation for every supported count from two through nine.
    evaluation: static
    reference_evidence:
    - path: src/laser_scan_merger.cpp
      anchor: switch (scan_subs_.size())
      snippet: |2-
          switch (scan_subs_.size()) {
            case 2:
              initLaserSync<2u>();
              break;
        
            case 3:
              initLaserSync<3u>();
              break;
        
            case 4:
              initLaserSync<4u>();
              break;
        
            case 5:
              initLaserSync<5u>();
              break;
        
            case 6:
              initLaserSync<6u>();
              break;
        
            case 7:
              initLaserSync<7u>();
              break;
        
            case 8:
              initLaserSync<8u>();
              break;
        
            case 9:
              initLaserSync<9u>();
              break;
      explanation: Dispatches each supported number of scan subscribers to its corresponding synchronizer.
    - path: src/laser_scan_merger.cpp
      anchor: initLaserSync<2u>
      snippet: |2-
        void LaserScanMerger::initLaserSync<2u>() {
          scan_sync_ = std::make_unique<message_filters::Synchronizer<syncPolicyT2>>(
              syncPolicyT2(queue_size_), *scan_subs_[0], *scan_subs_[1]);
          if (auto v = std::get_if<
                  std::unique_ptr<message_filters::Synchronizer<syncPolicyT2>>>(
                  &scan_sync_)) {
            (*v)->registerCallback<cbT2>([this](auto& cloud0, auto& cloud1, ...) {
              laserScanMergerPrep(cloud0, cloud1);
            });
          }
        }
      explanation: Demonstrates that a supported count is approximately synchronized and forwarded as one callback set.
  - id: M-1-PC-2
    text: Every synchronized LaserScan is projected to a point cloud, transformed into the merged frame, and accumulated with the other inputs.
    evaluation: static
    reference_evidence:
    - path: src/laser_scan_merger.cpp
      anchor: projectLaser
      snippet: |2-
            std::for_each(indexes_.begin(), indexes_.end(), [&, this](auto& index) {
              // Init cloud place holder
              cloud_sources[index] = std::make_shared<sensor_msgs::msg::PointCloud2>();
              // Scan -> cloud
              projection_.projectLaser(*msgs[index], *cloud_sources[index]);
              // transform cloud
              tf2::doTransform(*cloud_sources[index], *cloud_sources[index],
                               transforms_[index]);
            });
      explanation: Projects and transforms each synchronized scan source.
    - path: src/laser_scan_merger.cpp
      anchor: pcl::fromROSMsg
      snippet: |2-
          std::for_each(indexes_.begin(), indexes_.end(), [&, this](auto& index) {
            pointCloudT cloud;
            pcl::fromROSMsg(*cloud_sources[index], cloud);
            *merged_cloud_ += cloud;
          });
      explanation: Converts and accumulates all transformed sources into one merged cloud.
  - id: M-1-PC-3
    text: The merged points are converted to a LaserScan whose frame_id is merged_frame_id and the result is published.
    evaluation: static
    reference_evidence:
    - path: src/laser_scan_merger.cpp
      anchor: scan_msg->header.frame_id
      snippet: |2-
          auto scan_msg = std::make_unique<sensor_msgs::msg::LaserScan>();
          scan_msg->header = msgs.front()->header;
          scan_msg->header.frame_id = merged_frame_id_;
      explanation: Creates the output scan and assigns the configured merged frame.
    - path: src/laser_scan_merger.cpp
      anchor: merged_pub_->publish
      snippet: |2-
          merged_pub_->publish(std::move(scan_msg));
      explanation: Publishes the completed merged LaserScan.
- id: M-2
  name: Output binning and filtering policies
  description: Angular, range, height, timing, empty-bin, and nearest-point policies are applied to the merged scan as required by FR-2.
  requirement_ids:
  - FR-2
  pass_criteria:
  - id: M-2-PC-1
    text: Output angle, range, scan-time, and zero time-increment metadata are populated from configured policies.
    evaluation: static
    reference_evidence:
    - path: src/laser_scan_merger.cpp
      anchor: scan_msg->angle_min
      snippet: |2-
          scan_msg->angle_min = ang_min_;
          scan_msg->angle_max = ang_max_;
          scan_msg->angle_increment = ang_increment_;
          scan_msg->time_increment = 0.0;
          scan_msg->scan_time = scan_time_;
          scan_msg->range_min = range_min_;
          scan_msg->range_max = range_max_;
      explanation: Copies the configured angular, range, and timing contract into the output message.
  - id: M-2-PC-2
    text: Empty angular bins use positive infinity or range_max plus inf_epsilon according to use_inf.
    evaluation: static
    reference_evidence:
    - path: src/laser_scan_merger.cpp
      anchor: if (use_inf_)
      snippet: |2-
          if (use_inf_) {
            scan_msg->ranges.assign(ranges_size,
                                    std::numeric_limits<double>::infinity());
          } else {
            scan_msg->ranges.assign(ranges_size, scan_msg->range_max + inf_eps_);
          }
      explanation: Initializes all empty bins with the selected empty-range representation.
  - id: M-2-PC-3
    text: NaN points and points outside configured height, range, or angular bounds are excluded from output bins.
    evaluation: static
    reference_evidence:
    - path: src/laser_scan_merger.cpp
      anchor: rejected for nan
      snippet: |2-
                if (std::isnan(point.x) || std::isnan(point.y) || std::isnan(point.z)) {
                  RCLCPP_DEBUG(get_logger(), "rejected for nan in point(%f, %f, %f)\n",
                               point.x, point.y, point.z);
                  return;
                }
        
                if (point.z > max_height_ || point.z < min_height_) {
                  RCLCPP_DEBUG(get_logger(),
                               "rejected for height %f not in range (%f, %f)\n",
                               point.z, min_height_, max_height_);
                  return;
                }
      explanation: Rejects invalid and out-of-height points before binning.
    - path: src/laser_scan_merger.cpp
      anchor: range < range_min_
      snippet: |2-
                double range = std::hypot(point.x, point.y);
                if (range < range_min_) {
                  RCLCPP_DEBUG(get_logger(),
                               "rejected for range %f below minimum value %f. Point: "
                               "(%f, %f, %f)",
                               range, range_min_, point.x, point.y, point.z);
                  return;
                }
                if (range > range_max_) {
                  RCLCPP_DEBUG(get_logger(),
                               "rejected for range %f above maximum value %f. Point: "
                               "(%f, %f, %f)",
                               range, range_max_, point.x, point.y, point.z);
                  return;
                }
      explanation: Rejects points outside the configured radial range.
    - path: src/laser_scan_merger.cpp
      anchor: angle < scan_msg->angle_min
      snippet: |2-
                double angle = std::atan2(point.y, point.x);
                if (angle < scan_msg->angle_min || angle > scan_msg->angle_max) {
                  RCLCPP_DEBUG(get_logger(),
                               "rejected for angle %f not in range (%f, %f)\n", angle,
                               scan_msg->angle_min, scan_msg->angle_max);
                  return;
                }
      explanation: Rejects points outside the configured output angular interval.
  - id: M-2-PC-4
    text: Each accepted point is assigned to its angular bin and replaces the bin only when it is nearer.
    evaluation: static
    reference_evidence:
    - path: src/laser_scan_merger.cpp
      anchor: overwrite range
      snippet: |2-
                // overwrite range at laserscan ray if new range is smaller
                int index = (angle - scan_msg->angle_min) / scan_msg->angle_increment;
                if (range < scan_msg->ranges[index]) {
                  scan_msg->ranges[index] = range;
                }
      explanation: Computes the angular index and preserves the nearest point for that output ray.
- id: M-3
  name: Transform acquisition and retry
  description: Required transforms are acquired before conversion, retried when unavailable, and either cached or refreshed according to moving_frames, satisfying FR-3.
  requirement_ids:
  - FR-3
  pass_criteria:
  - id: M-3-PC-1
    text: Transforms are acquired on the first callback and refreshed on every callback only when moving_frames is enabled.
    evaluation: static
    reference_evidence:
    - path: src/laser_scan_merger.cpp
      anchor: first_callback_ || moving_frames_
      snippet: |2-
          if (first_callback_ || moving_frames_) {
            // Clean list for retry
            transforms_.clear();
            try {
              std::for_each(indexes_.begin(), indexes_.end(), [&, this](auto& index) {
                if (buffer_->canTransform(
                        merged_frame_id_, msgs[index]->header.frame_id, rclcpp::Time(0),
                        rclcpp::Duration::from_nanoseconds(tolerance_))) {
                  transforms_.emplace_back(buffer_->lookupTransform(
                      merged_frame_id_, msgs[index]->header.frame_id, rclcpp::Time(0),
                      rclcpp::Duration::from_nanoseconds(tolerance_)));
                }
              });
      explanation: Uses the configured merged and input frames and tolerance, with cache refresh controlled by first_callback and moving_frames.
  - id: M-3-PC-2
    text: Missing or failing transforms cause the current callback to return so a later synchronized set can retry.
    evaluation: static
    reference_evidence:
    - path: src/laser_scan_merger.cpp
      anchor: transforms_.size
      snippet: |2-
            if (scan_topics_.size() == transforms_.size()) {
              first_callback_ = false;
            } else {
              return;  // Retry
            }
      explanation: Keeps the first-callback state active and returns until every input transform is available.
    - path: src/laser_scan_merger.cpp
      anchor: transformation scans
      snippet: |2-
          } catch (const tf2::TransformException& e) {
            RCLCPP_ERROR_STREAM(
                get_logger(),
                " (" << __func__
                     << ") caught tf2 transformException while transformation scans: "
                     << e.what());
            return;  // Retry
          }
      explanation: Logs transform failures and skips publication so processing can retry later.
