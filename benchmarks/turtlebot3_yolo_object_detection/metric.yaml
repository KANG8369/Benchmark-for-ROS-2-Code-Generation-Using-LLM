package_name: turtlebot3_yolo_object_detection

metrics:
- id: FR-1
  text: The node runs YOLO inference on each received raw camera image and publishes
    a JPEG-compressed image containing rendered detection annotations when image encoding
    succeeds.
  pass_criteria:
    - id: FR-1-PC-1
      text: >-
        Every received ROS image is converted and processed by the configured
        YOLO model.
    - id: FR-1-PC-2
      text: >-
        Detection results are rendered and JPEG-encoded before output
        publication.
    - id: FR-1-PC-3
      text: >-
        A CompressedImage containing JPEG bytes is published only when
        encoding succeeds.

- id: FR-2
  text: Each published annotated image retains the header from its source camera image.
  pass_criteria:
    - id: FR-2-PC-1
      text: >-
        Each published compressed image copies the source image header.

- id: FR-3
  text: The node logs an error and continues processing subsequent images if image
    conversion, inference, annotation, or output processing fails.
  pass_criteria:
    - id: FR-3-PC-1
      text: >-
        CvBridge conversion errors are caught and logged without terminating
        subsequent image processing.
    - id: FR-3-PC-2
      text: >-
        Other inference, annotation, and output-processing failures are caught
        and logged so later images can still be processed.

- id: FR-4
  text: The installed launch file starts the object-detection node with a user-selectable
    path to its YOLO model.
  pass_criteria:
    - id: FR-4-PC-1
      text: >-
        The launch declares a user-selectable model-path argument.
    - id: FR-4-PC-2
      text: >-
        The launched object-detection node receives the selected model path as
        a parameter and loads the model from it.
