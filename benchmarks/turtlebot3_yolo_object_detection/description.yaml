intent:
  package_name: turtlebot3_yolo_object_detection
  summary: Runs a configurable YOLO model on raw camera images and publishes JPEG-compressed
    images annotated with object-detection results.
  scope: Provides the object-detection node and annotated-image output; an external
    camera publisher supplies raw images and a YOLO model file is provided at the
    configured path.

functional_requirements:
  - id: FR-1
    text: >-
      The node runs YOLO inference on each received raw camera image and
      publishes a JPEG-compressed image containing rendered detection
      annotations when image encoding succeeds.

  - id: FR-2
    text: >-
      Each published annotated image retains the header from its source
      camera image.

  - id: FR-3
    text: >-
      The node logs an error and continues processing subsequent images if
      image conversion, inference, annotation, or output processing fails.

  - id: FR-4
    text: >-
      The installed launch file starts the object-detection node with a
      user-selectable path to its YOLO model.

target_environment: >-
  A TurtleBot3 mobile robot equipped with an RGB camera and a compatible YOLO model.
