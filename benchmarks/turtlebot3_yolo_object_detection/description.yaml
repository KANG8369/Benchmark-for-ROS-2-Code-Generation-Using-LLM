intent:
  package_name: turtlebot3_yolo_object_detection
  summary: Runs a configurable YOLO model on raw camera images and publishes JPEG-compressed
    images annotated with object-detection results.
  scope: Provides the object-detection node and annotated-image output; an external
    camera publisher supplies raw images and a YOLO model file is provided at the
    configured path.
functional_requirements:
- id: FR-1
  text: The node runs YOLO inference on each received raw camera image and publishes
    a JPEG-compressed image containing rendered detection annotations when image encoding
    succeeds.
- id: FR-2
  text: Each published annotated image retains the header from its source camera image.
- id: FR-3
  text: The node logs an error and continues processing subsequent images if image
    conversion, inference, annotation, or output processing fails.
- id: FR-4
  text: The installed launch file starts the object-detection node with a user-selectable
    path to its YOLO model.
interfaces:
  nodes:
  - name: turtlebot3_object_detection_node
    responsibility: Converts raw camera images for YOLO inference and publishes compressed
      images with rendered detection annotations.
    topics:
    - name: /camera/image_raw
      type: sensor_msgs/msg/Image
      direction: subscribe
      purpose: Raw camera images to analyze.
    - name: /camera/detections/compressed
      type: sensor_msgs/msg/CompressedImage
      direction: publish
      purpose: JPEG-compressed images annotated with object-detection results.
    parameters:
    - name: model_path
      type: string
      purpose: Filesystem path to the YOLO model loaded for inference.
  launch_arguments:
  - name: model_path
    purpose: Path to the YOLO model file passed to the object-detection node.
