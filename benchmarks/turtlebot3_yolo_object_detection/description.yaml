intent:
  package_name: turtlebot3_yolo_object_detection
  summary: Runs a configurable YOLO model on raw camera images and publishes JPEG-compressed
    images annotated with object-detection results.
  scope: Provides the object-detection node and annotated-image output; an external
    camera publisher supplies raw images and a YOLO model file is provided at the
    configured path.
