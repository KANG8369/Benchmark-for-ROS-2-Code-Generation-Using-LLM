- id: M-5
  name: Three managed navigation pipelines
  description: Launch creates and lifecycle-manages three controller and velocity-smoother pipelines as
    required by FR-5.
  requirement_ids:
  - FR-5
  pass_criteria:
  - id: M-5-PC-1
    text: Static inspection shows the launch iterates over three follower namespaces.
    evaluation: static
    reference_evidence:
    - kind: launch
      path: launch/turtlebot3_follower.launch.py
      locator: generate_launch_description
      snippet: |-
        def generate_launch_description():
            use_sim_time = LaunchConfiguration('use_sim_time', default='false')
            number_of_follower = 3
            follower = Node(
                package='turtlebot3_follower',
                executable='follower',
                output='screen',
                arguments=[str(number_of_follower)],
                parameters=[{'use_sim_time': use_sim_time}]
            )
            nodes = []
            nodes.append(follower)
            for i in range(number_of_follower):
                namespace = f'TB3_{i+2}'

                ctrl_yaml_path = os.path.join(
                    get_package_share_directory('turtlebot3_follower'),
                    'param',
                    f'controll_server{i+1}.yaml'
                )

                ctrl_node = Node(
                    package='nav2_controller',
                    executable='controller_server',
                    namespace=namespace,
                    name='controller_server',
                    output='screen',
                    parameters=[
                        ctrl_yaml_path,
                        {'use_sim_time': use_sim_time}],
                    remappings=[
                        (f'/{namespace}/cmd_vel', f'/{namespace}/cmd_vel_not_smoothed')]
                )

                lifecycle_node = Node(
