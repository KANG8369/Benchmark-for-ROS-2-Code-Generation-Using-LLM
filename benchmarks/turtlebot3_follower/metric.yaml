schema_version: '2.0'
package_name: turtlebot3_follower
reference:
  root: reference/
evaluation_policy:
  equivalence: semantic
  exact_constants_only_when_specified: true
metrics:
- id: M-1
  name: Indexed follower chain
  description: The requested number of follower nodes is paired into a predecessor chain as required by
    FR-1.
  requirement_ids:
  - FR-1
  pass_criteria:
  - id: M-1-PC-1
    text: Static inspection shows the executable accepts a requested follower count.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: src/follower.cpp
      locator: main
      snippet: |-
        int main(int argc, char * argv[])
        {
          rclcpp::init(argc, argv);

          int number = 0;
          if (argc > 1) {
            try {
              number = std::stoi(argv[1]);
            } catch (const std::exception & e) {
              std::cerr << "Invalid number of followers: " << argv[1] << std::endl;
              return 1;
            }
          }

          std::vector<std::shared_ptr<Follower>> followers;
          for (int i = 1; i <= number; ++i) {
            auto node = std::make_shared<Follower>(
              "TB3_" + std::to_string(i + 1),
              "TB3_" + std::to_string(i));
            followers.push_back(node);
          }

          rclcpp::executors::MultiThreadedExecutor executor;
          for (auto & node : followers) {
            executor.add_node(node);
          }

          executor.spin();
          rclcpp::shutdown();
          return 0;
        }
      explanation: Parses the requested count and constructs the indexed predecessor/follower node pairs.
