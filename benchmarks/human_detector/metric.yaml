schema_version: '2.0'
package_name: human_detector
reference:
  root: reference/
evaluation_policy:
  equivalence: semantic
  exact_constants_only_when_specified: true
metrics:
- id: M-1
  name: Lifecycle pose-detector configuration
  description: Lifecycle configuration creates the pose detector and synchronized camera inputs required
    by FR-1.
  requirement_ids:
  - FR-1
  pass_criteria:
  - id: M-1-PC-1
    text: Static inspection shows on_configure creates a pose-landmark detector and approximate synchronization
      for RGB image, aligned depth image, and camera calibration inputs.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: human_detector/human_detector.py
      locator: HumanDetector.on_configure
      snippet: |2-
            def on_configure(self, previous_state: LifecycleState):
                self.get_logger().info("IN on_configure")
                self.parameters = self.param_listener.get_params()
                self.log_parameters()
                self.time_approximation_slope = self.parameters.time_approximation_slope
                self.person_pose_estimator = mp.solutions.pose.Pose(
                    min_detection_confidence=self.parameters.min_detection_confidence,
                    min_tracking_confidence=self.parameters.min_tracking_confidence,
                )
                self.initialize_sync_subscribers()

                if self.parameters.publish_image_with_detected:
                    self.image_with_detected_human_pub = self.create_publisher(Image, "image_with_detected_human", 10)
                self.timer = self.create_timer(1 / self.parameters.detected_human_transform_frequency, self.timer_callback)
                self.timer.cancel()

                return TransitionCallbackReturn.SUCCESS
      explanation: Creates the MediaPipe pose detector and initializes synchronized camera subscribers.
    - kind: source_code
      path: human_detector/human_detector.py
      locator: HumanDetector.initialize_sync_subscribers
      snippet: |2-
            def initialize_sync_subscribers(self):
                sync_topics = [
                    Subscriber(
                        self,
                        Image,
                        "/camera/color/image_raw",
                        qos_profile=qos_profile_sensor_data,
                        qos_overriding_options=QoSOverridingOptions.with_default_policies(),
                    ),
                    Subscriber(
                        self,
                        Image,
                        "/camera/depth/image_rect_raw",
                        qos_profile=qos_profile_sensor_data,
                        qos_overriding_options=QoSOverridingOptions.with_default_policies(),
                    ),
                    Subscriber(
                        self,
                        CameraInfo,
                        "/camera/depth/camera_info",
                        qos_profile=qos_profile_sensor_data,
                        qos_overriding_options=QoSOverridingOptions.with_default_policies(),
                    ),
                ]

                self.image_approx_time_sync = ApproximateTimeSynchronizer(
                    sync_topics,
                    queue_size=5,
                    slop=self.time_approximation_slope,
                )
                self.image_approx_time_sync.registerCallback(self.on_image_data)
      explanation: Subscribes to RGB, depth, and CameraInfo and registers an approximate-time synchronized
        callback.
- id: M-2
  name: Landmark-based 3D position
  description: Human landmarks and calibrated depth are converted into a 3D position as required by FR-2.
  requirement_ids:
  - FR-2
  pass_criteria:
  - id: M-2-PC-1
    text: Static inspection shows the implementation derives a representative human image point from pose
      landmarks, reads the aligned depth at that point, and projects it with camera calibration to obtain
      a 3D position.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: human_detector/human_detector.py
      locator: HumanDetector.get_3d_human_position
      snippet: |2-
            def get_3d_human_position(self, x_pos_of_detected_person, y_pos_of_detected_person):
                if x_pos_of_detected_person <= 0 or y_pos_of_detected_person <= 0:
                    return

                depth_of_given_pixel = self.depth_image[y_pos_of_detected_person, x_pos_of_detected_person]
                ray = self.model.projectPixelTo3dRay((x_pos_of_detected_person, y_pos_of_detected_person))
                ray_3d = [ray_element / ray[2] for ray_element in ray]
                point_xyz = [ray_element * depth_of_given_pixel for ray_element in ray_3d]
                self.detected_human_position_world = {"x": mm_to_m(point_xyz[2]), "y": -mm_to_m(point_xyz[0])}
      explanation: Combines the selected depth pixel with the calibrated projection ray to compute 3D
        position.
    - kind: source_code
      path: human_detector/human_detector.py
      locator: HumanDetector.extract_hip_midpoint
      snippet: |2-
            def extract_hip_midpoint(self, left_hip_landmark, right_hip_landmark):
                height, width, _ = self.image.shape
                x = int(min((left_hip_landmark.x * width + right_hip_landmark.x * width) / 2, width - 1))
                y = int(min((left_hip_landmark.y * height + right_hip_landmark.y * height) / 2, height - 1))
                return x, y
      explanation: Derives the representative image point from detected pose landmarks.
- id: M-3
  name: Active-state human transform
  description: Active detection periodically produces the configured camera-to-human transform required
    by FR-3.
  requirement_ids:
  - FR-3
  pass_criteria:
  - id: M-3-PC-1
    text: Static inspection shows lifecycle activation enables periodic TF broadcasting, and the callback
      sends a transform from the configured camera frame to the configured human frame only when a valid
      positive 3D position is available.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: human_detector/human_detector.py
      locator: HumanDetector.on_activate
      snippet: |2-
            def on_activate(self, previous_state: LifecycleState):
                self.get_logger().info("IN on_activate")
                self.timer.reset()
                return super().on_activate(previous_state)
      explanation: Enables lifecycle resources used for periodic operation.
    - kind: source_code
      path: human_detector/human_detector.py
      locator: HumanDetector.timer_callback
      snippet: |2-
            def timer_callback(self):
                if self.detected_human_position_world["x"] > 0.0:
                    self.broadcast_timer_callback()
                self.publish_image_with_detected_human()
      explanation: Checks that the detected forward position is positive before requesting TF broadcast.
    - kind: source_code
      path: human_detector/human_detector.py
      locator: HumanDetector.broadcast_timer_callback
      snippet: |2-
            def broadcast_timer_callback(self):
                transform = TransformStamped()
                transform.header.stamp = self.image_time_stamp.to_msg()
                transform.header.frame_id = self.parameters.camera_frame_id
                transform.child_frame_id = self.parameters.detected_human_frame_id
                transform.transform.translation.x = self.detected_human_position_world["x"]
                transform.transform.translation.y = self.detected_human_position_world["y"]
                transform.transform.translation.z = 0.0
                transform.transform.rotation.x = 0.0
                transform.transform.rotation.y = 0.0
                transform.transform.rotation.z = 0.0
                transform.transform.rotation.w = 1.0
                self.tf_broadcaster.sendTransform(transform)
      explanation: Builds and sends the transform with the configured parent and child frame IDs.
- id: M-4
  name: Optional annotated image output
  description: Optional image publication follows the landmark and fallback behavior required by FR-4.
  requirement_ids:
  - FR-4
  pass_criteria:
  - id: M-4-PC-1
    text: Static inspection shows image publication is parameter-controlled, draws pose landmarks when
      available, and otherwise republishes the unannotated RGB image.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: human_detector/human_detector.py
      locator: HumanDetector.publish_image_with_detected_human
      snippet: |2-
            def publish_image_with_detected_human(self):
                if not self.parameters.publish_image_with_detected:
                    return

                if self.detected_landmarks is not None:
                    modified_image_msg = self.cv_bridge.cv2_to_imgmsg(self.draw_person_pose(self.image.copy()))
                    self.image_with_detected_human_pub.publish(modified_image_msg)
                elif self.image is not None:
                    image_msg = self.cv_bridge.cv2_to_imgmsg(self.image)
                    self.image_with_detected_human_pub.publish(image_msg)
      explanation: Selects annotated or original RGB output according to landmark availability.
    - kind: source_code
      path: human_detector/human_detector.py
      locator: HumanDetector.draw_person_pose
      snippet: |2-
            def draw_person_pose(self, image):
                mp_drawing = mp.solutions.drawing_utils
                mp_drawing.draw_landmarks(
                    image,
                    self.detected_landmarks,
                    mp.solutions.pose.POSE_CONNECTIONS,
                    mp.solutions.drawing_styles.get_default_pose_landmarks_style(),
                )
                return image
      explanation: Draws the detected pose landmarks on the image.
- id: M-5
  name: Invalid-input estimation guard
  description: Missing or dimensionally inconsistent image data does not trigger estimation, satisfying
    FR-5.
  requirement_ids:
  - FR-5
  pass_criteria:
  - id: M-5-PC-1
    text: Static inspection shows detection and 3D estimation are skipped when required RGB, depth, or
      calibration data is missing or when RGB and depth dimensions do not match.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: human_detector/human_detector.py
      locator: HumanDetector.should_detect_human
      snippet: |2-
            def should_detect_human(self):
                if self.camera_info is None or self.image is None or self.depth_image is None:
                    self.get_logger().error(
                        "No camera info or image or depth image are not stored. Human will not be detected."
                    )
                    return False

                if not self.are_rgb_image_same_size_as_depth_image():
                    self.get_logger().error(
                        "Dimensions of rgb image and depth image are not equal. Human will not be detected."
                    )
                    return False

                return True
      explanation: Guards processing against missing synchronized data and mismatched image dimensions.
    - kind: source_code
      path: human_detector/human_detector.py
      locator: HumanDetector.are_rgb_image_same_size_as_depth_image
      snippet: |2-
            def are_rgb_image_same_size_as_depth_image(self):
                rgb_image_height, rgb_image_width, _ = self.image.shape
                depth_image_height, depth_image_width = self.depth_image.shape

                return rgb_image_height == depth_image_height and rgb_image_width == depth_image_width
      explanation: Implements the RGB/depth size compatibility check.
- id: M-6
  name: Lifecycle timer cleanup
  description: Periodic detection work is stopped or destroyed across lifecycle exits as required by FR-6.
  requirement_ids:
  - FR-6
  pass_criteria:
  - id: M-6-PC-1
    text: Static inspection shows deactivation cancels the periodic timer and cleanup, shutdown, and error
      transitions destroy that timer.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: human_detector/human_detector.py
      locator: HumanDetector.on_deactivate
      snippet: |2-
            def on_deactivate(self, previous_state: LifecycleState):
                self.get_logger().info("IN on_deactivate")
                self.timer.cancel()
                return super().on_deactivate(previous_state)
      explanation: Stops active lifecycle processing.
    - kind: source_code
      path: human_detector/human_detector.py
      locator: HumanDetector.destroy_resources
      snippet: |2-
            def destroy_resources(self):
                self.destroy_timer(self.timer)
      explanation: Destroys the timer for cleanup, shutdown, and error paths.
