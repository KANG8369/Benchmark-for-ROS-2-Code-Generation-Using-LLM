package_name: human_detector

metrics:
- id: FR-1
  text: The lifecycle node configures a pose detector and synchronized RGB, depth,
    and camera-info inputs when it enters the configured state.
  pass_criteria:
    - id: FR-1-PC-1
      text: >-
        Lifecycle configuration creates the pose-landmark detector.
    - id: FR-1-PC-2
      text: >-
        RGB, aligned depth, and CameraInfo subscribers are initialized.
    - id: FR-1-PC-3
      text: >-
        RGB, aligned depth, and CameraInfo inputs are processed as synchronized
        sets.

- id: FR-2
  text: The node estimates a detected person's three-dimensional position from pose
    landmarks, depth pixels, and camera calibration when valid synchronized input
    data is available.
  pass_criteria:
    - id: FR-2-PC-1
      text: >-
        A representative human image point is derived from detected pose
        landmarks.
    - id: FR-2-PC-2
      text: >-
        Aligned depth is read at the selected human image point.
    - id: FR-2-PC-3
      text: >-
        The depth and calibrated projection ray are combined into a 3D
        position.

- id: FR-3
  text: While active, the node periodically broadcasts a transform from the configured
    camera frame to the configured detected-human frame when it has a positive detected
    position.
  pass_criteria:
    - id: FR-3-PC-1
      text: >-
        Lifecycle activation enables resources used for periodic transform
        publication.
    - id: FR-3-PC-2
      text: >-
        Transform publication is skipped unless a valid positive 3D position
        is available.
    - id: FR-3-PC-3
      text: >-
        Transforms use the configured camera frame and human frame.
    - id: FR-3-PC-4
      text: >-
        Valid human transforms are sent through the TF broadcaster.

- id: FR-4
  text: When enabled, the node publishes RGB images annotated with detected pose landmarks,
    or the received RGB image when no landmarks are available.
  pass_criteria:
    - id: FR-4-PC-1
      text: >-
        Annotated-image publication is controlled by the configured
        publication setting.
    - id: FR-4-PC-2
      text: >-
        Detected pose landmarks are drawn on the output image when
        available.
    - id: FR-4-PC-3
      text: >-
        The original RGB image is published when landmarks are unavailable.

- id: FR-5
  text: The node avoids human-position estimation when required image data is unavailable
    or RGB and depth image dimensions differ.
  pass_criteria:
    - id: FR-5-PC-1
      text: >-
        Detection is skipped when required RGB, depth, or CameraInfo data is
        missing.
    - id: FR-5-PC-2
      text: >-
        RGB and depth image dimensions are checked for compatibility.
    - id: FR-5-PC-3
      text: >-
        Mismatched RGB and depth dimensions prevent 3D estimation.

- id: FR-6
  text: The node stops its periodic output timer when deactivated and destroys it
    during cleanup, shutdown, or error handling.
  pass_criteria:
    - id: FR-6-PC-1
      text: >-
        Lifecycle deactivation cancels active periodic processing.
    - id: FR-6-PC-2
      text: >-
        Cleanup, shutdown, and error transitions destroy the periodic timer.
