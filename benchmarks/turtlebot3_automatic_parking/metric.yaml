- id: M-7
  name: LDS-02 startup rejection
  description: Startup rejects the unsupported LDS-02 model as required by FR-7.
  requirement_ids:
  - FR-7
  pass_criteria:
  - id: M-7-PC-1
    text: Static inspection shows node initialization reads LDS_MODEL and fails explicitly when its value
      identifies LDS-02.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: turtlebot3_automatic_parking/turtlebot3_automatic_parking.py
      locator: AutomaticParking.__init__
      snippet: |2-
            def __init__(self):
                super().__init__('automatic_parking')

                if os.environ['LDS_MODEL'] == 'LDS-02':
                    self.get_logger().error('LDS-02 is not supported')
                    sys.exit()

                # Set initial value
                self.scan = None
                self.odom = None
                self.search_count = 0
                self.euler = [0.0, 0.0, 0.0]
                self.center_angle = None
                self.start_angle = None
                self.end_angle = None
                self.start_point = [0.0, 0.0]
                self.end_point = [0.0, 0.0]
                self.center_point = [0.0, 0.0]
                self.rotation_point = [0.0, 0.0]
                self.parking_sequence = 0
                self.theta = 0.0
                self.is_scan_received = False
                self.is_odom_received = False
                self.init_yaw = 0.0
                # Set publisher
                self.cmd_vel_publisher = self.create_publisher(
                    Twist,
                    '/cmd_vel',
                    qos_profile=QoSProfile(depth=10))

                self.reset_publisher = self.create_publisher(
                    Empty,
                    '/reset',
                    qos_profile=QoSProfile(depth=10))

                self.scan_spot_publisher = self.create_publisher(
                    LaserScan,
                    '/scan_spot',
                    qos_profile=qos_profile_sensor_data)

                # Set subscriber
                self.scan_subscriber = self.create_subscription(
                    LaserScan,
                    '/scan',
                    self._scan_callback,
                    qos_profile=qos_profile_sensor_data)

                self.odom_subscriber = self.create_subscription(
                    Odometry,
                    '/odom',
                    self._odom_callback,
                    qos_profile=QoSProfile(depth=10))

                self._run_timer = self.create_timer(0.2, self._run)
      explanation: Checks LDS_MODEL during construction and rejects LDS-02.
