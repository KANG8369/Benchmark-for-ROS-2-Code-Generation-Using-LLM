- id: M-4
  name: Stop and odometry reset
  description: Defined reset points issue both a stop command and reset notification as required by FR-4.
  requirement_ids:
  - FR-4
  pass_criteria:
  - id: M-4-PC-1
    text: The shared reset operation publishes a zero linear and angular Twist.
    evaluation: static
    reference_evidence:
    - path: turtlebot3_automatic_parking/turtlebot3_automatic_parking.py
      anchor: _stop_and_reset
      snippet: |2-
            def _stop_and_reset(self):
                cmd_vel = Twist()
                reset = Empty()
                cmd_vel.linear.x = 0.0
                cmd_vel.angular.z = 0.0
                self.cmd_vel_publisher.publish(cmd_vel)
      explanation: The shared reset operation publishes a Twist with zero linear and angular velocity.
