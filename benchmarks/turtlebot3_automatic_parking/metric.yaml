- id: M-4
  name: Stop and odometry reset
  description: Defined reset points issue both a stop command and reset notification as required by FR-4.
  requirement_ids:
  - FR-4
  pass_criteria:
  - id: M-4-PC-1
    text: Static inspection shows reset points call a shared operation that publishes a zero Twist and
      a std_msgs/msg/Empty reset message.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: turtlebot3_automatic_parking/turtlebot3_automatic_parking.py
      locator: AutomaticParking._stop_and_reset
      snippet: |2-
            def _stop_and_reset(self):
                cmd_vel = Twist()
                reset = Empty()
                cmd_vel.linear.x = 0.0
                cmd_vel.angular.z = 0.0
                self.cmd_vel_publisher.publish(cmd_vel)
                time.sleep(1)
                self.reset_publisher.publish(reset)
                time.sleep(3)
      explanation: Publishes zero linear/angular velocity followed by the reset notification.
