package_name: turtlebot3_automatic_parking
metrics:
- id: DYN-01
  requirement: >-
    Republish each supported input scan on /scan_spot and mark the detected reflective spot's
    start, center and end. Compare marking indices with the known input interval using a
    one-bin tolerance; allow either central index for an even-width interval. Preserve the
    remaining scan content. Use a supported LDS-01 scan with a known reflective interval.
  evaluation_period: >-
    Observe each control for 30 seconds from valid scan/odometry delivery. Keep 7 wall-time
    seconds to first output and 1 second per response for measured no-spot input; allow
    10 seconds startup and 5 seconds response for reflective controls.
- id: DYN-02
  requirement: >-
    In the recorded ideal 2D fixture, rotate, position, reorient and reverse into the reflective
    spot. The whole footprint shall be inside the bay and remain stationary for 2 seconds,
    with ground-truth movement no more than 0.001 m and 0.001 rad. Require exact final zero
    commands, final reset and normal exit; no additional target heading is required.
  evaluation_period: >-
    All completion evidence, including the two-second stationary interval, must occur within
    120 wall-time seconds from valid input delivery. Use ideal 2D closed-loop motion starting
    at (0.15,0,0), with a wall at y=0.8 m, reflective segment x=-0.4..0.4 m, parking region
    x=-0.25..0.25 m and y=0.4..0.85 m. The robot's local footprint spans x=-0.11..0.05 m
    and y=-0.10..0.10 m. Reset changes odometry origin without moving ground truth. This
    is not a real-robot time limit.
- id: DYN-03
  requirement: >-
    Publish zero Twist and Empty reset requests at maneuver-frame establishment before positioning
    translation and at final parking stop. Allow different internal state sequences and
    extra resets. Each reset shall have a zero command within the preceding second, without
    an intervening nonzero command; resets must not teleport ground truth.
  evaluation_period: >-
    Observe these events throughout the same 120-second ideal parking trial. The final stop/reset
    pair may also serve as the parking completion evidence.
- id: DYN-04
  requirement: >-
    With consecutive no-spot scans, report unsuccessful searches and continue searching.
    Require the first report within 45 seconds and at least one later unsuccessful-search
    report by 60 seconds. Observe continued scan processing/searching; process survival
    alone is insufficient.
  evaluation_period: >-
    Observe 60 wall-time seconds from valid 10-Hz LDS-01 no-spot input and stationary odometry.
    Do not impose exact log wording or a fixed reporting period; other ordinary stream windows
    remain 30 seconds.
- id: DYN-05
  requirement: >-
    With LDS_MODEL=LDS-02, reject startup instead of entering the parking control sequence.
    Do not emit nonzero motion commands for the rejected configuration, and record the observed
    rejection/exit.
  evaluation_period: >-
    Allow 2 wall-time seconds from process invocation to unsupported-model rejection and
    exit. Verify dependencies and process invocation independently so a harness launch error
    is not counted as a successful rejection.
