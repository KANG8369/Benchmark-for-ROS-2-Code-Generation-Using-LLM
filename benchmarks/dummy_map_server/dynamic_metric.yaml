package_name: dummy_map_server
metrics:
- id: DYN-01
  requirement: >-
    Publish world-frame OccupancyGrid messages with fixed geometry, unknown background cells
    (-1), and a moving pattern of free (0) and occupied (100) cells. Initialization need
    not be a separate all-unknown message. Prepare observation before startup and verify
    movement across messages; no fixed map dimensions or movement speed are required.
  evaluation_period: >-
    Observe for 30 seconds from startup. Allow 7 seconds to the first map in the measured
    default configuration, otherwise 10 seconds. Use monotonic wall time; apply the timestamp
    rule in evaluation_protocol.yaml.
- id: DYN-02
  requirement: >-
    A compatible late subscriber shall receive the cached latest map. Identify that map
    using pre-subscription publication events and its header/content fingerprint. A newly
    published map alone is not evidence of retention. Apply the map_retention profile in
    docs/dynamic_metrics/evaluation_protocol.yaml.
  evaluation_period: >-
    During a 30-second run, allow 1 second from subscriber matching to identified cached-map
    delivery. If publication races obscure the observation, repeat fixture setup up to three
    times; ambiguous delivery is a test-invalid result, not a pass.
