package_name: image_proc
metrics:
- id: DYN-01
  requirement: >-
    With valid inputs and output subscribers, the launch shall load debayer and mono/color
    rectification components into the selected existing or new container and namespace.
    Verify supported encoding conversion and rejection of malformed or unsupported encodings.
    Test supported mono8, bgr8 and Bayer8 inputs where applicable, plus an explicitly invalid
    encoding. For lazy components, first observe processing with a subscriber; disconnect
    it, wait 5 seconds and verify no new processing calls or input subscriptions; reconnect
    and confirm processing resumes. An empty output topic alone is insufficient evidence
    of laziness.
  evaluation_period: >-
    Allow 30 wall-time seconds for full launch startup and 5 seconds per additional-path
    response. Observe each valid/invalid encoding and subscriber-present/absent condition
    for 30 seconds. If no subscription or processing-call observation is available, that
    test is invalid.
- id: DYN-02
  requirement: >-
    Exercise the candidate's installed public Processor and edge-aware utilities on supported
    mono, color and Bayer inputs, including optional pinhole rectification. Use constant-color
    and horizontal/vertical-edge images with an independently fixed, validated conversion
    oracle; do not substitute reference code for the candidate implementation.
  evaluation_period: >-
    Allow 5 wall-time seconds per call. For the fixed 8-bit control images, require maximum
    interior intensity error <=8 and MAE <=2 on a 0-255 scale, excluding only a declared
    one-pixel border. The oracle must pass its analytic controls before candidate scoring.
- id: DYN-03
  requirement: >-
    Produce rectified content from synchronized images and calibration, preserve zero-distortion
    pixels exactly, and suppress output without calibration. Use a 640x480 mono8 checkerboard
    with 24-pixel cells, fx=fy=500, cx=319.5, cy=239.5 and distortion coefficients [0.08,-0.02,0,0,0].
    Each output must satisfy maximum intensity error <=16 AND MAE <=0.01 in 0-255 units
    against the full-frame oracle. Verify lazy processing by observing input subscription
    or processing calls during connected, disconnected and reconnected intervals.
  evaluation_period: >-
    Observe each calibration-present, zero-distortion and missing-calibration condition
    for 30 seconds. For the measured Jazzy 5.0.13 standalone condition allow 7 wall-time
    seconds to first output, 1 second per matched input response and 2 seconds for cleanup.
    Allow 5 seconds for calibration recovery or subscriber transitions.
- id: DYN-04
  requirement: >-
    Crop/decimate and resize synchronized image/calibration pairs to the configured region
    and size, updating binning, ROI and calibration consistently. Use integer-offset, even-size
    crops and resize scales 0.5 and 2, with known pixel ramps. Integer binning, ROI and
    dimensions must match exactly; floating calibration allows absolute error 1e-6 plus
    relative 1e-5. Compare pixels to the configured nearest or linear sampler. Reject out-of-image
    regions and unsupported Bayer decimation; verify subscription-dependent processing.
  evaluation_period: >-
    Observe each transformation and invalid-input condition for 30 seconds, allowing 10
    wall-time seconds for standalone startup and 5 seconds per response or subscriber transition.
    For linear resize, map each output pixel center to (output+0.5)/scale-0.5 in the input
    image and allow one 8-bit intensity unit for rounding.
- id: DYN-05
  requirement: >-
    Publish the exact integer bounding crop of the largest nonzero region in a supported
    single-channel image, and skip all-zero or unsuitable input. Use separated 80x60 and
    20x20 filled rectangles with at least a 10-pixel gap; also test tied 40x40 rectangles,
    all-zero and unsuitable multi-channel input. Accept either tied largest rectangle and
    verify subscription-dependent processing.
  evaluation_period: >-
    Observe each control for 30 seconds after input delivery, with 10 wall-time seconds
    for startup and 5 seconds per response or subscriber transition.
- id: DYN-06
  requirement: >-
    Detect the configured ArUco marker in the fixed calibrated positive-control scene and
    publish its camera-to-marker pose. Require translation error <=max(0.01 m, 5 percent
    of ground-truth range) and rotation error <=5 degrees, with correct frame convention
    and finite normalized rotation. Use a centered frontal marker 7 with a 200-pixel side
    in a 640x480 image, known camera intrinsics and marker size 0.04 m. Configure the tracker
    for DICT_5X5_250 and that ID. Missing detections cannot pass accuracy. Verify subscription-dependent
    processing.
  evaluation_period: >-
    Observe for 30 seconds from calibrated input delivery, allowing 10 wall-time seconds
    for startup and 5 seconds per response. Derive the camera-to-marker truth from the fixed
    rendered corners and calibration; treat quaternion signs q and -q as equivalent.
- id: DYN-07
  requirement: >-
    The public QoS utility shall select a sensor-data profile when no publisher is known
    and otherwise choose reliability/durability compatible with an existing publisher. Exercise
    reliable/best-effort and volatile/transient-local external publisher controls and demonstrate
    message delivery; do not rely on configuration strings alone.
  evaluation_period: >-
    Allow 5 wall-time seconds for endpoint discovery and 5 seconds per utility invocation,
    followed by 30 seconds of message delivery for each publisher-present condition.
