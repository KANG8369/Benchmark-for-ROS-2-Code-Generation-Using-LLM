  - id: M-2-PC-4
    text: Static inspection shows a requested color output product is constructed.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: src/image_proc/processor.cpp
      locator: cv::cvtColor(raw, output.color
      snippet: |2-
            cv::cvtColor(raw, output.color, code);
