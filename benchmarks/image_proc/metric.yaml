schema_version: '2.0'
package_name: image_proc
reference:
  root: reference/
evaluation_policy:
  equivalence: semantic
  exact_constants_only_when_specified: true
metrics:
- id: M-1
  name: Configurable composable image pipeline
  description: The launch description loads debayer and mono/color rectification components as required
    by FR-1.
  requirement_ids:
  - FR-1
  pass_criteria:
  - id: M-1-PC-1
    text: Static inspection shows the launch description accepts a configurable namespace input.
    evaluation: static
    reference_evidence:
    - kind: launch
      path: launch/image_proc.launch.py
      locator: arg_namespace
      snippet: |2-
            arg_namespace = DeclareLaunchArgument(
                name='namespace', default_value='',
                description=('namespace for all components loaded')
            )
      explanation: Declares the namespace launch input and its default value.
  - id: M-1-PC-2
    text: Static inspection shows the launch description accepts a configurable component-container input.
    evaluation: static
    reference_evidence:
    - kind: launch
      path: launch/image_proc.launch.py
      locator: arg_container
      snippet: |2-
            arg_container = DeclareLaunchArgument(
                name='container', default_value='',
                description=(
                    'Name of an existing node container to load launched nodes into. '
                    'If unset, a new container will be created.'
                )
            )
      explanation: Declares the component-container launch input and its default value.
  - id: M-1-PC-3
    text: Static inspection shows debayer, mono rectify, and color rectify composable nodes are defined.
    evaluation: static
    reference_evidence:
    - kind: launch
      path: launch/image_proc.launch.py
      locator: image_proc::DebayerNode
      snippet: |2-
                ComposableNode(
                    package='image_proc',
                    plugin='image_proc::DebayerNode',
                    name='debayer_node',
                    namespace=LaunchConfiguration('namespace'),
                ),
      explanation: Defines the Debayer composable node.
    - kind: launch
      path: launch/image_proc.launch.py
      locator: rectify_mono_node
      snippet: |2-
                ComposableNode(
                    package='image_proc',
                    plugin='image_proc::RectifyNode',
                    name='rectify_mono_node',
                    namespace=LaunchConfiguration('namespace'),
                    # Remap subscribers and publishers
                    remappings=[
                        ('image', 'image_mono'),
                        ('image_rect', 'image_rect')
                    ],
                ),
      explanation: Defines the mono Rectify composable node and its remappings.
    - kind: launch
      path: launch/image_proc.launch.py
      locator: rectify_color_node
      snippet: |2-
                ComposableNode(
                    package='image_proc',
                    plugin='image_proc::RectifyNode',
                    name='rectify_color_node',
                    namespace=LaunchConfiguration('namespace'),
                    # Remap subscribers and publishers
                    remappings=[
                        ('image', 'image_color'),
                        ('image_rect', 'image_rect_color')
                    ],
                )
      explanation: Defines the color Rectify composable node and its remappings.
  - id: M-1-PC-4
    text: Static inspection shows the components can be started in a new component container.
    evaluation: static
    reference_evidence:
    - kind: launch
      path: launch/image_proc.launch.py
      locator: image_processing_container
      snippet: |2-
            # If an existing container is not provided, start a container and load nodes into it
            image_processing_container = ComposableNodeContainer(
                condition=LaunchConfigurationEquals('container', ''),
                name='image_proc_container',
                namespace=LaunchConfiguration('namespace'),
                package='rclcpp_components',
                executable='component_container',
                composable_node_descriptions=composable_nodes,
                output='screen'
            )
      explanation: Starts the three components in a newly created component container.
  - id: M-1-PC-5
    text: Static inspection shows the components can instead be loaded into an existing container.
    evaluation: static
    reference_evidence:
    - kind: launch
      path: launch/image_proc.launch.py
      locator: load_composable_nodes
      snippet: |2-
            # If an existing container name is provided, load composable nodes into it
            # This will block until a container with the provided name is available and nodes are loaded
            load_composable_nodes = LoadComposableNodes(
                condition=LaunchConfigurationNotEquals('container', ''),
                composable_node_descriptions=composable_nodes,
                target_container=LaunchConfiguration('container'),
            )
      explanation: Loads the same components into the container selected by the launch input.
  - id: M-1-PC-6
    text: Static inspection shows the launch directory is installed into the package share directory.
    evaluation: static
    reference_evidence:
    - kind: build
      path: CMakeLists.txt
      locator: ament_auto_package
      snippet: |-
        ament_auto_package(INSTALL_TO_SHARE launch)
      explanation: Installs the launch directory into the package share through ament_auto_package.
- id: M-2
  name: Public raw-image processor
  description: The public Processor API performs the requested mono/color conversion and optional rectification
    required by FR-2.
  requirement_ids:
  - FR-2
  pass_criteria:
  - id: M-2-PC-1
    text: Static inspection shows a public Processor API exposes processing flags, output storage, and
      a process operation.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: include/image_proc/processor.hpp
      locator: ImageSet
      snippet: |-
        struct ImageSet
        {
          std::string color_encoding;
          cv::Mat mono;
          cv::Mat rect;
          cv::Mat color;
          cv::Mat rect_color;
        };
      explanation: Exposes the output image storage used by the processing API.
    - kind: source_code
      path: include/image_proc/processor.hpp
      locator: process(
      snippet: |2-
          enum
          {
            MONO       = 1 << 0,
            RECT       = 1 << 1,
            COLOR      = 1 << 2,
            RECT_COLOR = 1 << 3,
            ALL = MONO | RECT | COLOR | RECT_COLOR
          };

          [[nodiscard]] bool process(
            const sensor_msgs::msg::Image::ConstSharedPtr & raw_image,
            const image_geometry::PinholeCameraModel & model,
            ImageSet & output, int flags = ALL) const;
      explanation: Exposes processing flags and the public process operation.
  - id: M-2-PC-2
    text: Static inspection shows supported mono, color, and Bayer raw encodings are accepted.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: src/image_proc/processor.cpp
      locator: raw_encoding
      snippet: |2-
          // Check if raw_image is color
          const std::string & raw_encoding = raw_image->encoding;
          int raw_type = CV_8UC1;
          if (raw_encoding == sensor_msgs::image_encodings::BGR8 ||
            raw_encoding == sensor_msgs::image_encodings::RGB8)
          {
            raw_type = CV_8UC3;
            output.color_encoding = raw_encoding;
          }
      explanation: Recognizes supported BGR and RGB color encodings.
    - kind: source_code
      path: src/image_proc/processor.cpp
      locator: BAYER_RGGB8
      snippet: |2-
          // Bayer case
          if (raw_encoding.find("bayer") != std::string::npos) {
            // Convert to color BGR
            // TODO(unknown): Faster to convert directly to mono when color is not requested,
            //                but OpenCV doesn't support
            int code = 0;
            if (raw_encoding == sensor_msgs::image_encodings::BAYER_RGGB8) {
              code = cv::COLOR_BayerBG2BGR;
            } else if (raw_encoding == sensor_msgs::image_encodings::BAYER_BGGR8) {
              code = cv::COLOR_BayerRG2BGR;
            } else if (raw_encoding == sensor_msgs::image_encodings::BAYER_GBRG8) {
              code = cv::COLOR_BayerGR2BGR;
            } else if (raw_encoding == sensor_msgs::image_encodings::BAYER_GRBG8) {
              code = cv::COLOR_BayerGB2BGR;
            } else {
              RCUTILS_LOG_ERROR("[image_proc] Unsupported encoding '%s'", raw_encoding.c_str());
              return false;
            }
            cv::cvtColor(raw, output.color, code);
      explanation: Maps the supported Bayer encodings to OpenCV conversion codes.
    - kind: source_code
      path: src/image_proc/processor.cpp
      locator: MONO8
      snippet: |2-
          } else if (raw_encoding == sensor_msgs::image_encodings::MONO8) {  // Mono case
            output.mono = raw;
            if (flags & COLOR_EITHER) {
              output.color_encoding = sensor_msgs::image_encodings::MONO8;
              output.color = raw;
            }
      explanation: Handles supported mono input and can derive a color output.
  - id: M-2-PC-3
    text: Static inspection shows a requested mono output product is constructed.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: src/image_proc/processor.cpp
      locator: cv::COLOR_BGR2GRAY
