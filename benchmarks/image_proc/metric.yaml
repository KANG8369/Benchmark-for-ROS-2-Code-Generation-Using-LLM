  - id: M-10-PC-3
    text: Static inspection shows the configured ArUco marker is detected and its calibrated pose is estimated.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: src/track_marker.cpp
      locator: image_proc::TrackMarkerNode::imageCb
      snippet: |-
        void TrackMarkerNode::imageCb(
          const sensor_msgs::msg::Image::ConstSharedPtr & image_msg,
          const sensor_msgs::msg::CameraInfo::ConstSharedPtr & info_msg)
        {
          cv_bridge::CvImageConstPtr cv_ptr;
          try {
            cv_ptr = cv_bridge::toCvShare(image_msg);
          } catch (cv_bridge::Exception & e) {
            RCLCPP_ERROR(this->get_logger(), "cv_bridge exception: %s", e.what());
            return;
          }

          std::vector<int> marker_ids;
          std::vector<std::vector<cv::Point2f>> marker_corners;
          cv::aruco::detectMarkers(cv_ptr->image, dictionary_, marker_corners, marker_ids);

          for (size_t i = 0; i < marker_ids.size(); ++i) {
            if (marker_ids[i] == marker_id_) {
              // This is our desired marker
              std::vector<std::vector<cv::Point2f>> corners;
              corners.push_back(marker_corners[i]);

              // Copy the matrices since they are const and OpenCV functions are not
              auto k = info_msg->k;
              auto d = info_msg->d;

              // Get the camera info
              cv::Mat intrinsics(3, 3, CV_64FC1, reinterpret_cast<void *>(k.data()));
              cv::Mat dist_coeffs(info_msg->d.size(), 1, CV_64FC1, reinterpret_cast<void *>(d.data()));

              // Estimate pose
              std::vector<cv::Vec3d> rvecs, tvecs;
              cv::aruco::estimatePoseSingleMarkers(
                corners, marker_size_, intrinsics, dist_coeffs, rvecs, tvecs);

              // Publish pose of marker
              geometry_msgs::msg::PoseStamped pose;
              pose.header = image_msg->header;
              // Fill in pose
              pose.pose.position.x = tvecs[0][0];
              pose.pose.position.y = tvecs[0][1];
              pose.pose.position.z = tvecs[0][2];
              // Convert angle-axis to quaternion
              const tf2::Vector3 rvec(rvecs[0][0], rvecs[0][1], rvecs[0][2]);
              const tf2::Quaternion q(rvec.normalized(), rvec.length());
              tf2::convert(q, pose.pose.orientation);
              pub_->publish(pose);
            }
          }
        }
      explanation: Detects configured marker IDs, estimates pose from camera calibration and marker size,
        and publishes the pose.
  - id: M-10-PC-4
    text: Static inspection shows the estimated marker pose is published as geometry_msgs/msg/PoseStamped.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: src/track_marker.cpp
      locator: image_proc::TrackMarkerNode::imageCb
      snippet: |-
        void TrackMarkerNode::imageCb(
          const sensor_msgs::msg::Image::ConstSharedPtr & image_msg,
          const sensor_msgs::msg::CameraInfo::ConstSharedPtr & info_msg)
        {
          cv_bridge::CvImageConstPtr cv_ptr;
          try {
            cv_ptr = cv_bridge::toCvShare(image_msg);
          } catch (cv_bridge::Exception & e) {
            RCLCPP_ERROR(this->get_logger(), "cv_bridge exception: %s", e.what());
            return;
          }

          std::vector<int> marker_ids;
          std::vector<std::vector<cv::Point2f>> marker_corners;
          cv::aruco::detectMarkers(cv_ptr->image, dictionary_, marker_corners, marker_ids);

          for (size_t i = 0; i < marker_ids.size(); ++i) {
            if (marker_ids[i] == marker_id_) {
              // This is our desired marker
              std::vector<std::vector<cv::Point2f>> corners;
              corners.push_back(marker_corners[i]);

              // Copy the matrices since they are const and OpenCV functions are not
              auto k = info_msg->k;
              auto d = info_msg->d;

              // Get the camera info
              cv::Mat intrinsics(3, 3, CV_64FC1, reinterpret_cast<void *>(k.data()));
              cv::Mat dist_coeffs(info_msg->d.size(), 1, CV_64FC1, reinterpret_cast<void *>(d.data()));

              // Estimate pose
              std::vector<cv::Vec3d> rvecs, tvecs;
              cv::aruco::estimatePoseSingleMarkers(
                corners, marker_size_, intrinsics, dist_coeffs, rvecs, tvecs);

              // Publish pose of marker
              geometry_msgs::msg::PoseStamped pose;
              pose.header = image_msg->header;
              // Fill in pose
              pose.pose.position.x = tvecs[0][0];
              pose.pose.position.y = tvecs[0][1];
              pose.pose.position.z = tvecs[0][2];
              // Convert angle-axis to quaternion
              const tf2::Vector3 rvec(rvecs[0][0], rvecs[0][1], rvecs[0][2]);
              const tf2::Quaternion q(rvec.normalized(), rvec.length());
              tf2::convert(q, pose.pose.orientation);
              pub_->publish(pose);
            }
          }
        }
      explanation: Detects configured marker IDs, estimates pose from camera calibration and marker size,
        and publishes the pose.
