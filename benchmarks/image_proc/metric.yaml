  - id: M-2-PC-5
    text: Static inspection shows requested output products can be rectified using camera calibration.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: src/image_proc/processor.cpp
      locator: rectifyImage
      snippet: |2-
