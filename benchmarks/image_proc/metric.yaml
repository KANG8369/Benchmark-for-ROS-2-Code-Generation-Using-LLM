      explanation: Constructs color output from Bayer input when requested.
    - kind: source_code
      path: src/image_proc/processor.cpp
      locator: output.color = raw
      snippet: |2-
          } else if (raw_type == CV_8UC3) {  // Color case
            output.color = raw;
