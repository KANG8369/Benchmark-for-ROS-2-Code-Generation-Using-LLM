  name: Edge-aware debayer utilities
  description: Both edge-aware debayer variants required by FR-3 are available.
  requirement_ids:
  - FR-3
  pass_criteria:
  - id: M-3-PC-1
    text: Static inspection shows a public edge-aware Bayer demosaicing utility is declared and implemented.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: include/image_proc/edge_aware.hpp
      locator: debayerEdgeAware
      snippet: |-
        void debayerEdgeAware(const cv::Mat & bayer, cv::Mat & color);
      explanation: Publicly declares the edge-aware Bayer demosaicing utility.
    - kind: source_code
      path: src/edge_aware.cpp
      locator: debayerEdgeAware(
      snippet: |-
        void debayerEdgeAware(const cv::Mat & bayer, cv::Mat & color)
        {
          unsigned width = bayer.cols;
          unsigned height = bayer.rows;
          unsigned rgb_line_step = color.step[0];
          unsigned rgb_line_skip = rgb_line_step - width * 3;
          int bayer_line_step = bayer.step[0];
          int bayer_line_step2 = bayer_line_step * 2;

          unsigned char * rgb_buffer = color.data;
          unsigned char * bayer_pixel = bayer.data;
          unsigned yIdx, xIdx;

          int dh, dv;
      explanation: Implements the declared edge-aware utility and validates its image inputs.
    - kind: source_code
      path: src/edge_aware.cpp
      locator: dh > dv
      snippet: |2-
              dh = std::abs(bayer_pixel[0] - bayer_pixel[2]);
              dv = std::abs(bayer_pixel[-bayer_line_step + 1] - bayer_pixel[bayer_line_step + 1]);

              if (dh > dv) {
                rgb_buffer[4] = avg(bayer_pixel[-bayer_line_step + 1], bayer_pixel[bayer_line_step + 1]);
              } else if (dv > dh) {
                rgb_buffer[4] = avg(bayer_pixel[0], bayer_pixel[2]);
              } else {
                rgb_buffer[4] = avg4(
                  bayer_pixel[-bayer_line_step + 1], bayer_pixel[bayer_line_step + 1],
                  bayer_pixel[0], bayer_pixel[2]);
      explanation: Implements edge-direction-dependent green-channel interpolation.
  - id: M-3-PC-2
    text: Static inspection shows a public weighted edge-aware Bayer demosaicing utility is declared and
      implemented.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: include/image_proc/edge_aware.hpp
      locator: debayerEdgeAwareWeighted
      snippet: |-
        void debayerEdgeAwareWeighted(const cv::Mat & bayer, cv::Mat & color);
      explanation: Publicly declares the weighted edge-aware Bayer demosaicing utility.
    - kind: source_code
      path: src/edge_aware.cpp
      locator: debayerEdgeAwareWeighted(
      snippet: |-
        void debayerEdgeAwareWeighted(const cv::Mat & bayer, cv::Mat & color)
        {
          unsigned width = bayer.cols;
          unsigned height = bayer.rows;
          unsigned rgb_line_step = color.step[0];
          unsigned rgb_line_skip = rgb_line_step - width * 3;
          int bayer_line_step = bayer.step[0];
          int bayer_line_step2 = bayer_line_step * 2;

          unsigned char * rgb_buffer = color.data;
          unsigned char * bayer_pixel = bayer.data;
          unsigned yIdx, xIdx;

          int dh, dv;
      explanation: Implements the declared weighted utility and validates its image inputs.
    - kind: source_code
      path: src/edge_aware.cpp
      locator: wavg4
      snippet: |2-
              dh = std::abs(bayer_pixel[0] - bayer_pixel[2]);
              dv = std::abs(bayer_pixel[-bayer_line_step + 1] - bayer_pixel[bayer_line_step + 1]);

              if (dv == 0 && dh == 0) {
                rgb_buffer[4] = avg4(
                  bayer_pixel[1 - bayer_line_step], bayer_pixel[1 + bayer_line_step],
                  bayer_pixel[0], bayer_pixel[2]);
              } else {
                rgb_buffer[4] = wavg4(
                  bayer_pixel[1 - bayer_line_step], bayer_pixel[1 + bayer_line_step],
                  bayer_pixel[0], bayer_pixel[2], dh, dv);
              }
      explanation: Computes weighted green-channel interpolation from horizontal and vertical gradients.
