- id: M-11
  name: Source-selective debounced triggering
  description: Zone evaluation uses selected source points, a minimum count, and independent trigger and release debounce.
  requirement_ids:
  - FR-11
  pass_criteria:
  - id: M-11-PC-1
    text: Point containment is accumulated only from the source names selected for the zone.
    evaluation: static
    reference_evidence:
    - path: src/polygon.cpp
      anchor: polygon_sources_names = getSourcesNames()
      snippet: |2-
        int Polygon::getPointsInside(
          const std::unordered_map<std::string, std::vector<Point>> & sources_collision_points_map,
          std::vector<Point> & out_triggering_points) const
        {
          int num = 0;
          std::vector<std::string> polygon_sources_names = getSourcesNames();

          // Sum the number of points from all sources associated with current polygon
          for (const auto & source_name : polygon_sources_names) {
            const auto & iter = sources_collision_points_map.find(source_name);
            if (iter != sources_collision_points_map.end()) {
              num += getPointsInside(iter->second, out_triggering_points);
            }
          }

          return num;
        }
      explanation: Restricts point counting to the configured source subset.
  - id: M-11-PC-2
    text: Triggering compares the selected point count to min_points and maintains independent consecutive hit and release counters.
    evaluation: static
    reference_evidence:
    - path: src/polygon.cpp
      anchor: bool Polygon::isTriggeredInternal
      snippet: |2-
        bool Polygon::isTriggeredInternal(int points_inside)
        {
          const bool hit_now = points_inside >= min_points_;

          if (trigger_consecutive_points_ == 1 && release_consecutive_points_ == 1) {
            trigger_active_ = hit_now;
            return trigger_active_;
          }

          if (hit_now) {
            trigger_hits_ += 1;
            release_hits_ = 0;
            if (trigger_hits_ >= trigger_consecutive_points_) {
              trigger_active_ = true;
            }
          } else {
            release_hits_ += 1;
            trigger_hits_ = 0;
            if (release_hits_ >= release_consecutive_points_) {
              trigger_active_ = false;
            }
          }

          return trigger_active_;
        }
      explanation: Implements minimum-point thresholding with asymmetric entry and release debounce.
