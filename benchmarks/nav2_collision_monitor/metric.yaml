package_name: nav2_collision_monitor
reference:
  root: reference/
metrics:
- id: M-1
  name: Most-restrictive velocity filtering
  description: The monitor evaluates enabled zone actions and publishes the safest resulting velocity.
  requirement_ids:
  - FR-1
  pass_criteria:
  - id: M-1-PC-1
    text: Each processing cycle starts with the requested velocity unchanged and dispatches every enabled zone to its configured action processor until a stop is selected.
    evaluation: static
    reference_evidence:
    - path: src/collision_monitor_node.cpp
      anchor: Action robot_action{DO_NOTHING, cmd_vel_in
      snippet: |2-
          // By default - there is no action
          Action robot_action{DO_NOTHING, cmd_vel_in, "", std::vector<Point>()};
          // Polygon causing robot action (if any)
          std::shared_ptr<Polygon> action_polygon;
      explanation: Initializes the result as pass-through requested velocity.
    - path: src/collision_monitor_node.cpp
      anchor: if (at == STOP || at == SLOWDOWN || at == LIMIT)
      snippet: |2-
          for (std::shared_ptr<Polygon> polygon : polygons_) {
            if (!polygon->getEnabled() || !enabled_) {
              continue;
            }
            if (robot_action.action_type == STOP) {
              // If robot already should stop, do nothing
              break;
            }

            // Update polygon coordinates
            polygon->updatePolygon(cmd_vel_in);

            const ActionType at = polygon->getActionType();
            if (at == STOP || at == SLOWDOWN || at == LIMIT) {
              // Process STOP/SLOWDOWN for the selected polygon
              if (processStopSlowdownLimit(
                  polygon, sources_collision_points_map, cmd_vel_in, robot_action))
              {
                action_polygon = polygon;
              }
            } else if (at == APPROACH) {
              // Process APPROACH for the selected polygon
              if (processApproach(polygon, sources_collision_points_map, cmd_vel_in, robot_action)) {
                action_polygon = polygon;
              }
            }
          }
      explanation: Dispatches every enabled zone and stops searching once the already selected result is STOP.
  - id: M-1-PC-2
    text: A triggered stop zone zeros all planar velocity components, while slowdown replaces the result only with a safer ratio-scaled velocity.
    evaluation: static
    reference_evidence:
    - path: src/collision_monitor_node.cpp
      anchor: robot_action.action_type = STOP;
      snippet: |2-
          if (polygon->isTriggered(sources_collision_points_map, triggering_points)) {
            if (polygon->getActionType() == STOP) {
              // Setting up zero velocity for STOP model
              robot_action.polygon_name = polygon->getName();
              robot_action.action_type = STOP;
              robot_action.req_vel.x = 0.0;
              robot_action.req_vel.y = 0.0;
              robot_action.req_vel.tw = 0.0;
              robot_action.triggering_points = std::move(triggering_points);
              return true;
            } else if (polygon->getActionType() == SLOWDOWN) {
              const Velocity safe_vel = velocity * polygon->getSlowdownRatio();
              // Check that currently calculated velocity is safer than
              // chosen for previous shapes one
              if (safe_vel < robot_action.req_vel) {
                robot_action.polygon_name = polygon->getName();
                robot_action.action_type = SLOWDOWN;
                robot_action.req_vel = safe_vel;
                robot_action.triggering_points = std::move(triggering_points);
                return true;
              }
      explanation: Implements stop and safer-only slowdown selection with all components preserved or zeroed together.
  - id: M-1-PC-3
    text: A limit zone computes the most restrictive clamped linear or angular ratio and never replaces an already safer result.
    evaluation: static
    reference_evidence:
    - path: src/collision_monitor_node.cpp
      anchor: ratio = std::clamp(ratio, 0.0, 1.0);
      snippet: |2-
              // Calculate the most restrictive ratio to preserve curvature
              if (linear_vel != 0.0) {
                ratio = std::min(ratio, polygon->getLinearLimit() / linear_vel);
              }
              if (velocity.tw != 0.0) {
                ratio = std::min(ratio, polygon->getAngularLimit() / std::abs(velocity.tw));
              }
              ratio = std::clamp(ratio, 0.0, 1.0);
              // Apply the same ratio to all components to preserve curvature
              safe_vel = velocity * ratio;
              // Check that currently calculated velocity is safer than
              // chosen for previous shapes one
              if (safe_vel < robot_action.req_vel) {
                robot_action.polygon_name = polygon->getName();
                robot_action.action_type = LIMIT;
                robot_action.req_vel = safe_vel;
                robot_action.triggering_points = std::move(triggering_points);
                return true;
              }
      explanation: Preserves curvature while applying the strictest configured speed bound.
  - id: M-1-PC-4
    text: An approach zone scales velocity by projected collision time when that result is safer than the current selection.
    evaluation: static
    reference_evidence:
    - path: src/collision_monitor_node.cpp
      anchor: collision_time / polygon->getTimeBeforeCollision()
      snippet: |2-
          // Obtain time before a collision, capturing the responsible points at the collision step.
          std::vector<Point> triggering_points;
          const double collision_time = polygon->getCollisionTime(sources_collision_points_map, velocity,
              triggering_points);
          if (collision_time >= 0.0) {
            // If collision will occur, reduce robot speed
            const double change_ratio = collision_time / polygon->getTimeBeforeCollision();
            const Velocity safe_vel = velocity * change_ratio;
            // Check that currently calculated velocity is safer than
            // chosen for previous shapes one
            if (safe_vel < robot_action.req_vel) {
              robot_action.polygon_name = polygon->getName();
              robot_action.action_type = APPROACH;
              robot_action.req_vel = safe_vel;
              robot_action.triggering_points = std::move(triggering_points);
              return true;
            }
          }
      explanation: Converts projected time to collision into a safer velocity scale.
