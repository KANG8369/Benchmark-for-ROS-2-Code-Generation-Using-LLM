- id: M-18
  name: Planar collision-projection utilities
  description: Public utilities inverse-transform points and project planar state over a time step.
  requirement_ids:
  - FR-18
  pass_criteria:
  - id: M-18-PC-1
    text: transformPoints inverse-transforms every point by the supplied projected planar pose.
    evaluation: static
    reference_evidence:
    - path: src/kinematics.cpp
      anchor: void transformPoints
      snippet: |2-
        void transformPoints(const Pose & pose, std::vector<Point> & points)
        {
          const double cos_theta = std::cos(pose.theta);
          const double sin_theta = std::sin(pose.theta);

          for (Point & point : points) {
            // p = R*p' + pose
            // p' = Rt * (p - pose)
            // where:
            //   p - point coordinates in initial frame
            //   p' - point coordinates in a new frame
            //   R - rotation matrix =
            //     [cos_theta -sin_theta]
            //     [sin_theta  cos_theta]
            //   Rt - transposed (inverted) rotation matrix
            const double mul_x = point.x - pose.x;
            const double mul_y = point.y - pose.y;
            point.x = mul_x * cos_theta + mul_y * sin_theta;
            point.y = -mul_x * sin_theta + mul_y * cos_theta;
          }
        }
      explanation: Converts obstacle points into the frame attached to a projected robot pose.
  - id: M-18-PC-2
    text: projectState advances pose by planar velocity and rotates both pose heading and velocity through the angular time step.
    evaluation: static
    reference_evidence:
    - path: src/kinematics.cpp
      anchor: void projectState
      snippet: |2-
        void projectState(const double & dt, Pose & pose, Velocity & velocity)
        {
          const double theta = velocity.tw * dt;
          const double cos_theta = std::cos(theta);
          const double sin_theta = std::sin(theta);

          // p' = p + vel*dt
          // where:
          //   p - initial pose
          //   p' - projected pose
          pose.x = pose.x + velocity.x * dt;
          pose.y = pose.y + velocity.y * dt;
          // Rotate the pose on theta
          pose.theta = pose.theta + theta;

          // vel' = R*vel
          // where:
          //   vel - initial velocity
          //   R - rotation matrix
          //   vel' - rotated velocity
          const double velocity_upd_x = velocity.x * cos_theta - velocity.y * sin_theta;
          const double velocity_upd_y = velocity.x * sin_theta + velocity.y * cos_theta;
          velocity.x = velocity_upd_x;
          velocity.y = velocity_upd_y;
        }
      explanation: Advances and rotates planar state for approach collision simulation.
