- id: M-3
  name: Bounded repeated stop publication
  description: Repeated zero-velocity publication ends after the configured stopped interval.
  requirement_ids:
  - FR-3
  pass_criteria:
  - id: M-3-PC-1
    text: The first zero result records the stop time, and a continuously stopped result returns without publishing after stop_pub_timeout.
    evaluation: static
    reference_evidence:
    - path: src/collision_monitor_node.cpp
      anchor: this->now() - stop_stamp_ > stop_pub_timeout_
      snippet: |2-
        void CollisionMonitor::publishVelocity(
          const Action & robot_action, const std_msgs::msg::Header & header)
        {
          if (robot_action.req_vel.isZero()) {
            if (!robot_action_prev_.req_vel.isZero()) {
              // Robot just stopped: saving stop timestamp and continue
              stop_stamp_ = this->now();
            } else if (this->now() - stop_stamp_ > stop_pub_timeout_) {
              // More than stop_pub_timeout_ passed after robot has been stopped.
              // Cease publishing output cmd_vel.
              return;
            }
          }

          auto cmd_vel_out_msg = std::make_unique<geometry_msgs::msg::TwistStamped>();
      explanation: Records the transition to stopped and suppresses later repeated output after the configured duration.
- id: M-4
  name: Runtime enforcement toggle
  description: The monitor exposes runtime collision-enforcement enablement.
  requirement_ids:
  - FR-4
  pass_criteria:
  - id: M-4-PC-1
    text: The toggle service copies the requested enable state and reports successful completion.
    evaluation: static
    reference_evidence:
    - path: src/collision_monitor_node.cpp
      anchor: CollisionMonitor::toggleCMServiceCallback
      snippet: |2-
        void CollisionMonitor::toggleCMServiceCallback(
          const std::shared_ptr<rmw_request_id_t>/*request_header*/,
          const std::shared_ptr<nav2_msgs::srv::Toggle::Request> request,
          std::shared_ptr<nav2_msgs::srv::Toggle::Response> response)
