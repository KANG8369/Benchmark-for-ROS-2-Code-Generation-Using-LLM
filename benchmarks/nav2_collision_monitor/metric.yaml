- id: M-8
  name: Lifecycle-gated processing and resources
  description: Monitor and detector processing, outputs, bonds, and resources follow lifecycle transitions.
  requirement_ids:
  - FR-8
  pass_criteria:
  - id: M-8-PC-1
    text: Monitor activation enables publishers, zones, processing, and its bond, while deactivation reverses those operations.
    evaluation: static
    reference_evidence:
    - path: src/collision_monitor_node.cpp
      anchor: CollisionMonitor::on_activate
      snippet: |2-
        CollisionMonitor::on_activate(const rclcpp_lifecycle::State & /*state*/)
        {
          RCLCPP_INFO(get_logger(), "Activating");

          // Activating lifecycle publisher
          cmd_vel_out_pub_->on_activate();
          if (state_pub_) {
            state_pub_->on_activate();
          }
          collision_points_marker_pub_->on_activate();
          triggering_points_pub_->on_activate();

          // Activating polygons
          for (std::shared_ptr<Polygon> polygon : polygons_) {
            polygon->activate();
          }

          // Since polygons are being published when cmd_vel_in appears,
          // we need to publish polygons first time to display them at startup
          publishPolygons();

          // Activating main worker
          process_active_ = true;

          // Creating bond connection
          createBond();

          return nav2::CallbackReturn::SUCCESS;
        }
      explanation: Activates all monitor outputs, zones, processing, and lifecycle bond together.
    - path: src/collision_monitor_node.cpp
      anchor: CollisionMonitor::on_deactivate
      snippet: |2-
        CollisionMonitor::on_deactivate(const rclcpp_lifecycle::State & /*state*/)
        {
          RCLCPP_INFO(get_logger(), "Deactivating");

          // Deactivating main worker
          process_active_ = false;

          // Reset action type to default after worker deactivating
          robot_action_prev_ = {DO_NOTHING, {-1.0, -1.0, -1.0}, "", std::vector<Point>()};

          // Deactivating polygons
          for (std::shared_ptr<Polygon> polygon : polygons_) {
            polygon->deactivate();
          }

          // Deactivating lifecycle publishers
          cmd_vel_out_pub_->on_deactivate();
          if (state_pub_) {
            state_pub_->on_deactivate();
          }
          collision_points_marker_pub_->on_deactivate();
          triggering_points_pub_->on_deactivate();

          // Destroying bond connection
          destroyBond();

          return nav2::CallbackReturn::SUCCESS;
        }
      explanation: Disables monitor work, outputs, zones, and bond on deactivation.
  - id: M-8-PC-2
