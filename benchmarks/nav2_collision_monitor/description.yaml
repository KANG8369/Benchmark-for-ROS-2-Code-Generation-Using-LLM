  launch_arguments:
  - name: namespace
    purpose: Applies a top-level namespace to launched processes and the target component container.
  - name: use_sim_time
    purpose: Sets use_sim_time for launched nodes.
  - name: params_file
    purpose: Selects the parameter file rewritten beneath the requested namespace.
  - name: use_composition
    purpose: Selects component loading into an existing container instead of standalone processes.
  - name: container_name
    purpose: Selects the target component-container name.
  external_nodes:
  - name: lifecycle_manager_collision_monitor
    package: nav2_lifecycle_manager
    executable: lifecycle_manager
    purpose: Autostarts and manages collision_monitor in standalone launch mode.
    services:
    - name: collision_monitor/change_state
      type: lifecycle_msgs/srv/ChangeState
      role: client
      purpose: Requests collision_monitor lifecycle transitions.
    - name: collision_monitor/get_state
      type: lifecycle_msgs/srv/GetState
      role: client
      purpose: Queries collision_monitor lifecycle state.
    parameters:
    - name: use_sim_time
      type: bool
      purpose: Selects simulated time from the launch context.
    - name: autostart
      type: bool
      purpose: Automatically starts lifecycle management.
    - name: node_names
      type: string_array
      purpose: Selects collision_monitor as the managed lifecycle node.
  - name: lifecycle_manager_collision_monitor
    package: nav2_lifecycle_manager
    plugin: nav2_lifecycle_manager::LifecycleManager
    purpose: Autostarts and manages collision_monitor in composed launch mode.
    services:
    - name: collision_monitor/change_state
