intent:
  package_name: nav2_collision_monitor
  summary: Provides lifecycle-managed collision monitoring that converts configured obstacle observations into safety-zone detections and either filters commanded robot velocity or publishes detector state.
  scope: Implements the collision_monitor and collision_detector nodes, reusable obstacle-source and safety-zone classes, planar collision-projection utilities, parameter files, and standalone or composed launch orchestration; sensor publishers, TF broadcasters, robot controllers, component containers, and lifecycle clients are external responsibilities.
functional_requirements:
- id: FR-1
  text: The collision_monitor node evaluates every enabled configured zone for each requested velocity and publishes the most restrictive result among unchanged, stopped, slowed, speed-limited, and approach-scaled velocity.
- id: FR-2
  text: The collision_monitor node publishes zero velocity when an enabled observation source with a nonzero timeout has no valid recent data or cannot transform its data into the configured base frame.
- id: FR-3
  text: While the robot remains stopped, the collision_monitor node stops repeating zero-velocity output after the configured stop-publishing timeout.
- id: FR-4
  text: The collision_monitor node can be enabled or disabled at runtime through its toggle service.
- id: FR-5
  text: When a state topic is configured, the collision_monitor node publishes the selected zone and action whenever the selected collision behavior changes.
- id: FR-6
  text: While active, the collision_detector node periodically publishes one Boolean detection result for every enabled configured zone without publishing robot velocity commands.
- id: FR-7
  text: The collision_detector node rejects a configured zone whose action type is not none.
- id: FR-8
  text: Both nodes create processing resources during configuration, enable processing, lifecycle publishers, and bonds only while active, and release runtime resources during deactivation and cleanup.
- id: FR-9
  text: Both nodes publish transformed observation points and zone-triggering points as marker arrays when the corresponding visualization outputs have subscribers.
- id: FR-10
  text: Configured polygon and circle zones support static or topic-updated geometry and can publish their current geometry for visualization in the configured base frame.
- id: FR-11
  text: Zone triggering applies configured observation-source selection, minimum point count, and independent consecutive-trigger and consecutive-release debounce thresholds.
- id: FR-12
  text: A velocity-selected polygon zone chooses the first configured sub-polygon whose linear, angular, and optional holonomic direction bounds contain the current requested velocity.
- id: FR-13
  text: Both nodes support arbitrary configured sets of LaserScan, PointCloud2, Range, PolygonInstanceStamped, and Costmap sources and convert accepted observations into tagged obstacle points in the configured base frame with optional odometry-based time correction.
- id: FR-14
  text: A PointCloud2 source filters observations by minimum range, minimum and maximum height, optional global-height interpretation, and configured point-cloud transport.
- id: FR-15
  text: A Range source rejects malformed or out-of-range observations and expands each accepted reading into bounded obstacle samples across its field of view.
- id: FR-16
  text: A polygon-instance source replaces an older instance with the same identifier, removes stale instances, and samples transformed polygon edges into obstacle points.
- id: FR-17
  text: A Costmap source converts cells meeting the configured cost threshold, and optionally unknown cells, into obstacle points transformed to the configured base frame.
- id: FR-18
  text: The installed kinematics utilities project planar robot pose and velocity over a time interval and transform obstacle points into a projected robot-relative frame.
- id: FR-19
  text: The supplied launch descriptions expose namespace, simulated time, parameter-file, composition, and container settings and start or load the selected collision node together with its lifecycle manager in standalone or composed mode.
interfaces:
  nodes:
  - name: collision_monitor
    responsibility: Filters requested robot velocity according to configured obstacle sources and safety-zone actions.
    topics:
    - name: <cmd_vel_in_topic>
      type: geometry_msgs/msg/Twist
      direction: subscribe
      purpose: Receives unstamped requested velocity when stamped velocity mode is disabled; the supplied configuration defaults the topic to cmd_vel_smoothed.
    - name: <cmd_vel_in_topic>
      type: geometry_msgs/msg/TwistStamped
      direction: subscribe
      purpose: Receives stamped requested velocity when stamped velocity mode is enabled; the supplied configuration defaults the topic to cmd_vel_smoothed.
    - name: <cmd_vel_out_topic>
      type: geometry_msgs/msg/Twist
      direction: publish
      purpose: Publishes unstamped safety-filtered velocity when stamped velocity mode is disabled; the supplied configuration defaults the topic to cmd_vel.
    - name: <cmd_vel_out_topic>
      type: geometry_msgs/msg/TwistStamped
      direction: publish
      purpose: Publishes stamped safety-filtered velocity when stamped velocity mode is enabled; the supplied configuration defaults the topic to cmd_vel.
    - name: <state_topic>
      type: nav2_msgs/msg/CollisionMonitorState
      direction: publish
      purpose: Reports the selected zone and action when a nonempty state topic is configured; the supplied configuration uses collision_monitor_state.
    - name: ~/collision_points_marker
      type: visualization_msgs/msg/MarkerArray
      direction: publish
      purpose: Visualizes transformed obstacle points grouped by observation source.
    - name: ~/triggering_points
      type: visualization_msgs/msg/MarkerArray
      direction: publish
      purpose: Visualizes points responsible for the selected collision action.
    - name: <polygon_pub_topic>
      type: geometry_msgs/msg/PolygonStamped
      direction: publish
      purpose: Publishes the current geometry of a configured zone when visualization is enabled.
    - name: <polygon_sub_topic>
      type: geometry_msgs/msg/PolygonStamped
      direction: subscribe
      purpose: Receives dynamic polygon vertices when static points are not configured.
    - name: <circle_sub_topic>
      type: std_msgs/msg/Float32
      direction: subscribe
      purpose: Receives a dynamic circle radius when a static radius is not configured.
    - name: <footprint_topic>
      type: geometry_msgs/msg/PolygonStamped
      direction: subscribe
      purpose: Receives footprint geometry for an approach polygon; the supplied configuration uses /local_costmap/published_footprint.
    - name: <scan_source_topic>
      type: sensor_msgs/msg/LaserScan
      direction: subscribe
      purpose: Receives a configured laser-scan observation source; the supplied configuration uses scan.
    - name: <pointcloud_source_topic>
      type: sensor_msgs/msg/PointCloud2
      direction: subscribe
      purpose: Receives a configured point-cloud observation source through the selected transport.
    - name: <range_source_topic>
      type: sensor_msgs/msg/Range
      direction: subscribe
      purpose: Receives a configured range-sensor observation source.
    - name: <polygon_source_topic>
      type: geometry_msgs/msg/PolygonInstanceStamped
      direction: subscribe
      purpose: Receives identified obstacle-polygon instances.
    - name: <costmap_source_topic>
      type: nav2_msgs/msg/Costmap
      direction: subscribe
      purpose: Receives a configured costmap observation source.
    - name: tf
      type: tf2_msgs/msg/TFMessage
      direction: subscribe
      purpose: Receives dynamic transforms after the supplied launch remapping from /tf.
    - name: tf_static
      type: tf2_msgs/msg/TFMessage
      direction: subscribe
      purpose: Receives static transforms after the supplied launch remapping from /tf_static.
    services:
    - name: ~/toggle
      type: nav2_msgs/srv/Toggle
      role: server
      purpose: Enables or disables collision-monitor enforcement at runtime.
    tf:
    - source_frame: <observation_frame>
      target_frame: <base_frame_id>
      purpose: Transforms observations into the robot base frame, optionally using the odometry frame as a fixed frame for time correction.
    - source_frame: <dynamic_zone_frame>
      target_frame: <base_frame_id>
      purpose: Transforms topic-updated zone geometry into the robot base frame.
    parameters:
    - name: use_sim_time
      type: bool
      purpose: Selects simulated time when set by launch.
    - name: enable_stamped_cmd_vel
      type: bool
      purpose: Selects TwistStamped rather than Twist for requested and filtered velocity topics.
    - name: use_realtime_priority
      type: bool
      purpose: Requests soft real-time scheduling during configuration.
    - name: enabled
      type: bool
      purpose: Sets the initial collision-monitor enforcement state.
    - name: cmd_vel_in_topic
      type: string
      purpose: Selects the requested-velocity input topic.
    - name: cmd_vel_out_topic
      type: string
      purpose: Selects the safety-filtered velocity output topic.
    - name: state_topic
      type: string
      purpose: Selects the optional collision-action state topic.
    - name: base_frame_id
      type: string
      purpose: Selects the robot base frame used for obstacle and zone evaluation.
    - name: odom_frame_id
      type: string
      purpose: Selects the fixed frame used for time-corrected transforms.
    - name: transform_tolerance
      type: double
      purpose: Sets the allowed transform lookup tolerance.
    - name: source_timeout
      type: double
      purpose: Sets the node-level default observation-source timeout.
    - name: base_shift_correction
      type: bool
      purpose: Enables odometry-based correction between observation and evaluation times.
    - name: collision_points_marker_3d
      type: bool
      purpose: Selects three-dimensional rather than planar observation markers.
    - name: stop_pub_timeout
      type: double
      purpose: Limits how long repeated zero-velocity commands are published while stopped.
    - name: polygons
      type: string_array
      purpose: Selects the configured safety-zone instances.
    - name: observation_sources
      type: string_array
      purpose: Selects the configured observation-source instances.
    - name: <polygon_name>.type
      type: string
      purpose: Selects polygon, circle, or velocity_polygon geometry.
    - name: <polygon_name>.action_type
      type: string
      purpose: Selects stop, slowdown, limit, approach, or none behavior.
    - name: <polygon_name>.enabled
      type: bool
      purpose: Enables the configured zone.
    - name: <polygon_name>.min_points
      type: integer
      purpose: Sets the minimum number of contained points required to trigger the zone.
    - name: <polygon_name>.max_points
      type: integer
      purpose: Provides the deprecated predecessor of min_points when supplied.
    - name: <polygon_name>.trigger_consecutive_points
      type: integer
      purpose: Sets the consecutive triggered evaluations required to enter the triggered state.
    - name: <polygon_name>.release_consecutive_points
      type: integer
      purpose: Sets the consecutive clear evaluations required to leave the triggered state.
    - name: <polygon_name>.slowdown_ratio
      type: double
      purpose: Sets the velocity scale for a slowdown zone.
    - name: <polygon_name>.linear_limit
      type: double
      purpose: Sets the linear-speed bound for a limit zone.
    - name: <polygon_name>.angular_limit
      type: double
      purpose: Sets the angular-speed bound for a limit zone.
    - name: <polygon_name>.time_before_collision
      type: double
      purpose: Sets the projected collision horizon for an approach zone.
    - name: <polygon_name>.simulation_time_step
      type: double
      purpose: Sets the projection time increment for an approach zone.
    - name: <polygon_name>.visualize
      type: bool
      purpose: Enables publication of the current zone geometry.
    - name: <polygon_name>.polygon_pub_topic
      type: string
      purpose: Selects the zone-geometry publication topic.
    - name: <polygon_name>.polygon_subscribe_transient_local
      type: bool
      purpose: Selects transient-local durability for dynamic zone subscriptions.
    - name: <polygon_name>.polygon_sub_topic
      type: string
      purpose: Selects the dynamic polygon or circle-geometry input topic.
    - name: <polygon_name>.footprint_topic
      type: string
      purpose: Selects the footprint input for an approach polygon.
    - name: <polygon_name>.sources_names
      type: string_array
      purpose: Restricts the zone to selected configured observation sources.
    - name: <polygon_name>.points
      type: string
      purpose: Supplies static polygon vertices.
    - name: <polygon_name>.radius
      type: double
      purpose: Supplies a static circle radius.
    - name: <polygon_name>.velocity_polygons
      type: string_array
      purpose: Selects the ordered velocity-dependent sub-polygons.
    - name: <polygon_name>.holonomic
      type: bool
      purpose: Enables planar direction bounds for velocity-dependent sub-polygons.
    - name: <polygon_name>.<velocity_polygon_name>.points
      type: string
      purpose: Supplies the sub-polygon vertices.
    - name: <polygon_name>.<velocity_polygon_name>.linear_min
      type: double
      purpose: Sets the lower linear-speed bound for the sub-polygon.
    - name: <polygon_name>.<velocity_polygon_name>.linear_max
      type: double
      purpose: Sets the upper linear-speed bound for the sub-polygon.
    - name: <polygon_name>.<velocity_polygon_name>.theta_min
      type: double
      purpose: Sets the lower angular-speed bound for the sub-polygon.
    - name: <polygon_name>.<velocity_polygon_name>.theta_max
      type: double
      purpose: Sets the upper angular-speed bound for the sub-polygon.
    - name: <polygon_name>.<velocity_polygon_name>.direction_start_angle
      type: double
      purpose: Sets the lower planar direction bound for a holonomic sub-polygon.
    - name: <polygon_name>.<velocity_polygon_name>.direction_end_angle
      type: double
      purpose: Sets the upper planar direction bound for a holonomic sub-polygon.
    - name: <source_name>.type
      type: string
      purpose: Selects scan, pointcloud, range, polygon, or costmap source behavior.
    - name: <source_name>.topic
      type: string
      purpose: Selects the observation input topic.
    - name: <source_name>.enabled
      type: bool
      purpose: Enables the configured observation source.
    - name: <source_name>.source_timeout
      type: double
      purpose: Overrides the node-level timeout for the source.
    - name: <pointcloud_source_name>.min_height
      type: double
      purpose: Sets the minimum accepted point height.
    - name: <pointcloud_source_name>.max_height
      type: double
      purpose: Sets the maximum accepted point height.
    - name: <pointcloud_source_name>.min_range
      type: double
      purpose: Sets the minimum accepted point distance from the sensor.
    - name: <pointcloud_source_name>.use_global_height
      type: bool
      purpose: Selects global-frame height rather than transformed base-frame height.
    - name: <pointcloud_source_name>.transport_type
      type: string
      purpose: Selects the point-cloud transport.
    - name: <range_source_name>.obstacles_angle
      type: double
      purpose: Sets angular spacing between generated range-arc obstacle samples.
    - name: <polygon_source_name>.sampling_distance
      type: double
      purpose: Sets distance between polygon-edge obstacle samples.
    - name: <costmap_source_name>.cost_threshold
      type: integer
      purpose: Sets the minimum cost considered occupied.
    - name: <costmap_source_name>.treat_unknown_as_obstacle
      type: bool
      purpose: Selects whether unknown cells are converted to obstacles.
  - name: collision_detector
    responsibility: Periodically reports whether configured obstacle sources trigger configured zones without filtering velocity.
    topics:
    - name: collision_detector_state
      type: nav2_msgs/msg/CollisionDetectorState
      direction: publish
      purpose: Publishes configured zone names and their current detection results.
    - name: ~/collision_points_marker
      type: visualization_msgs/msg/MarkerArray
      direction: publish
      purpose: Visualizes transformed obstacle points grouped by observation source.
    - name: ~/triggering_points
      type: visualization_msgs/msg/MarkerArray
      direction: publish
      purpose: Visualizes points that trigger configured zones.
    - name: <polygon_pub_topic>
      type: geometry_msgs/msg/PolygonStamped
      direction: publish
      purpose: Publishes the current geometry of a configured zone when visualization is enabled.
    - name: <polygon_sub_topic>
      type: geometry_msgs/msg/PolygonStamped
      direction: subscribe
      purpose: Receives dynamic polygon vertices when static points are not configured.
    - name: <circle_sub_topic>
      type: std_msgs/msg/Float32
      direction: subscribe
      purpose: Receives a dynamic circle radius when a static radius is not configured.
    - name: <scan_source_topic>
      type: sensor_msgs/msg/LaserScan
      direction: subscribe
      purpose: Receives a configured laser-scan observation source; the supplied configuration uses scan.
    - name: <pointcloud_source_topic>
      type: sensor_msgs/msg/PointCloud2
      direction: subscribe
      purpose: Receives a configured point-cloud observation source through the selected transport.
    - name: <range_source_topic>
      type: sensor_msgs/msg/Range
      direction: subscribe
      purpose: Receives a configured range-sensor observation source.
    - name: <polygon_source_topic>
      type: geometry_msgs/msg/PolygonInstanceStamped
      direction: subscribe
      purpose: Receives identified obstacle-polygon instances.
    - name: <costmap_source_topic>
      type: nav2_msgs/msg/Costmap
      direction: subscribe
      purpose: Receives a configured costmap observation source.
    - name: tf
      type: tf2_msgs/msg/TFMessage
      direction: subscribe
      purpose: Receives dynamic transforms after the supplied launch remapping from /tf.
    - name: tf_static
      type: tf2_msgs/msg/TFMessage
      direction: subscribe
      purpose: Receives static transforms after the supplied launch remapping from /tf_static.
    tf:
    - source_frame: <observation_frame>
      target_frame: <base_frame_id>
      purpose: Transforms observations into the robot base frame, optionally using the odometry frame as a fixed frame for time correction.
    - source_frame: <dynamic_zone_frame>
      target_frame: <base_frame_id>
      purpose: Transforms topic-updated zone geometry into the robot base frame.
    parameters:
    - name: use_sim_time
      type: bool
      purpose: Selects simulated time when set by launch.
    - name: frequency
      type: double
      purpose: Sets the periodic detection frequency.
    - name: base_frame_id
      type: string
      purpose: Selects the robot base frame used for obstacle and zone evaluation.
    - name: odom_frame_id
      type: string
      purpose: Selects the fixed frame used for time-corrected transforms.
    - name: transform_tolerance
      type: double
      purpose: Sets the allowed transform lookup tolerance.
    - name: source_timeout
      type: double
      purpose: Sets the node-level default observation-source timeout.
    - name: base_shift_correction
      type: bool
      purpose: Enables odometry-based correction between observation and evaluation times.
    - name: collision_points_marker_3d
      type: bool
      purpose: Selects three-dimensional rather than planar observation markers.
    - name: polygons
      type: string_array
      purpose: Selects the configured detection-zone instances.
    - name: observation_sources
      type: string_array
      purpose: Selects the configured observation-source instances.
    - name: <polygon_name>.type
      type: string
      purpose: Selects polygon, circle, or velocity_polygon geometry.
    - name: <polygon_name>.action_type
      type: string
      purpose: Must be none for a detector zone.
    - name: <polygon_name>.enabled
      type: bool
      purpose: Enables the configured zone.
    - name: <polygon_name>.min_points
      type: integer
      purpose: Sets the minimum number of contained points required to detect the zone.
    - name: <polygon_name>.max_points
      type: integer
      purpose: Provides the deprecated predecessor of min_points when supplied.
    - name: <polygon_name>.trigger_consecutive_points
      type: integer
      purpose: Sets the consecutive triggered evaluations required to enter the triggered state.
    - name: <polygon_name>.release_consecutive_points
      type: integer
      purpose: Sets the consecutive clear evaluations required to leave the triggered state.
    - name: <polygon_name>.visualize
      type: bool
      purpose: Enables publication of the current zone geometry.
    - name: <polygon_name>.polygon_pub_topic
      type: string
      purpose: Selects the zone-geometry publication topic.
    - name: <polygon_name>.polygon_subscribe_transient_local
      type: bool
      purpose: Selects transient-local durability for dynamic zone subscriptions.
    - name: <polygon_name>.polygon_sub_topic
      type: string
      purpose: Selects the dynamic polygon or circle-geometry input topic.
    - name: <polygon_name>.sources_names
      type: string_array
      purpose: Restricts the zone to selected configured observation sources.
    - name: <polygon_name>.points
      type: string
      purpose: Supplies static polygon vertices.
    - name: <polygon_name>.radius
      type: double
      purpose: Supplies a static circle radius.
    - name: <polygon_name>.velocity_polygons
      type: string_array
      purpose: Selects the ordered velocity-dependent sub-polygons.
    - name: <polygon_name>.holonomic
      type: bool
      purpose: Enables planar direction bounds for velocity-dependent sub-polygons.
    - name: <polygon_name>.<velocity_polygon_name>.points
      type: string
      purpose: Supplies the sub-polygon vertices.
    - name: <polygon_name>.<velocity_polygon_name>.linear_min
      type: double
      purpose: Sets the lower linear-speed bound for the sub-polygon.
    - name: <polygon_name>.<velocity_polygon_name>.linear_max
      type: double
      purpose: Sets the upper linear-speed bound for the sub-polygon.
    - name: <polygon_name>.<velocity_polygon_name>.theta_min
      type: double
