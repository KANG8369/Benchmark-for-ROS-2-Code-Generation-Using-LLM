    - name: <polygon_name>.<velocity_polygon_name>.theta_max
      type: double
      purpose: Sets the upper angular-speed bound for the sub-polygon.
    - name: <polygon_name>.<velocity_polygon_name>.direction_start_angle
      type: double
      purpose: Sets the lower planar direction bound for a holonomic sub-polygon.
    - name: <polygon_name>.<velocity_polygon_name>.direction_end_angle
      type: double
      purpose: Sets the upper planar direction bound for a holonomic sub-polygon.
    - name: <source_name>.type
      type: string
      purpose: Selects scan, pointcloud, range, polygon, or costmap source behavior.
    - name: <source_name>.topic
      type: string
      purpose: Selects the observation input topic.
    - name: <source_name>.enabled
      type: bool
      purpose: Enables the configured observation source.
    - name: <source_name>.source_timeout
      type: double
      purpose: Overrides the node-level timeout for the source.
    - name: <pointcloud_source_name>.min_height
      type: double
      purpose: Sets the minimum accepted point height.
    - name: <pointcloud_source_name>.max_height
      type: double
      purpose: Sets the maximum accepted point height.
    - name: <pointcloud_source_name>.min_range
      type: double
      purpose: Sets the minimum accepted point distance from the sensor.
    - name: <pointcloud_source_name>.use_global_height
      type: bool
      purpose: Selects global-frame height rather than transformed base-frame height.
    - name: <pointcloud_source_name>.transport_type
