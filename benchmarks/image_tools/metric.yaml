schema_version: '2.0'
package_name: image_tools
reference:
  root: reference/
evaluation_policy:
  equivalence: semantic
  exact_constants_only_when_specified: true
metrics:
- id: M-1
  name: Camera or synthetic image publication
  description: cam2image periodically publishes captured or generated images as required by FR-1.
  requirement_ids:
  - FR-1
  pass_criteria:
  - id: M-1-PC-1
    text: Static inspection shows cam2image uses a timer-driven sensor_msgs/msg/Image publisher.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: src/cam2image.cpp
      locator: Cam2Image::timerCallback
      snippet: |2-
          void timerCallback()
          {
            cv::Mat frame;

            // Initialize a shared pointer to an Image message.
            // Get the frame from the video capture.
            if (burger_mode_) {
              frame = burger_cap.render_burger(width_, height_);
            } else {
              cap >> frame;
            }

            // If no frame was grabbed, return early
            if (frame.empty()) {
              return;
            }

            // Conditionally flip the image
            if (is_flipped_) {
              cv::flip(frame, frame, 1);
            }

            // Conditionally show image
            if (show_camera_) {
              // Show the image in a window called "cam2image".
              cv::imshow("cam2image", frame);
              // Draw the image to the screen and wait 1 millisecond.
              cv::waitKey(1);
            }

            std_msgs::msg::Header header;
            header.frame_id = frame_id_;
            header.stamp = this->now();
            image_tools::ROSCvMatContainer container(frame, header);

            // Publish the image message and increment the publish_number_.
            RCLCPP_INFO(get_logger(), "Publishing image #%zd", publish_number_++);
            pub_->publish(std::move(container));
          }
      explanation: Selects camera or synthetic input, constructs a ROS-compatible image container, stamps
        it, and publishes it.
