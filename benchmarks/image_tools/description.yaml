intent:
  package_name: image_tools
  summary: Provides ROS 2 image producer and viewer components plus a public OpenCV-to-sensor_msgs
    image type adapter.
  scope: Captures images from a local camera or generates synthetic burger images,
    publishes and displays ROS images, and supplies image conversion utilities; camera
    hardware, image publishers, and TF providers are external responsibilities.
functional_requirements:
- id: FR-1
  text: The cam2image node periodically publishes sensor image messages acquired from
    a configured camera device or generated in synthetic burger mode, with a current
    timestamp and configured frame ID.
- id: FR-2
  text: The cam2image node horizontally flips subsequently published images when it
    receives a true Boolean command on its flip_image subscription.
- id: FR-3
  text: The cam2image node skips publication for a timer iteration when no camera
    frame is available.
- id: FR-4
  text: The cam2image node raises an error when its camera cannot be opened, its QoS
    reliability or history setting is invalid, or synthetic-image dimensions are too
    small for the burger image.
- id: FR-5
  text: The showimage node receives configured-QoS sensor image messages and, when
    enabled, converts supported image encodings for display in an OpenCV window.
- id: FR-6
  text: The exported ROSCvMatContainer utility adapts OpenCV matrices and sensor_msgs
    Image messages while preserving image headers and providing owned or referenced
    image-data access and copies.
- id: FR-7
  text: The exported image type adapter raises an error for unsupported OpenCV matrix
    types and unsupported incoming sensor image encodings.
interfaces:
  nodes:
  - name: cam2image
    responsibility: Captures or synthesizes images and publishes them as ROS sensor
      image messages.
    topics:
    - name: image
      type: sensor_msgs/msg/Image
      direction: publish
      purpose: Publishes captured or synthetic camera frames.
    - name: flip_image
      type: std_msgs/msg/Bool
      direction: subscribe
      purpose: Receives the requested horizontal-flip state for outgoing images.
    parameters:
    - name: reliability
      type: string
      purpose: Selects reliable or best-effort QoS reliability for the image publisher.
    - name: history
      type: string
      purpose: Selects keep-last or keep-all QoS history for the image publisher.
    - name: depth
      type: integer
      purpose: Sets publisher queue depth when keep-last history is selected.
    - name: frequency
      type: double
      purpose: Sets the image publication frequency.
    - name: show_camera
      type: bool
      purpose: Enables local OpenCV display of captured or generated frames.
    - name: device_id
      type: integer
      purpose: Selects the local camera device to open when synthetic mode is disabled.
    - name: width
      type: integer
      purpose: Sets the requested image width.
    - name: height
      type: integer
      purpose: Sets the requested image height.
    - name: burger_mode
      type: bool
      purpose: Selects synthetic animated burger-image generation instead of camera
        capture.
    - name: frame_id
      type: string
      purpose: Sets the frame ID placed in each published image header.
  - name: showimage
    responsibility: Subscribes to sensor images and optionally displays them in an
      OpenCV window.
    topics:
    - name: image
      type: sensor_msgs/msg/Image
      direction: subscribe
      purpose: Receives images for optional local display.
    parameters:
    - name: reliability
      type: string
      purpose: Selects reliable or best-effort QoS reliability for the image subscription.
    - name: history
      type: string
      purpose: Selects keep-last or keep-all QoS history for the image subscription.
    - name: depth
      type: integer
      purpose: Sets subscription queue depth when keep-last history is selected.
    - name: show_image
      type: bool
      purpose: Enables rendering received images in an OpenCV window.
    - name: window_name
      type: string
      purpose: Sets the OpenCV display-window name, or uses the resolved subscribed
        topic name when empty.
