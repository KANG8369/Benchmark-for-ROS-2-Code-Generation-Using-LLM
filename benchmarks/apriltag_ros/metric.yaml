schema_version: '2.0'
package_name: apriltag_ros
reference:
  root: reference/
evaluation_policy:
  equivalence: semantic
  exact_constants_only_when_specified: true
metrics:
- id: M-1
  name: AprilTag detection publication
  description: Camera input is processed into configured AprilTag detections as required by FR-1.
  requirement_ids:
  - FR-1
  pass_criteria:
  - id: M-1-PC-1
    text: Static inspection shows synchronized image and CameraInfo inputs are consumed by the camera
      callback.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: src/AprilTagNode.cpp
      locator: AprilTagNode::onCamera
      snippet: |-
        void AprilTagNode::onCamera(const sensor_msgs::msg::Image::ConstSharedPtr& msg_img,
                                    const sensor_msgs::msg::CameraInfo::ConstSharedPtr& msg_ci)
        {
            // camera intrinsics for rectified images
            const std::array<double, 4> intrinsics = {msg_ci->p[0], msg_ci->p[5], msg_ci->p[2], msg_ci->p[6]};

            // check for valid intrinsics
            const bool calibrated = msg_ci->width && msg_ci->height &&
                                    intrinsics[0] && intrinsics[1] && intrinsics[2] && intrinsics[3];

            if(estimate_pose != nullptr && !calibrated) {
                RCLCPP_WARN_STREAM(get_logger(), "The camera is not calibrated! Set 'pose_estimation_method' to \"\" (empty) to disable pose estimation and this warning.");
            }

            // convert to 8bit monochrome image
            const cv::Mat img_uint8 = cv_bridge::toCvShare(msg_img, "mono8")->image;

            image_u8_t im{img_uint8.cols, img_uint8.rows, img_uint8.cols, img_uint8.data};

            // detect tags
            mutex.lock();
            zarray_t* detections = apriltag_detector_detect(td, &im);
            mutex.unlock();

            if(profile)
                timeprofile_display(td->tp);

            apriltag_msgs::msg::AprilTagDetectionArray msg_detections;
            msg_detections.header = msg_img->header;

            std::vector<geometry_msgs::msg::TransformStamped> tfs;

            for(int i = 0; i < zarray_size(detections); i++) {
                apriltag_detection_t* det;
                zarray_get(detections, i, &det);

                RCLCPP_DEBUG(get_logger(),
                             "detection %3d: id (%2dx%2d)-%-4d, hamming %d, margin %8.3f\n",
                             i, det->family->nbits, det->family->h, det->id,
                             det->hamming, det->decision_margin);

                // ignore untracked tags
                if(!tag_frames.empty() && !tag_frames.count(det->id)) { continue; }

                // reject detections with more corrected bits than allowed
                if(det->hamming > max_hamming) { continue; }

                // detection
                apriltag_msgs::msg::AprilTagDetection msg_detection;
                msg_detection.family = std::string(det->family->name);
                msg_detection.id = det->id;
                msg_detection.hamming = det->hamming;
                msg_detection.decision_margin = det->decision_margin;
                msg_detection.centre.x = det->c[0];
                msg_detection.centre.y = det->c[1];
                std::memcpy(msg_detection.corners.data(), det->p, sizeof(double) * 8);
                std::memcpy(msg_detection.homography.data(), det->H->data, sizeof(double) * 9);
                msg_detections.detections.push_back(msg_detection);

                // 3D orientation and position
                if(estimate_pose != nullptr && calibrated) {
                    geometry_msgs::msg::TransformStamped tf;
                    tf.header = msg_img->header;
                    // set child frame name by generic tag name or configured tag name
                    tf.child_frame_id = tag_frames.count(det->id) ? tag_frames.at(det->id) : std::string(det->family->name) + ":" + std::to_string(det->id);
                    const double size = tag_sizes.count(det->id) ? tag_sizes.at(det->id) : tag_edge_size;
                    tf.transform = estimate_pose(det, intrinsics, size);
                    tfs.push_back(tf);
                }
            }

            pub_detections->publish(msg_detections);

            if(estimate_pose != nullptr)
                tf_broadcaster.sendTransform(tfs);

            apriltag_detections_destroy(detections);
        }
      explanation: Converts camera input, runs the detector, constructs detection messages, and publishes
        the array.
