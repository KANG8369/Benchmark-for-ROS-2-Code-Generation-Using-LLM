schema_version: '2.0'
package_name: apriltag_ros
reference:
  root: reference/
evaluation_policy:
  equivalence: semantic
  exact_constants_only_when_specified: true
metrics:
- id: M-1
  name: AprilTag detection publication
  description: Camera input is processed into configured AprilTag detections as required by FR-1.
  requirement_ids:
  - FR-1
  pass_criteria:
  - id: M-1-PC-1
    text: Static inspection shows synchronized image and CameraInfo inputs are consumed by the camera
      callback.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: src/AprilTagNode.cpp
      locator: AprilTagNode::onCamera
      snippet: |-
        void AprilTagNode::onCamera(const sensor_msgs::msg::Image::ConstSharedPtr& msg_img,
                                    const sensor_msgs::msg::CameraInfo::ConstSharedPtr& msg_ci)
      explanation: The camera callback receives synchronized Image and CameraInfo messages.
  - id: M-1-PC-2
    text: Static inspection shows camera images are passed through the configured AprilTag detector.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: src/AprilTagNode.cpp
      locator: apriltag_detector_detect
      snippet: |2-
            // convert to 8bit monochrome image
            const cv::Mat img_uint8 = cv_bridge::toCvShare(msg_img, "mono8")->image;

            image_u8_t im{img_uint8.cols, img_uint8.rows, img_uint8.cols, img_uint8.data};

            // detect tags
            mutex.lock();
            zarray_t* detections = apriltag_detector_detect(td, &im);
      explanation: Converts the incoming image to mono8 and passes it to the AprilTag detector.
  - id: M-1-PC-3
    text: Static inspection shows accepted detections are converted into AprilTag detection messages.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: src/AprilTagNode.cpp
      locator: AprilTagDetection
      snippet: |2-
                // detection
                apriltag_msgs::msg::AprilTagDetection msg_detection;
                msg_detection.family = std::string(det->family->name);
                msg_detection.id = det->id;
                msg_detection.hamming = det->hamming;
                msg_detection.decision_margin = det->decision_margin;
                msg_detection.centre.x = det->c[0];
                msg_detection.centre.y = det->c[1];
                std::memcpy(msg_detection.corners.data(), det->p, sizeof(double) * 8);
                std::memcpy(msg_detection.homography.data(), det->H->data, sizeof(double) * 9);
                msg_detections.detections.push_back(msg_detection);
      explanation: Copies the accepted detector result into an AprilTagDetection message and appends it
        to the array.
  - id: M-1-PC-4
    text: Static inspection shows an AprilTagDetectionArray containing accepted detections is published.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: src/AprilTagNode.cpp
      locator: AprilTagDetectionArray
      snippet: |2-
            apriltag_msgs::msg::AprilTagDetectionArray msg_detections;
            msg_detections.header = msg_img->header;
      explanation: Creates the detection-array message and preserves the image header.
    - kind: source_code
      path: src/AprilTagNode.cpp
      locator: pub_detections->publish
      snippet: |2-
            pub_detections->publish(msg_detections);
      explanation: Publishes the completed AprilTagDetectionArray.
- id: M-2
  name: Optional tag pose transforms
  description: Pose-enabled detections produce tag transforms when calibration is valid as required by
    FR-2.
  requirement_ids:
  - FR-2
  pass_criteria:
  - id: M-2-PC-1
    text: Static inspection shows pose estimation is gated by its enable state and valid camera intrinsics.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: src/AprilTagNode.cpp
      locator: estimate_pose
      snippet: |2-
            // check for valid intrinsics
            const bool calibrated = msg_ci->width && msg_ci->height &&
                                    intrinsics[0] && intrinsics[1] && intrinsics[2] && intrinsics[3];

            if(estimate_pose != nullptr && !calibrated) {
                RCLCPP_WARN_STREAM(get_logger(), "The camera is not calibrated! Set 'pose_estimation_method' to \"\" (empty) to disable pose estimation and this warning.");
      explanation: Computes camera-calibration validity and warns when enabled pose estimation lacks calibration.
    - kind: source_code
      path: src/AprilTagNode.cpp
      locator: estimate_pose != nullptr && calibrated
      snippet: |2-
                if(estimate_pose != nullptr && calibrated) {
      explanation: Executes pose generation only when an estimator is enabled and calibration is valid.
  - id: M-2-PC-2
    text: Static inspection shows tag pose is estimated from detection corners, camera intrinsics, and
      tag size.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: src/pose_estimation.cpp
      locator: objectPoints
      snippet: |2-
            const std::vector<cv::Point3d> objectPoints{
                {-tagsize / 2, -tagsize / 2, 0},
                {+tagsize / 2, -tagsize / 2, 0},
                {+tagsize / 2, +tagsize / 2, 0},
                {-tagsize / 2, +tagsize / 2, 0},
            };
      explanation: Constructs tag object corners from the configured physical tag size.
    - kind: source_code
      path: src/pose_estimation.cpp
      locator: imagePoints
      snippet: |2-
            const std::vector<cv::Point2d> imagePoints{
                {detection->p[0][0], detection->p[0][1]},
                {detection->p[1][0], detection->p[1][1]},
                {detection->p[2][0], detection->p[2][1]},
                {detection->p[3][0], detection->p[3][1]},
            };
      explanation: Uses the detected tag corners as image points.
    - kind: source_code
      path: src/pose_estimation.cpp
      locator: cv::solvePnP
      snippet: |2-
            cv::Matx33d cameraMatrix;
            cameraMatrix(0, 0) = intr[0];// fx
            cameraMatrix(1, 1) = intr[1];// fy
            cameraMatrix(0, 2) = intr[2];// cx
            cameraMatrix(1, 2) = intr[3];// cy

            cv::Mat rvec, tvec;
            cv::solvePnP(objectPoints, imagePoints, cameraMatrix, {}, rvec, tvec);
      explanation: Builds the camera matrix from intrinsics and estimates pose with solvePnP.
  - id: M-2-PC-3
    text: Static inspection shows each transform uses the image frame as parent and a configured or derived
      tag frame as child.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: src/AprilTagNode.cpp
      locator: tf.child_frame_id
      snippet: |2-
                    geometry_msgs::msg::TransformStamped tf;
                    tf.header = msg_img->header;
                    // set child frame name by generic tag name or configured tag name
                    tf.child_frame_id = tag_frames.count(det->id) ? tag_frames.at(det->id) : std::string(det->family->name) + ":" + std::to_string(det->id);
                    const double size = tag_sizes.count(det->id) ? tag_sizes.at(det->id) : tag_edge_size;
      explanation: Copies the image header as the parent frame and chooses a configured or derived tag
        child frame.
  - id: M-2-PC-4
    text: Static inspection shows the resulting tag transforms are broadcast through TF.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: src/AprilTagNode.cpp
      locator: tf_broadcaster.sendTransform
      snippet: |2-
            if(estimate_pose != nullptr)
                tf_broadcaster.sendTransform(tfs);
      explanation: Broadcasts the collected tag transforms through TF when pose estimation is enabled.
- id: M-3
  name: Configured tag filtering and metadata
  description: Detection filtering and per-tag frame/size selection satisfy FR-3.
  requirement_ids:
  - FR-3
  pass_criteria:
  - id: M-3-PC-1
    text: Static inspection shows detections whose tag IDs are not configured are rejected when an ID
      filter is present.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: src/AprilTagNode.cpp
      locator: tag_frames.count
      snippet: |2-
                // ignore untracked tags
                if(!tag_frames.empty() && !tag_frames.count(det->id)) { continue; }
      explanation: Skips detections whose IDs are absent from a configured ID/frame map.
  - id: M-3-PC-2
    text: Static inspection shows detections exceeding the maximum Hamming correction are rejected.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: src/AprilTagNode.cpp
      locator: det->hamming > max_hamming
      snippet: |2-
                // reject detections with more corrected bits than allowed
                if(det->hamming > max_hamming) { continue; }
      explanation: Skips detections whose corrected-bit count exceeds max_hamming.
  - id: M-3-PC-3
    text: Static inspection shows a configured per-ID frame is used for accepted tags.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: src/AprilTagNode.cpp
      locator: tf.child_frame_id
      snippet: |2-
                    // set child frame name by generic tag name or configured tag name
                    tf.child_frame_id = tag_frames.count(det->id) ? tag_frames.at(det->id) : std::string(det->family->name) + ":" + std::to_string(det->id);
      explanation: Uses the per-ID configured frame when one exists.
  - id: M-3-PC-4
    text: Static inspection shows a configured per-ID tag size is used for accepted tags.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: src/AprilTagNode.cpp
      locator: tag_sizes.count
      snippet: |2-
                    const double size = tag_sizes.count(det->id) ? tag_sizes.at(det->id) : tag_edge_size;
      explanation: Uses the per-ID configured size when one exists.
- id: M-4
  name: Configuration validation
  description: Invalid tag-family and list configurations are rejected as required by FR-4.
  requirement_ids:
  - FR-4
  pass_criteria:
  - id: M-4-PC-1
    text: Static inspection shows startup rejects mismatched tag ID and frame-list lengths.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: src/AprilTagNode.cpp
      locator: ids.size() != frames.size()
      snippet: |2-
            if(!frames.empty()) {
                if(ids.size() != frames.size()) {
                    throw std::runtime_error("Number of tag ids (" + std::to_string(ids.size()) + ") and frames (" + std::to_string(frames.size()) + ") mismatch!");
                }
                for(size_t i = 0; i < ids.size(); i++) { tag_frames[ids[i]] = frames[i]; }
            }
      explanation: Throws an explicit error when nonempty frame and ID lists have different lengths.
  - id: M-4-PC-2
    text: Static inspection shows startup rejects mismatched tag ID and size-list lengths.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: src/AprilTagNode.cpp
      locator: ids.size() != sizes.size()
      snippet: |2-
            if(!sizes.empty()) {
                // use tag specific size
                if(ids.size() != sizes.size()) {
                    throw std::runtime_error("Number of tag ids (" + std::to_string(ids.size()) + ") and sizes (" + std::to_string(sizes.size()) + ") mismatch!");
                }
                for(size_t i = 0; i < ids.size(); i++) { tag_sizes[ids[i]] = sizes[i]; }
            }
      explanation: Throws an explicit error when nonempty size and ID lists have different lengths.
  - id: M-4-PC-3
    text: Static inspection shows startup rejects unsupported tag families with an explicit error.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: src/AprilTagNode.cpp
      locator: Unsupported tag family
      snippet: |2-
            if(tag_fun.count(tag_family)) {
                tf = tag_fun.at(tag_family).first();
                tf_destructor = tag_fun.at(tag_family).second;
                apriltag_detector_add_family(td, tf);
            }
            else {
                throw std::runtime_error("Unsupported tag family: " + tag_family);
      explanation: Selects registered tag families and throws for every unsupported family.
- id: M-5
  name: Runtime detector updates
  description: Runtime parameter updates affect subsequent processing as required by FR-5.
  requirement_ids:
  - FR-5
  pass_criteria:
  - id: M-5-PC-1
    text: Static inspection shows an on-set-parameters callback applies supported detector tuning updates.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: src/AprilTagNode.cpp
      locator: detector.threads
      snippet: |2-
            for(const rclcpp::Parameter& parameter : parameters) {
                RCLCPP_DEBUG_STREAM(get_logger(), "setting: " << parameter);

                IF("detector.threads", td->nthreads)
                IF("detector.decimate", td->quad_decimate)
                IF("detector.blur", td->quad_sigma)
                IF("detector.refine", td->refine_edges)
                IF("detector.sharpening", td->decode_sharpening)
                IF("detector.debug", td->debug)
      explanation: Maps supported detector parameters to the live detector fields in the parameter callback.
  - id: M-5-PC-2
    text: Static inspection shows runtime updates change the maximum Hamming correction.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: src/AprilTagNode.cpp
      locator: IF("max_hamming"
      snippet: |2-
                IF("max_hamming", max_hamming)
      explanation: Maps a max_hamming parameter update to the filtering state.
  - id: M-5-PC-3
    text: Static inspection shows runtime updates change detector profiling state.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: src/AprilTagNode.cpp
      locator: IF("profile"
      snippet: |2-
                IF("profile", profile)
      explanation: Maps a profile parameter update to the profiling state.
  - id: M-5-PC-4
    text: Static inspection shows the camera callback consumes the updated filtering and profiling state.
    evaluation: static
    reference_evidence:
    - kind: source_code
      path: src/AprilTagNode.cpp
      locator: if(profile)
      snippet: |2-
            if(profile)
                timeprofile_display(td->tp);
      explanation: Reads the current profiling state during camera processing.
    - kind: source_code
      path: src/AprilTagNode.cpp
      locator: det->hamming > max_hamming
      snippet: |2-
                // reject detections with more corrected bits than allowed
                if(det->hamming > max_hamming) { continue; }
      explanation: Reads the current max_hamming state while filtering detections.
- id: M-6
  name: Installed camera demonstration launch
  description: The package provides the configurable rectified-camera demo required by FR-6.
  requirement_ids:
  - FR-6
  pass_criteria:
  - id: M-6-PC-1
    text: Static inspection shows the demonstration launch declares a configurable camera device argument.
    evaluation: static
    reference_evidence:
    - kind: launch
      path: launch/camera_36h11.launch.yml
      locator: device
      snippet: |-
        - arg:
            name: device
            default: "0"
      explanation: Declares the configurable camera device launch argument.
  - id: M-6-PC-2
    text: Static inspection shows the launch composes camera input, rectification, and AprilTag processing.
    evaluation: static
    reference_evidence:
    - kind: launch
      path: launch/camera_36h11.launch.yml
      locator: camera::CameraNode
      snippet: |2-
            - pkg: camera_ros
              plugin: camera::CameraNode
              name: camera
              namespace: camera
              param:
              - name: camera
                value: $(var device)
      explanation: Starts the camera component and passes it the selected device.
    - kind: launch
      path: launch/camera_36h11.launch.yml
      locator: image_proc::RectifyNode
      snippet: |2-
            - pkg: image_proc
              plugin: image_proc::RectifyNode
              name: rectify
              namespace: camera
              remap:
              - from: image
                to: /camera/camera/image_raw
              - from: camera_info
                to: /camera/camera/camera_info
      explanation: Starts image rectification and remaps raw image and calibration inputs.
    - kind: launch
      path: launch/camera_36h11.launch.yml
      locator: AprilTagNode
      snippet: |2-
            - pkg: apriltag_ros
              plugin: AprilTagNode
              name: apriltag
              namespace: apriltag
              remap:
              - from: /apriltag/image_rect
                to: /camera/image_rect
              - from: /camera/camera_info
                to: /camera/camera/camera_info
      explanation: Starts AprilTag processing and connects rectified image and CameraInfo topics.
  - id: M-6-PC-3
    text: Static inspection shows the AprilTag node receives the packaged family and tag configuration.
    evaluation: static
    reference_evidence:
    - kind: launch
      path: launch/camera_36h11.launch.yml
      locator: tags_36h11.yaml
      snippet: |2-
              param:
              - from: $(find-pkg-share apriltag_ros)/cfg/tags_36h11.yaml
      explanation: Loads the packaged tags_36h11 configuration into the AprilTag component.
    - kind: config
      path: cfg/tags_36h11.yaml
      locator: family
      snippet: |2-
                image_transport: raw    # image format
                family: 36h11           # tag family name
                size: 0.173             # tag edge size in meter
                max_hamming: 0          # maximum allowed hamming distance (corrected bits)
      explanation: Defines the demo image transport, tag family, default size, and Hamming threshold.
    - kind: config
      path: cfg/tags_36h11.yaml
      locator: tag
      snippet: |2-
                tag:
                    ids: [9, 14]            # tag ID
                    frames: [base, object]  # optional frame name
                    sizes: [0.162, 0.162]   # optional tag-specific edge size
      explanation: Defines the demo's per-tag IDs, frames, and sizes.
  - id: M-6-PC-4
    text: Static inspection shows the launch and configuration directories are installed into the package
      share directory.
    evaluation: static
    reference_evidence:
    - kind: build
      path: CMakeLists.txt
      locator: install(DIRECTORY cfg
      snippet: |-
        install(DIRECTORY cfg
            DESTINATION share/${PROJECT_NAME}
        )

        install(DIRECTORY launch
            DESTINATION share/${PROJECT_NAME}
        )
      explanation: Installs both cfg and launch directories into the package share directory.
