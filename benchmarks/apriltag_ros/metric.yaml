package_name: apriltag_ros

metrics:
- id: FR-1
  text: The detector accepts synchronized camera images and calibration data, detects
    configured AprilTags, and publishes an AprilTagDetectionArray containing accepted
    detection metadata.
  pass_criteria:
    - id: FR-1-PC-1
      text: >-
        Synchronized image and CameraInfo inputs are consumed together for
        detection processing.
    - id: FR-1-PC-2
      text: >-
        Camera images are passed through the configured AprilTag detector.
    - id: FR-1-PC-3
      text: >-
        Accepted detections are converted into AprilTag detection messages.
    - id: FR-1-PC-4
      text: >-
        An AprilTagDetectionArray containing accepted detections is
        published.

- id: FR-2
  text: When pose estimation is enabled and valid camera intrinsics are available,
    the detector broadcasts one transform per accepted tag from the image frame to
    its configured or generated tag frame.
  pass_criteria:
    - id: FR-2-PC-1
      text: >-
        Pose estimation is gated by its enable state and valid camera
        intrinsics.
    - id: FR-2-PC-2
      text: >-
        Tag pose is estimated from detection corners, camera intrinsics, and
        tag size.
    - id: FR-2-PC-3
      text: >-
        Each transform uses the image frame as parent and a configured or
        derived tag frame as child.
    - id: FR-2-PC-4
      text: >-
        The resulting tag transforms are broadcast through TF.

- id: FR-3
  text: The detector filters detected tags by configured IDs and maximum Hamming distance,
    and uses per-tag frame names and sizes when supplied.
  pass_criteria:
    - id: FR-3-PC-1
      text: >-
        Detections whose tag IDs are not configured are rejected when an ID
        filter is present.
    - id: FR-3-PC-2
      text: >-
        Detections exceeding the maximum Hamming correction are rejected.
    - id: FR-3-PC-3
      text: >-
        A configured per-ID frame is selected when the detected tag ID has a
        frame override.
    - id: FR-3-PC-4
      text: >-
        A configured per-ID tag size is selected when the detected tag ID
        has a size override.

- id: FR-4
  text: The detector rejects startup configurations with an unsupported tag family
    or mismatched tag ID, frame-name, or size list lengths.
  pass_criteria:
    - id: FR-4-PC-1
      text: >-
        Startup rejects mismatched tag ID and frame-list lengths.
    - id: FR-4-PC-2
      text: >-
        Startup rejects mismatched tag ID and size-list lengths.
    - id: FR-4-PC-3
      text: >-
        Startup rejects unsupported tag families with an explicit error.

- id: FR-5
  text: Runtime updates to detector tuning, maximum Hamming distance, and profiling
    settings alter subsequent detection processing.
  pass_criteria:
    - id: FR-5-PC-1
      text: >-
        Supported detector tuning settings can be updated at runtime.
    - id: FR-5-PC-2
      text: >-
        Runtime updates change the maximum Hamming correction.
    - id: FR-5-PC-3
      text: >-
        Runtime updates change detector profiling state.
    - id: FR-5-PC-4
      text: >-
        Subsequent detection processing uses the current filtering and
        profiling settings.

- id: FR-6
  text: The installed camera demonstration launch accepts a camera-device selection
    and configures AprilTag detection for rectified camera imagery.
  pass_criteria:
    - id: FR-6-PC-1
      text: >-
        The demonstration launch declares a configurable camera device
        argument.
    - id: FR-6-PC-2
      text: >-
        The launch composes camera input, rectification, and AprilTag
        processing.
    - id: FR-6-PC-3
      text: >-
        The AprilTag node receives the packaged family and tag
        configuration.
    - id: FR-6-PC-4
      text: >-
        The launch and configuration directories are installed into the
        package share directory.
