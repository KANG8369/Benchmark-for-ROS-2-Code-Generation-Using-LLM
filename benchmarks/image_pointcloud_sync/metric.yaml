package_name: image_pointcloud_sync
reference:
  root: reference/
metrics:
- id: M-1
  name: Configurable approximate image-point-cloud synchronization
  description: Image and PointCloud2 inputs are paired by an approximate-time synchronizer
    configured by queue capacity and maximum timestamp interval as required by FR-1.
  requirement_ids:
  - FR-1
  pass_criteria:
  - id: M-1-PC-1
    text: The synchronization policy pairs sensor_msgs Image and PointCloud2 messages
      using approximate-time synchronization.
    evaluation: static
    reference_evidence:
    - path: include/image_pointcloud_sync/image_pointcloud_sync.hpp
      anchor: using SyncPolicy
      snippet: |2-
        class ImagePointCloudSync : public rclcpp::Node
        {
        public:
          using Image = sensor_msgs::msg::Image;
          using PointCloud2 = sensor_msgs::msg::PointCloud2;

          explicit ImagePointCloudSync(const rclcpp::NodeOptions & options = rclcpp::NodeOptions());

        private:
          void syncCallback(
            const Image::ConstSharedPtr & image,
            const PointCloud2::ConstSharedPtr & cloud);

          using SyncPolicy = message_filters::sync_policies::ApproximateTime<Image, PointCloud2>;
          using Sync = message_filters::Synchronizer<SyncPolicy>;
      explanation: Defines one approximate-time policy and callback over the package's
        Image and PointCloud2 message aliases.
  - id: M-1-PC-2
    text: The synchronizer uses the configured queue size and maximum interval and invokes
      the paired-message callback for accepted inputs.
    evaluation: static
    reference_evidence:
    - path: src/image_pointcloud_sync.cpp
      anchor: setMaxIntervalDuration
      snippet: |2-
          queue_size_ = this->get_parameter("queue_size").as_int();
          const double slop = this->get_parameter("slop").as_double();

          const auto qos = rmw_qos_profile_sensor_data;
          image_sub_ = std::make_shared<message_filters::Subscriber<Image>>(
            this, image_topic_, qos);
          cloud_sub_ = std::make_shared<message_filters::Subscriber<PointCloud2>>(
            this, cloud_topic_, qos);

          synced_image_pub_ = this->create_publisher<Image>(synced_image_topic_, rclcpp::SensorDataQoS());
          synced_cloud_pub_ = this->create_publisher<PointCloud2>(
            synced_cloud_topic_, rclcpp::SensorDataQoS());

          sync_ = std::make_shared<Sync>(SyncPolicy(queue_size_), *image_sub_, *cloud_sub_);
          sync_->setMaxIntervalDuration(rclcpp::Duration::from_seconds(slop));
          sync_->registerCallback(std::bind(&ImagePointCloudSync::syncCallback, this, _1, _2));
      explanation: Reads both synchronization controls, constructs the two-input policy,
        applies the maximum interval, and registers the callback.
- id: M-2
  name: Common earlier timestamp and paired publication
  description: Each synchronized input pair is copied and published with both output
    timestamps set to the earlier input timestamp as required by FR-2.
  requirement_ids:
  - FR-2
  pass_criteria:
  - id: M-2-PC-1
    text: The common output timestamp is selected as the earlier timestamp of the accepted
      image and point-cloud pair.
    evaluation: static
    reference_evidence:
    - path: src/image_pointcloud_sync.cpp
      anchor: const rclcpp::Time matched
      snippet: |2-
        void ImagePointCloudSync::syncCallback(
          const Image::ConstSharedPtr & image_in,
          const PointCloud2::ConstSharedPtr & cloud_in)
        {
          // Align both messages to a common stamp (earlier of the two), following the
          // cam_sync_ros2 approach of emitting paired messages with matched headers.
          const rclcpp::Time t_image(image_in->header.stamp);
          const rclcpp::Time t_cloud(cloud_in->header.stamp);
          const rclcpp::Time matched = (t_cloud < t_image) ? t_cloud : t_image;
      explanation: Compares the two accepted input stamps and stores their minimum as
        the timestamp shared by the output pair.
  - id: M-2-PC-2
    text: The node copies both accepted messages, changes both copied header stamps to
      the common timestamp, and publishes both copies.
    evaluation: static
    reference_evidence:
    - path: src/image_pointcloud_sync.cpp
      anchor: image_out->header.stamp
      snippet: |2-
          auto image_out = std::make_shared<Image>(*image_in);
          auto cloud_out = std::make_shared<PointCloud2>(*cloud_in);
          image_out->header.stamp = matched;
          cloud_out->header.stamp = matched;

          synced_image_pub_->publish(*image_out);
          synced_cloud_pub_->publish(*cloud_out);
      explanation: Copy construction preserves the input contents, after which only
        each copied header stamp is replaced before paired publication.
- id: M-3
  name: Configurable sensor-data endpoints
  description: All four endpoint names are configurable and both subscriptions and
    publishers use sensor-data QoS as required by FR-3.
  requirement_ids:
  - FR-3
  pass_criteria:
  - id: M-3-PC-1
    text: The node declares and reads separate parameters for both input topics and
      both synchronized-output topics.
    evaluation: static
    reference_evidence:
    - path: src/image_pointcloud_sync.cpp
      anchor: declare_parameter<std::string>("image_topic"
      snippet: |2-
          this->declare_parameter<std::string>("image_topic", "/camera/image_raw");
          this->declare_parameter<std::string>("cloud_topic", "/points");
          this->declare_parameter<std::string>("synced_image_topic", "/synced/image");
          this->declare_parameter<std::string>("synced_cloud_topic", "/synced/points");
          this->declare_parameter<int>("queue_size", 10);
          this->declare_parameter<double>("slop", 0.05);

          image_topic_ = this->get_parameter("image_topic").as_string();
          cloud_topic_ = this->get_parameter("cloud_topic").as_string();
          synced_image_topic_ = this->get_parameter("synced_image_topic").as_string();
          synced_cloud_topic_ = this->get_parameter("synced_cloud_topic").as_string();
      explanation: Defines the default topic contract and loads all four endpoint names
        from independently configurable parameters.
  - id: M-3-PC-2
    text: Both typed input subscribers and both typed output publishers use sensor-data
      QoS.
    evaluation: static
    reference_evidence:
    - path: src/image_pointcloud_sync.cpp
      anchor: rmw_qos_profile_sensor_data
      snippet: |2-
          const auto qos = rmw_qos_profile_sensor_data;
          image_sub_ = std::make_shared<message_filters::Subscriber<Image>>(
            this, image_topic_, qos);
          cloud_sub_ = std::make_shared<message_filters::Subscriber<PointCloud2>>(
            this, cloud_topic_, qos);

          synced_image_pub_ = this->create_publisher<Image>(synced_image_topic_, rclcpp::SensorDataQoS());
          synced_cloud_pub_ = this->create_publisher<PointCloud2>(
            synced_cloud_topic_, rclcpp::SensorDataQoS());
      explanation: Creates Image and PointCloud2 subscribers with the sensor-data RMW
        profile and matching publishers with SensorDataQoS.
- id: M-4
  name: Complete launch-time configuration forwarding
  description: The launch description exposes every public setting and passes each
    selected value to the synchronizer executable as required by FR-4.
  requirement_ids:
  - FR-4
  pass_criteria:
  - id: M-4-PC-1
    text: The launch description declares arguments for four topic names, queue size,
      and maximum synchronization interval.
    evaluation: static
    reference_evidence:
    - path: launch/image_pointcloud_sync.launch.py
      anchor: DeclareLaunchArgument('image_topic'
      snippet: |2-
        def generate_launch_description():
            return LaunchDescription([
                DeclareLaunchArgument('image_topic', default_value='/camera/image_raw'),
                DeclareLaunchArgument('cloud_topic', default_value='/points'),
                DeclareLaunchArgument('synced_image_topic', default_value='/synced/image'),
                DeclareLaunchArgument('synced_cloud_topic', default_value='/synced/points'),
                DeclareLaunchArgument('queue_size', default_value='10'),
                DeclareLaunchArgument('slop', default_value='0.05'),
      explanation: Exposes all six node settings as public launch arguments with defaults
        matching the node's declared parameters.
  - id: M-4-PC-2
    text: The launch description starts the package executable under the synchronizer
      node name and forwards all six launch configurations as parameters.
    evaluation: static
    reference_evidence:
    - path: launch/image_pointcloud_sync.launch.py
      anchor: executable='image_pointcloud_sync_node'
      snippet: |2-
                Node(
                    package='image_pointcloud_sync',
                    executable='image_pointcloud_sync_node',
                    name='image_pointcloud_sync',
                    output='screen',
                    parameters=[{
                        'image_topic': LaunchConfiguration('image_topic'),
                        'cloud_topic': LaunchConfiguration('cloud_topic'),
                        'synced_image_topic': LaunchConfiguration('synced_image_topic'),
                        'synced_cloud_topic': LaunchConfiguration('synced_cloud_topic'),
                        'queue_size': LaunchConfiguration('queue_size'),
                        'slop': LaunchConfiguration('slop'),
                    }],
                ),
      explanation: Starts the registered executable and maps every public launch argument
        to its corresponding node parameter.
- id: M-5
  name: Component and executable packaging
  description: The C++ implementation is built and registered for both component loading
    and standalone execution as required by FR-5.
  requirement_ids:
  - FR-5
  pass_criteria:
  - id: M-5-PC-1
    text: The node implementation is built as a shared library with the ROS dependencies
      needed by its synchronization and component APIs.
    evaluation: static
    reference_evidence:
    - path: CMakeLists.txt
      anchor: add_library(${PROJECT_NAME}_node SHARED
      snippet: |2-
        add_library(${PROJECT_NAME}_node SHARED
          src/image_pointcloud_sync.cpp)

        target_include_directories(${PROJECT_NAME}_node PUBLIC
          $<BUILD_INTERFACE:${CMAKE_CURRENT_SOURCE_DIR}/include>
          $<INSTALL_INTERFACE:include>)

        ament_target_dependencies(${PROJECT_NAME}_node
          message_filters
          rclcpp
          rclcpp_components
          sensor_msgs)
      explanation: Builds the production source as a shared component library and links
        the synchronization, ROS client, component, and sensor message dependencies.
  - id: M-5-PC-2
    text: The shared node target registers the ImagePointCloudSync plugin and provides
      the image_pointcloud_sync_node executable.
    evaluation: static
    reference_evidence:
    - path: CMakeLists.txt
      anchor: rclcpp_components_register_node
      snippet: |2-
        rclcpp_components_register_node(${PROJECT_NAME}_node
          PLUGIN "image_pointcloud_sync::ImagePointCloudSync"
          EXECUTABLE image_pointcloud_sync_node)
      explanation: The component registration declares both the loadable plugin class
        and its generated standalone executable.
  - id: M-5-PC-3
    text: The implementation source registers the synchronizer class with the ROS 2
      component registry.
    evaluation: static
    reference_evidence:
    - path: src/image_pointcloud_sync.cpp
      anchor: RCLCPP_COMPONENTS_REGISTER_NODE
      snippet: |2-
        }  // namespace image_pointcloud_sync

        RCLCPP_COMPONENTS_REGISTER_NODE(image_pointcloud_sync::ImagePointCloudSync)
      explanation: Registers the implemented node class so it can be discovered and
        loaded as the CMake-declared component plugin.
