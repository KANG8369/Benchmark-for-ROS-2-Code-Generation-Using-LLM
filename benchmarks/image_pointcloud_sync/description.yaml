intent:
  package_name: image_pointcloud_sync
  summary: Approximately synchronizes camera images with lidar point clouds and republishes
    each accepted pair with one matched timestamp.
  scope: Implements a configurable C++ synchronizer node, composable component registration,
    a standalone executable, and launch orchestration; image and point-cloud producers,
    clock synchronization, TF publication, and downstream sensor-fusion consumers are
    external responsibilities.
functional_requirements:
- id: FR-1
  text: The node approximately pairs Image and PointCloud2 messages from configurable
    input topics using a configurable synchronization queue and maximum timestamp interval.
- id: FR-2
  text: For every accepted pair, the node publishes copied image and point-cloud messages
    whose header timestamps both equal the earlier input timestamp while preserving the
    remaining input message contents.
- id: FR-3
  text: The node uses sensor-data QoS for both configurable input subscriptions and both
    configurable synchronized-output publishers.
- id: FR-4
  text: The supplied launch description exposes all topic and synchronization settings
    as launch arguments and starts the synchronizer executable with those values as node
    parameters.
- id: FR-5
  text: The package makes the synchronizer available as both a composable ROS 2 component
    and a standalone executable.
interfaces:
  nodes:
  - name: image_pointcloud_sync
    responsibility: Approximately pair camera images with point clouds and republish
      copied pairs with a common timestamp.
    topics:
    - name: <image_topic>
      type: sensor_msgs/msg/Image
      direction: subscribe
      purpose: Receives camera images on the configured input topic, which defaults to
        /camera/image_raw.
    - name: <cloud_topic>
      type: sensor_msgs/msg/PointCloud2
      direction: subscribe
      purpose: Receives lidar point clouds on the configured input topic, which defaults
        to /points.
    - name: <synced_image_topic>
      type: sensor_msgs/msg/Image
      direction: publish
      purpose: Publishes timestamp-aligned image copies on the configured output topic,
        which defaults to /synced/image.
    - name: <synced_cloud_topic>
      type: sensor_msgs/msg/PointCloud2
      direction: publish
      purpose: Publishes timestamp-aligned point-cloud copies on the configured output
        topic, which defaults to /synced/points.
    parameters:
    - name: image_topic
      type: string
      purpose: Selects the camera-image input topic.
    - name: cloud_topic
      type: string
      purpose: Selects the point-cloud input topic.
    - name: synced_image_topic
      type: string
      purpose: Selects the synchronized-image output topic.
    - name: synced_cloud_topic
      type: string
      purpose: Selects the synchronized-point-cloud output topic.
    - name: queue_size
      type: integer
      purpose: Sets the approximate-time synchronizer queue capacity.
    - name: slop
      type: double
      purpose: Sets the maximum timestamp interval in seconds accepted for an approximate
        image and point-cloud pair.
  launch_arguments:
  - name: image_topic
    purpose: Selects the camera-image input topic passed to the node.
  - name: cloud_topic
    purpose: Selects the point-cloud input topic passed to the node.
  - name: synced_image_topic
    purpose: Selects the synchronized-image output topic passed to the node.
  - name: synced_cloud_topic
    purpose: Selects the synchronized-point-cloud output topic passed to the node.
  - name: queue_size
    purpose: Sets the synchronization queue capacity passed to the node.
  - name: slop
    purpose: Sets the maximum accepted timestamp interval passed to the node.
