intent:
  package_name: wall_follower_ros2
  summary: Provides a rule-based controller that converts laser-scan obstacle measurements
    into robot velocity commands for wall following and obstacle avoidance.
  scope: The package implements the laser-scan-to-velocity control node and supplies
    a launch file that includes a Gazebo simulation launch; provision of laser scans,
    robot actuation, and simulation implementation are external responsibilities.
functional_requirements:
- id: FR-1
  text: The controller classifies each received laser scan into five directional obstacle
    zones and publishes Twist commands that move forward, turn left, or reverse and
    turn according to the detected obstacle pattern.
- id: FR-2
  text: The controller does not publish motion commands until it has received at least
    one laser scan.
- id: FR-3
  text: The controller publishes a zero-valued Twist command when it receives SIGINT
    before shutting down.
- id: FR-4
  text: The supplied wall-follower launch starts the controller with configured linear
    and angular velocity settings and includes the package's empty Gazebo simulation
    launch.
interfaces:
  nodes:
  - name: wall_follower_ros2
    responsibility: Consumes laser range data, determines an obstacle-avoidance driving
      state, and publishes robot velocity commands.
    topics:
    - name: scan
      type: sensor_msgs/msg/LaserScan
      direction: subscribe
      purpose: Receives laser range readings used to detect nearby obstacles by directional
        zone.
    - name: cmd_vel
      type: geometry_msgs/msg/Twist
      direction: publish
      purpose: Publishes linear and angular velocity commands, including a zero-velocity
        command during SIGINT shutdown.
    parameters:
    - name: linear_x_velocity
      type: double
      purpose: Sets the magnitude of forward and reverse linear velocity commands.
    - name: angular_z_velocity
      type: double
      purpose: Sets the angular velocity used for left-turn commands.
    - name: safety_distance
      type: double
      purpose: Sets the range threshold below which a directional zone is considered
        blocked.
    - name: reverse_ranges_array
      type: bool
      purpose: Controls whether directional laser-zone distances are reversed to match
        scan ordering.
