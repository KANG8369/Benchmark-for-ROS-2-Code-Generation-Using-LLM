intent:
  package_name: wall_follower_ros2
  summary: Provides a rule-based controller that converts laser-scan obstacle measurements
    into robot velocity commands for wall following and obstacle avoidance.
  scope: The package implements the laser-scan-to-velocity control node and supplies
    a launch file that includes a Gazebo simulation launch; provision of laser scans,
    robot actuation, and simulation implementation are external responsibilities.
