package_name: wall_follower_ros2
reference:
  root: reference/
metrics:
- id: M-1
  name: Five-zone wall-following control
  description: Laser ranges are reduced to five directional obstacle zones and translated into forward, left-turn, or reverse-turn commands as required by FR-1.
  requirement_ids:
  - FR-1
  pass_criteria:
  - id: M-1-PC-1
    text: Each scan is divided into five directional fifths and the nearest range in every zone is retained.
    evaluation: static
    reference_evidence:
    - path: src/wall_follower_ros2.cpp
      anchor: z[0] =
      snippet: |2-
            z[0] = _scan_msg->range_max;
            z[1] = _scan_msg->range_max;
            z[2] = _scan_msg->range_max;
            z[3] = _scan_msg->range_max;
            z[4] = _scan_msg->range_max;
      explanation: Initializes one nearest-range accumulator for each of the five directional zones.
    - path: src/wall_follower_ros2.cpp
      anchor: ranges.size() / 5
      snippet: |2-
            // cycle trough all laser range rays
            // to determine the state of the environment surroundings
            for (auto i = 0u; i < _scan_msg->ranges.size(); ++i) {
              // laser rays to the far right side
              if (i < static_cast<unsigned>(_scan_msg->ranges.size() / 5)) {
                // get the distance reading to the closest object in the given zone
                if (_scan_msg->ranges[i] < z[0]) {
                  z[0] = _scan_msg->ranges[i];
                  indices[0] = i;
                }
              }
      explanation: Maps the first scan fifth to the far-right zone and retains its nearest reading.
    - path: src/wall_follower_ros2.cpp
      anchor: ranges.size() * 2 / 5
      snippet: |2-
              // laser rays to the front-right side
              else if (i >= static_cast<unsigned>(_scan_msg->ranges.size() / 5) &&
                       i < static_cast<unsigned>(_scan_msg->ranges.size() * 2 / 5)) {
                // get the distance reading to the closest object in the given zone
                if (_scan_msg->ranges[i] < z[1]) {
                  z[1] = _scan_msg->ranges[i];
                  indices[1] = i;
                }
              }
      explanation: Maps the second scan fifth to the front-right zone and retains its nearest reading.
    - path: src/wall_follower_ros2.cpp
      anchor: ranges.size() * 3 / 5
      snippet: |2-
              // laser rays to the front
              else if (i >= static_cast<unsigned>(_scan_msg->ranges.size() * 2 / 5) &&
                       i < static_cast<unsigned>(_scan_msg->ranges.size() * 3 / 5)) {
                // get the distance reading to the closest object in the given zone
                if (_scan_msg->ranges[i] < z[2]) {
                  z[2] = _scan_msg->ranges[i];
                  indices[2] = i;
                }
              }
      explanation: Maps the third scan fifth to the front zone and retains its nearest reading.
    - path: src/wall_follower_ros2.cpp
      anchor: ranges.size() * 4 / 5
      snippet: |2-
              // laser rays to the front-left side
              else if (i >= static_cast<unsigned>(_scan_msg->ranges.size() * 3 / 5) &&
                       i < static_cast<unsigned>(_scan_msg->ranges.size() * 4 / 5)) {
                // get the distance reading to the closest object in the given zone
                if (_scan_msg->ranges[i] < z[3]) {
                  z[3] = _scan_msg->ranges[i];
                  indices[3] = i;
                }
              }
      explanation: Maps the fourth scan fifth to the front-left zone and retains its nearest reading.
    - path: src/wall_follower_ros2.cpp
      anchor: indices[4]
      snippet: |2-
              // laser rays to the far left side
              else if (i >= static_cast<unsigned>(_scan_msg->ranges.size() * 4 / 5) &&
                       i <= static_cast<unsigned>(_scan_msg->ranges.size())) {
                // get the distance reading to the closest object in the given zone
                if (_scan_msg->ranges[i] < z[4]) {
                  z[4] = _scan_msg->ranges[i];
                  indices[4] = i;
                }
              } else {
                RCLCPP_ERROR(this->get_logger(), "Ray index not found in range size");
              }
            } // end of for
      explanation: Maps the final scan fifth to the far-left zone, retains its nearest reading, and rejects unmatched indexes.
  - id: M-1-PC-2
    text: Obstacle combinations are classified against safety_distance into explicit driving states.
    evaluation: static
    reference_evidence:
    - path: src/wall_follower_ros2.cpp
      anchor: 'Case 1: no obstacles detected'
      snippet: |2-
            if (z[0] > d && z[1] > d && z[2] > d && z[3] > d && z[4] > d) {
              RCLCPP_DEBUG(this->get_logger(), "Case 1: no obstacles detected");
              drive_logic_state = 0; // find obstacle: turn CW and move ahead
            } else if (z[0] > d && z[1] > d && z[2] < d && z[3] > d && z[4] > d) {
              RCLCPP_DEBUG(this->get_logger(), "Case 2: obstacle only in front zone");
              drive_logic_state = 1; // turn left
      explanation: Compares all five directional minima with the configured threshold and selects behavior states.
    - path: src/wall_follower_ros2.cpp
      anchor: Case 31
      snippet: |2-
            } else if (z[0] < d && z[1] < d && z[2] < d && z[3] < d && z[4] < d) {
              RCLCPP_DEBUG(this->get_logger(), "Case 31: obst. in right, front-right, "
                                               "front, front-left and left zone");
              drive_logic_state = 4; // reverse turning left
      explanation: Classifies the fully blocked five-zone pattern into the reverse-turn state.
  - id: M-1-PC-3
    text: Driving states produce forward, left-turn, and reverse-left Twist commands using the configured velocity magnitudes.
    evaluation: static
    reference_evidence:
    - path: src/wall_follower_ros2.cpp
      anchor: 'case 0:'
      snippet: |2-
            case 0:
              // move straight ahead: No obstacle detected
              vel_msg.linear.x = linear_x_velocity_;
              vel_msg.angular.z = 0.0;
              RCLCPP_DEBUG(this->get_logger(),
                           "Behaviour 0: Moving straight ahead, no obstacle detected.");
              break;
        
            case 1:
              // Turn left: obstacle in front-right and/or front and/or front-left
              vel_msg.linear.x = 0.0;
              vel_msg.angular.z = angular_z_velocity_;
              RCLCPP_DEBUG(this->get_logger(),
                           "Behaviour 1: Turn left, obstacle in front-right and/or "
                           "front and/or front-left zone.");
        
              break;
      explanation: Maps normal and obstructed-front states to forward and left-turn commands.
    - path: src/wall_follower_ros2.cpp
      anchor: case 4
      snippet: |2-
            case 4:
              // Reverse turning left: obst. in right, front-right, front, front-left
              // and left zone
              vel_msg.linear.x = -linear_x_velocity_;
              vel_msg.angular.z = angular_z_velocity_;
              RCLCPP_DEBUG(this->get_logger(),
                           "Behaviour 4: Reverse turning left, obst. in right, "
                           "front-right, front, front-left and left zone");
              break;
      explanation: Maps the fully blocked state to reverse linear motion with a left turn.
  - id: M-1-PC-4
    text: The selected Twist command is published after scan-derived state and velocity computation.
    evaluation: static
    reference_evidence:
    - path: src/wall_follower_ros2.cpp
      anchor: set_drive_logic_state()
      snippet: |2-
            } else { // define logic used to drive the robot
              // determine the movement state to drive the robot
              set_drive_logic_state();
              // fill in velocity message
              determine_vel_msg();
              // publish velocity message to the robot
              vel_msg_publisher_->publish(vel_msg);
            }
      explanation: Publishes the Twist only after deriving the drive state and corresponding velocity.
- id: M-2
  name: First-scan motion gate
  description: Motion publication is blocked until at least one scan has populated the obstacle zones, satisfying FR-2.
  requirement_ids:
  - FR-2
  pass_criteria:
  - id: M-2-PC-1
    text: The controller starts with a false scan-received flag and sets it true in the LaserScan callback.
    evaluation: static
    reference_evidence:
    - path: src/wall_follower_ros2.cpp
      anchor: readings_received
      snippet: |2-
          // boolean flag to prevent driving without laser scanner data received
          bool readings_received = false;
      explanation: Initializes the motion gate as closed.
    - path: src/wall_follower_ros2.cpp
      anchor: laser_callback
      snippet: |2-
          void laser_callback(const sensor_msgs::msg::LaserScan::SharedPtr _scan_msg) {
            readings_received = true;
      explanation: Opens the gate only when a scan callback begins processing data.
  - id: M-2-PC-2
    text: The timer returns before state computation and publication while no scan has been received.
    evaluation: static
    reference_evidence:
    - path: src/wall_follower_ros2.cpp
      anchor: timerCallback
      snippet: |2-
          void timerCallback() {
            if (readings_received == false) {
              // return early and skip the rest of the function
              return;
            } else { // define logic used to drive the robot
              // determine the movement state to drive the robot
              set_drive_logic_state();
              // fill in velocity message
              determine_vel_msg();
              // publish velocity message to the robot
              vel_msg_publisher_->publish(vel_msg);
            }
          }
      explanation: The controlling condition makes the publish path unreachable until the flag is set.
- id: M-3
  name: SIGINT stop command
  description: SIGINT causes a zero Twist to be published before shutdown as required by FR-3.
  requirement_ids:
  - FR-3
  pass_criteria:
  - id: M-3-PC-1
    text: The shutdown helper constructs a default zero-valued Twist and publishes it.
    evaluation: static
    reference_evidence:
    - path: src/wall_follower_ros2.cpp
      anchor: void sigint
      snippet: |2-
          void sigint() {
            // stop the robot on shutdown
            geometry_msgs::msg::Twist zero_vel_msg;
            vel_msg_publisher_->publish(zero_vel_msg);
          }
      explanation: A default-constructed Twist has zero linear and angular components and is published as the stop command.
  - id: M-3-PC-2
    text: The SIGINT handler invokes the zero-command helper before ROS shutdown and process exit.
    evaluation: static
    reference_evidence:
    - path: src/wall_follower_ros2.cpp
      anchor: std::signal
      snippet: |2-
          std::signal(SIGINT, signal_handler);
          sigint_handler = [obst_avoidance](int signal) {
            std::cout << "received signal " << signal << std::endl;
            obst_avoidance->sigint();
            rclcpp::shutdown();
            exit(signal);
          };
      explanation: Orders stop publication ahead of shutdown and exit for SIGINT.
- id: M-4
  name: Wall-follower simulation launch
  description: The supplied launch starts the controller with configured velocities and includes its Gazebo simulation launch, satisfying FR-4.
  requirement_ids:
  - FR-4
  pass_criteria:
  - id: M-4-PC-1
    text: The wall-follower launch starts the controller and supplies linear_x_velocity and angular_z_velocity parameters.
    evaluation: static
    reference_evidence:
    - path: launch/wall_follower_ros2.launch.xml
      anchor: wall_follower_ros2
      snippet: |2-
          <node name="wall_follower_ros2" pkg="wall_follower_ros2" exec="wall_follower_ros2" output="screen">
            <param name="linear_x_velocity" value="0.3"/>
            <param name="angular_z_velocity" value="0.3"/>
          </node>
      explanation: Launches the controller executable with both configured command magnitudes.
  - id: M-4-PC-2
    text: The wall-follower launch includes the package empty_simulation launch, which in turn includes Gazebo.
    evaluation: static
    reference_evidence:
    - path: launch/wall_follower_ros2.launch.xml
      anchor: empty_simulation.launch.py
      snippet: |2-
          <!-- Start a Gazebo simulation -->
          <include file="$(find-pkg-share wall_follower_ros2)/launch/empty_simulation.launch.py"/>
      explanation: Includes the package's simulation launch from the wall-follower launch.
    - path: launch/empty_simulation.launch.py
      anchor: gazebo.launch.py
      snippet: |2-
            gazebo = IncludeLaunchDescription(
                PythonLaunchDescriptionSource(
                    os.path.join(pkg_gazebo_ros, 'launch', 'gazebo.launch.py'),
                )
            )
      explanation: The included simulation launch resolves and includes the gazebo_ros Gazebo launch.
