[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ros2-codegen-benchmark-mcp"
version = "0.3.0"
description = "MCP resources and ROS 2 tools for the ROS 2 code-generation benchmark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp==2.0.0",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
ros2-benchmark-mcp = "benchmark_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark_mcp"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
